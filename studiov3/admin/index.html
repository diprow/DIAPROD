<style>
/* ============================================================
   DIA PROD — studio portal
   Same tokens as the public site; only what this page uses.
   ============================================================ */
:root{
  --pure-black:#000000;
  --carbon:#111111;
  --obsidian:#1d1d1f;
  --graphite:#333336;
  --smoke:#424245;
  --platinum:#86868b;
  --silver-mist:#cccccc;
  --frost-white:#f5f5f7;
  --paper-white:#ffffff;

  --apple-blue:#0071e3;
  --halo-blue:#2997ff;
  --reef-teal:#00a1b3;
  --signal-orange:#f56900;
  --iris-violet:#8668ff;

  --display:'SF Pro Display',-apple-system,BlinkMacSystemFont,'Inter',system-ui,'Segoe UI',sans-serif;
  --text:'SF Pro Text',-apple-system,BlinkMacSystemFont,'Inter',system-ui,'Segoe UI',sans-serif;

  --t-caption:10px;
  --t-xs:12px;
  --t-body:14px;
  --t-lg:17px;
  --t-h-sm:19px;
  --t-h:clamp(21px,2.2vw,24px);
  --t-h-lg:clamp(26px,3.2vw,32px);
  --t-display:clamp(30px,4.6vw,44px);

  --s4:4px; --s8:8px; --s12:12px; --s16:16px; --s20:20px; --s24:24px;
  --s28:28px; --s32:32px; --s40:40px; --s48:48px; --s60:60px;

  --page:1180px;
  --gutter:clamp(18px,4vw,40px);

  --r-card:22px;
  --r-card-lg:28px;
  --r-btn:32px;
  --r-pill:980px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--pure-black);color:var(--frost-white);
  font-family:var(--text);font-size:var(--t-lg);line-height:1.47;
  letter-spacing:-0.01em;-webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
button,input,textarea,select{font-family:inherit;font-size:inherit;letter-spacing:inherit;color:inherit}
a{color:var(--halo-blue);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:var(--apple-blue);color:#fff}
:focus-visible{outline:2px solid var(--halo-blue);outline-offset:3px;border-radius:10px}
::placeholder{color:var(--smoke)}
[hidden]{display:none!important}

/* ---------- type ---------- */
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
.display-type{font-size:var(--t-display);line-height:1.07;letter-spacing:-0.015em}
.h-lg{font-size:var(--t-h-lg);line-height:1.14;letter-spacing:-0.01em;font-weight:700}
.h-md{font-size:var(--t-h);line-height:1.17;letter-spacing:-0.01em;font-weight:600}
.h-sm{font-size:var(--t-h-sm);line-height:1.21;letter-spacing:-0.015em;font-weight:600}
.body-copy{font-size:var(--t-lg);line-height:1.47;color:var(--platinum);margin:0;max-width:64ch}
.small{font-size:var(--t-body);line-height:1.43;letter-spacing:-0.016em;color:var(--platinum);margin:0}
.kicker{font-size:var(--t-xs);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--platinum);margin:0}
.tnum{font-variant-numeric:tabular-nums}
.warn{color:var(--signal-orange)}

/* ---------- layout ---------- */
.wrap{max-width:var(--page);margin:0 auto;padding-inline:var(--gutter);width:100%}
.page{padding-block:var(--s40) var(--s60)}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s8);
  border:none;cursor:pointer;border-radius:var(--r-btn);padding:11px 20px;
  font-size:var(--t-body);font-weight:600;letter-spacing:-0.016em;background:transparent;
  transition:background .2s ease,color .2s ease,border-color .2s ease,opacity .2s ease;
}
.btn-primary{background:var(--apple-blue);color:var(--paper-white)}
.btn-primary:hover{background:#0077ed}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-lg{padding:14px 26px;font-size:var(--t-lg)}
.btn-line{
  background:none;border:1px solid var(--graphite);color:var(--frost-white);
  border-radius:var(--r-pill);padding:9px 18px;cursor:pointer;
  font-size:var(--t-xs);transition:background .2s ease,border-color .2s ease;white-space:nowrap;
}
.btn-line:hover:not(:disabled){background:var(--graphite)}
.btn-line:disabled{opacity:.4;cursor:default}
.linky{background:none;border:none;padding:0;cursor:pointer;color:var(--halo-blue);font-size:inherit}
.linky:hover{text-decoration:underline}

/* ---------- top bar ---------- */
.pnav{
  position:sticky;top:0;z-index:60;background:rgba(0,0,0,.86);
  backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
  border-bottom:1px solid var(--graphite);
}
.pnav-in{
  max-width:var(--page);margin:0 auto;padding:var(--s12) var(--gutter);
  display:flex;align-items:center;gap:var(--s16);flex-wrap:wrap;
}
.pbrand{display:flex;align-items:center;gap:10px;flex:none}
.pbrand span{font-size:var(--t-xs);font-weight:600;color:var(--platinum);letter-spacing:.08em;text-transform:uppercase}
.pright{margin-left:auto;display:flex;align-items:center;gap:var(--s12);flex-wrap:wrap}
.pwho{font-size:var(--t-xs);color:var(--platinum);overflow-wrap:anywhere}

/* ---------- tabs ---------- */
.tabbar{display:flex;gap:2px;padding:3px;border-radius:var(--r-pill);border:1px solid var(--graphite);flex:none}
.tabbtn{
  background:none;border:none;cursor:pointer;padding:7px 16px;border-radius:var(--r-pill);
  font-size:var(--t-xs);font-weight:500;color:var(--platinum);
  transition:background .2s ease,color .2s ease;white-space:nowrap;
}
.tabbtn:hover{color:var(--frost-white)}
.tabbtn[aria-current="page"]{background:var(--frost-white);color:var(--pure-black);font-weight:600}
.tabbtn b{font-weight:400;opacity:.55;margin-left:5px;font-variant-numeric:tabular-nums}
.tabbtn[aria-current="page"] b{opacity:.5}

/* ---------- head of a view ---------- */
.viewhead{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s20);flex-wrap:wrap;margin-bottom:var(--s24)}
.toolbar{display:flex;gap:var(--s12);align-items:center;flex-wrap:wrap;margin-bottom:var(--s12)}
.toolbar .input{flex:1;min-width:220px}
.chips{display:flex;flex-wrap:wrap;gap:var(--s8)}
.chip{
  background:var(--carbon);border:1px solid var(--graphite);border-radius:var(--r-pill);cursor:pointer;
  padding:8px 16px;font-size:var(--t-xs);color:var(--frost-white);transition:.2s;
}
.chip:hover{border-color:var(--smoke)}
.chip[aria-pressed="true"]{background:var(--apple-blue);border-color:var(--apple-blue);font-weight:600}
.chip b{font-weight:400;opacity:.6;margin-left:5px;font-variant-numeric:tabular-nums}
.metaline{font-size:var(--t-xs);color:var(--platinum);margin:var(--s12) 0 0}

/* ---------- fields ---------- */
.field{display:flex;flex-direction:column;gap:var(--s8);width:100%}
.field > label,.field > span{font-size:var(--t-xs);color:var(--platinum)}
.input{
  width:100%;background:var(--carbon);border:1px solid var(--graphite);border-radius:var(--r-btn);
  padding:13px 18px;color:var(--frost-white);font-size:var(--t-body);transition:border-color .2s;
}
.input:focus{outline:none;border-color:var(--apple-blue)}
select.input{appearance:none;cursor:pointer;padding-right:40px;
  background-image:linear-gradient(45deg,transparent 50%,var(--platinum) 50%),linear-gradient(135deg,var(--platinum) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;
  background-size:6px 6px,6px 6px;background-repeat:no-repeat}

/* ---------- sign in ----------
   The card is lit rather than outlined: a wide blue wash in the room
   behind it, a tight halo hugging its edge, a rim light along the top
   and a deep shadow under it, so it reads as an object above the page. */
.loginwrap{
  position:relative;isolation:isolate;
  min-height:calc(100vh - 120px);display:flex;align-items:center;justify-content:center;
  padding:var(--s40) var(--gutter);
}
.loginwrap::before{                       /* the wash on the wall behind */
  content:'';position:absolute;z-index:-1;pointer-events:none;
  width:min(820px,140vw);aspect-ratio:1;
  background:radial-gradient(circle,
    rgba(41,151,255,.10) 0%, rgba(41,151,255,.04) 34%, rgba(41,151,255,0) 66%);
}
.logincard{
  position:relative;
  width:100%;max-width:420px;
  background:linear-gradient(176deg,#181b20 0%,#101216 46%,#0b0c0e 100%);
  border:1px solid rgba(41,151,255,.34);
  border-radius:var(--r-card-lg);padding:clamp(26px,5vw,38px);
  display:flex;flex-direction:column;gap:var(--s16);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.12),          /* rim light on the top edge */
    inset 0 -1px 0 rgba(0,0,0,.55),
    0 2px 5px rgba(0,0,0,.5),
    0 26px 56px -28px rgba(0,0,0,.95),            /* it casts a shadow down */
    0 0 16px -4px rgba(41,151,255,.26),
    0 0 52px -22px rgba(41,151,255,.34);
}
.logincard::before{                       /* the halo, blurred so no edge shows */
  content:'';position:absolute;inset:-7px;z-index:-1;pointer-events:none;
  border-radius:calc(var(--r-card-lg) + 7px);
  background:linear-gradient(152deg,
    rgba(41,151,255,.75) 0%, rgba(0,161,179,.45) 46%, rgba(41,151,255,.7) 100%);
  filter:blur(13px);opacity:.4;
}
.logincard .input{background:rgba(0,0,0,.34);border-color:rgba(255,255,255,.09)}
.logincard .input:focus{border-color:var(--halo-blue);box-shadow:0 0 0 3px rgba(41,151,255,.16)}
.logincard .btn-primary{box-shadow:0 6px 20px -6px rgba(0,113,227,.75),inset 0 1px 0 rgba(255,255,255,.18)}

/* ---------- rows ---------- */
.rows{display:flex;flex-direction:column;margin-top:var(--s24)}
.row{border-top:1px solid var(--graphite);padding-block:var(--s20);display:flex;flex-direction:column;gap:var(--s20)}
.row:last-child{border-bottom:1px solid var(--graphite)}
.row.on{background:linear-gradient(180deg,rgba(255,255,255,.022),transparent 180px)}
.row-head{
  display:flex;align-items:center;justify-content:space-between;gap:var(--s16);
  width:100%;background:none;border:none;cursor:pointer;padding:0;color:inherit;text-align:left;
}
.row-id{display:flex;align-items:center;gap:var(--s16);min-width:0}
.row-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.row-txt .t{font-family:var(--display);font-size:var(--t-h-sm);font-weight:600;letter-spacing:-0.015em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-head:hover .t{color:var(--paper-white)}
.row-txt .s{font-size:var(--t-xs);color:var(--platinum);overflow-wrap:anywhere}
.row-end{display:flex;align-items:center;gap:var(--s12);flex:none}

.avatar{
  width:38px;height:38px;border-radius:50%;flex:0 0 auto;object-fit:cover;
  background:var(--graphite);display:grid;place-items:center;overflow:hidden;
  font-size:var(--t-body);font-weight:600;color:var(--frost-white);
}

/* ---------- status pills ---------- */
.status{
  display:inline-flex;align-items:center;gap:7px;font-size:var(--t-xs);font-weight:600;
  border-radius:var(--r-pill);padding:5px 12px;background:var(--graphite);color:var(--frost-white);white-space:nowrap;
}
.status i{width:7px;height:7px;border-radius:50%;background:var(--halo-blue);display:block;flex:none}
.status[data-tone="done"] i{background:var(--reef-teal)}
.status[data-tone="warn"] i{background:var(--signal-orange)}
.status[data-tone="mute"] i{background:var(--smoke)}
.status[data-tone="mute"]{color:var(--platinum)}
.pip{display:inline-flex;align-items:center;border-radius:var(--r-pill);padding:4px 10px;
  font-size:var(--t-caption);font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  background:var(--graphite);color:var(--platinum);white-space:nowrap}
.pip.live{background:rgba(0,113,227,.18);color:var(--halo-blue)}

/* ---------- expanded detail ---------- */
.sub{display:flex;flex-direction:column;gap:var(--s8);padding-top:var(--s20);border-top:1px solid rgba(255,255,255,.07)}
.kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:var(--s12) var(--s20);margin-top:var(--s8)}
.kv{display:flex;flex-direction:column;gap:2px;min-width:0}
.kv span{font-size:var(--t-caption);letter-spacing:.06em;text-transform:uppercase;color:var(--platinum)}
.kv b{font-size:var(--t-body);font-weight:400;color:var(--frost-white);overflow-wrap:anywhere}
.prose{margin:var(--s16) 0 0;font-size:var(--t-body);line-height:1.55;color:var(--frost-white);white-space:pre-wrap;overflow-wrap:anywhere}
.inline{display:flex;gap:var(--s12);flex-wrap:wrap;margin-top:var(--s12)}
.inline .input{flex:1;min-width:200px}

.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s12)}
.stage-step{display:flex;flex-direction:column;gap:var(--s8)}
.stage-step .rail{height:2px;background:var(--graphite);border-radius:2px}
.stage-step[data-on="1"] .rail{background:var(--apple-blue)}
.stage-step span{font-size:var(--t-xs);color:var(--platinum)}
.stage-step[data-on="1"] span{color:var(--frost-white)}
@media (max-width:620px){.stages{grid-template-columns:repeat(2,1fr)}}

.filelist{display:flex;flex-wrap:wrap;gap:var(--s8);margin-top:var(--s8)}
.filechip{
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  background:var(--carbon);border:1px solid var(--graphite);border-radius:var(--r-pill);
  padding:8px 16px;color:var(--frost-white);font-size:var(--t-xs);transition:border-color .2s ease;
}
.filechip:hover{border-color:var(--silver-mist)}
.filechip span{color:var(--platinum);font-size:var(--t-caption)}

.timeline{list-style:none;margin:var(--s12) 0 0;padding:0;display:flex;flex-direction:column;gap:var(--s14,14px)}
.timeline li{display:flex;gap:var(--s12);align-items:flex-start}
.timeline .dot{width:7px;height:7px;border-radius:50%;background:var(--smoke);margin-top:7px;flex:0 0 auto}
.timeline li:last-child .dot{background:var(--apple-blue)}
.timeline p{margin:0;font-size:var(--t-body);color:var(--frost-white);line-height:1.5}

/* a client's own briefs / calls, listed inside their row */
.minilist{display:flex;flex-direction:column;gap:var(--s8);margin-top:var(--s12)}
.mini{
  display:flex;align-items:center;justify-content:space-between;gap:var(--s12);flex-wrap:wrap;
  background:var(--carbon);border:1px solid var(--graphite);border-radius:14px;padding:11px 16px;
  font-size:var(--t-body);cursor:pointer;text-align:left;width:100%;color:inherit;
}
.mini:hover{border-color:var(--smoke)}
.mini .ml{display:flex;flex-direction:column;gap:2px;min-width:0}
.mini .ml b{font-weight:500;overflow-wrap:anywhere}
.mini .ml span{font-size:var(--t-caption);color:var(--platinum);letter-spacing:.04em;text-transform:uppercase}

/* ---------- messages ---------- */
.notice{background:var(--carbon);border:1px solid var(--graphite);border-radius:var(--r-card);
  padding:var(--s28);display:flex;flex-direction:column;gap:var(--s8);margin-top:var(--s24)}
.errbar{background:rgba(245,105,0,.1);border:1px solid rgba(245,105,0,.4);border-radius:16px;
  padding:12px 18px;margin-top:var(--s16);font-size:var(--t-body);color:#ffb877}
.skeleton{height:64px;border-radius:16px;background:linear-gradient(90deg,#0d0d0d,#191919,#0d0d0d);
  background-size:200% 100%;animation:sheen 1.4s linear infinite;margin-top:var(--s12)}
@keyframes sheen{from{background-position:200% 0}to{background-position:-200% 0}}

@media (max-width:620px){
  .row-head{align-items:flex-start;flex-direction:column;gap:var(--s12)}
  .row-end{width:100%}
  .pnav-in{gap:var(--s12)}
  .tabbar{order:3;width:100%;justify-content:space-between}
  .tabbtn{flex:1;text-align:center}
}
</style>
</head>

<script>
(function(){
'use strict';

/* ============================== CONFIG ============================== */
var STUDIO            = 'DIA PROD';
var SITE              = 'https://diaprod.it/studiov3';
var SUPABASE_URL      = 'https://aznelawjlyoklmjcxylq.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_4Lhz2fJueL6UuRYHcmMWGA_bDmZZ6-R';
var BUCKET            = 'brief-files';

var STAGES = ['Received', 'In review', 'In production', 'Delivered'];
var CALL   = ['Requested', 'Confirmed', 'Completed', 'Cancelled'];

var TABS = [
  { id:'briefs',  label:'Briefs'  },
  { id:'clients', label:'Clients' },
  { id:'calls',   label:'Calls'   }
];

/* ============================== STATE ============================== */
var S = {
  ready:false,                  /* the first session check has come back */
  user:null,
  isAdmin:null,                 /* null until the database has answered  */

  email:'', password:'', authBusy:false, authError:'',

  tab:'briefs',
  briefs:[], clients:[], calls:[],
  loading:false, dataError:'', loadedOnce:false,

  q:'',
  briefFilter:'open',
  callFilter:'upcoming',
  clientSort:'recent',

  open:{ briefs:null, clients:null, calls:null },
  draft:{},                     /* free-text drafts, keyed by row id     */
  busyId:''
};

var sb = null;

/* ============================== HELPERS ============================== */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}
function logo(size, color){
  return '<svg viewBox="255 248 528 372" width="'+size+'" style="display:block;overflow:visible" role="img" aria-label="'+STUDIO+'">'+
    '<rect x="250" y="250" width="540" height="470" fill="'+color+'" mask="url(#diaLogoMask)"></rect></svg>';
}
function initials(name, email){
  var s = (name || '').trim() || (email || '').trim();
  if(!s) return '?';
  var bits = s.replace(/@.*/, '').split(/[\s._-]+/).filter(Boolean);
  return ((bits[0] || '')[0] + (bits.length > 1 ? (bits[1] || '')[0] : '')).toUpperCase() || '?';
}
function fmtDate(iso){
  var d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
}
function fmtDateTime(iso){
  var d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleString('en-GB', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'});
}
/* "3 days ago" reads faster than a date when scanning a list */
function ago(iso){
  var d = new Date(iso);
  if(isNaN(d)) return '—';
  var mins = Math.round((Date.now() - d.getTime()) / 60000);
  if(mins < 2)     return 'just now';
  if(mins < 60)    return mins + ' min ago';
  var h = Math.round(mins / 60);
  if(h < 24)       return h + (h === 1 ? ' hour ago' : ' hours ago');
  var days = Math.round(h / 24);
  if(days === 1)   return 'yesterday';
  if(days < 30)    return days + ' days ago';
  return fmtDate(iso);
}
function untilLabel(d){
  if(!d) return '';
  var days = Math.round((new Date(d).setHours(0,0,0,0) - new Date().setHours(0,0,0,0)) / 86400000);
  if(days === 0)  return 'Today';
  if(days === 1)  return 'Tomorrow';
  if(days === -1) return 'Yesterday';
  if(days > 1 && days < 14) return 'In ' + days + ' days';
  if(days < -1)   return Math.abs(days) + ' days ago';
  return '';
}
function fmtSize(n){
  n = Number(n) || 0;
  if(n < 1024) return n + ' B';
  if(n < 1048576) return Math.round(n/1024) + ' KB';
  return (n/1048576).toFixed(1) + ' MB';
}
function pluralise(n, one, many){ return n + ' ' + (n === 1 ? one : many); }

/* the instant a call is meant to happen, as best the data allows */
function slotAt(c){
  if(c.slot_at){ var a = new Date(c.slot_at); if(!isNaN(a)) return a; }
  if(!c.slot_date) return null;
  var t = /(\d{1,2})[:.](\d{2})/.exec(c.slot_time || '');
  var hh = t ? String(t[1]).padStart(2, '0') : '09';
  var mm = t ? t[2] : '00';
  var d = new Date(c.slot_date + 'T' + hh + ':' + mm + ':00');
  return isNaN(d) ? null : d;
}
function slotLabel(c){
  var d = slotAt(c);
  if(!d) return 'No time given';
  var near = untilLabel(d);
  return d.toLocaleString('en-GB', {weekday:'short', day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'}) +
    (near ? ' · ' + near : '');
}
function gcalUrl(c){
  var d = slotAt(c);
  if(!d) return '';
  var end = new Date(d.getTime() + 30 * 60000);
  var z = function(x){ return x.toISOString().replace(/[-:]|\.\d{3}/g, ''); };
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE' +
    '&text=' + encodeURIComponent('Call — ' + (c.name || c.email || 'Client') + ' · ' + STUDIO) +
    '&dates=' + z(d) + '/' + z(end) +
    '&details=' + encodeURIComponent(
      [c.ref, c.topic && ('Topic: ' + c.topic), c.email, c.phone, c.message].filter(Boolean).join('\n'));
}

function download(filename, text, mime){
  var blob = new Blob([text], {type: (mime || 'text/plain') + ';charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

/* ============================== BACKEND ==============================
   The portal holds no secrets of its own. Everything it may read or
   write is decided by row-level security in Postgres, keyed off the
   signed-in account — so an ordinary client who finds this page sees
   nothing here that they could not already see on the site.          */

function initBackend(){
  if(!window.supabase){
    S.ready = true;
    S.authError = 'The backend library did not load. Check the connection and reload.';
    render();
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false }
  });
  sb.auth.onAuthStateChange(function(evt, session){ applySession(session); });
  sb.auth.getSession().then(function(r){
    S.ready = true;
    applySession(r && r.data ? r.data.session : null);
  });
}

function applySession(session){
  var u = session && session.user;
  if(u){
    var same = S.user && S.user.id === u.id;
    S.user = { id:u.id, email:u.email || '' };
    if(!same){ S.isAdmin = null; checkAdmin(); }
  } else {
    S.user = null; S.isAdmin = null;
    S.briefs = []; S.clients = []; S.calls = [];
    S.loadedOnce = false; S.open = { briefs:null, clients:null, calls:null };
  }
  render(true);
}

function checkAdmin(){
  sb.rpc('is_admin').then(function(r){
    S.isAdmin = !!(r && r.data);
    if(S.isAdmin) load();
    render(true);
  });
}

function signIn(){
  var email = (S.email || '').trim(), pw = S.password || '';
  if(!sb || !email || !pw || S.authBusy) return;
  S.authBusy = true; S.authError = ''; render(true);
  sb.auth.signInWithPassword({ email:email, password:pw })
    .then(function(r){
      S.authBusy = false; S.password = '';
      if(r.error) S.authError = friendly(r.error.message);
      render(true);                       /* the session listener takes over */
    })
    .catch(function(e){
      S.authBusy = false; S.password = '';
      S.authError = (e && e.message) || 'Sign in failed.';
      render(true);
    });
}
function friendly(m){
  m = String(m || '');
  if(/invalid login/i.test(m))       return 'That email and password do not match an account.';
  if(/email not confirmed/i.test(m)) return 'This account has not been confirmed yet.';
  if(/rate limit|too many/i.test(m)) return 'Too many attempts. Wait a minute and try again.';
  return m || 'Sign in failed.';
}
function signOut(){
  if(sb) sb.auth.signOut();
  applySession(null);
  S.email = ''; S.password = ''; S.authError = '';
  render();
}

/* ---------- reading ---------- */
var BRIEF_COLS = '*, brief_events(id,stage,note,created_at), brief_files(id,name,path,size,mime)';

function load(){
  if(!sb || S.loading) return;
  S.loading = true; render(true);

  Promise.all([
    sb.from('briefs').select(BRIEF_COLS).order('created_at', {ascending:false}).limit(500),
    sb.rpc('admin_clients'),
    sb.from('bookings').select('*').order('created_at', {ascending:false}).limit(500)
  ]).then(function(res){
    var errs = [];

    if(res[0].error) errs.push('Briefs: ' + res[0].error.message);
    else S.briefs = (res[0].data || []).map(function(b){
      b.brief_events = (b.brief_events || []).sort(function(x, y){
        return new Date(x.created_at) - new Date(y.created_at);
      });
      b.brief_files = b.brief_files || [];
      return b;
    });

    if(res[1].error) errs.push('Clients: ' + res[1].error.message);
    else S.clients = res[1].data || [];

    if(res[2].error) errs.push('Calls: ' + res[2].error.message);
    else S.calls = res[2].data || [];

    S.dataError = errs.join(' · ');
    S.loading = false; S.loadedOnce = true;
    render(true);
  }).catch(function(e){
    S.loading = false; S.loadedOnce = true;
    S.dataError = (e && e.message) || 'Could not reach the database.';
    render(true);
  });
}

function openFile(path){
  if(!sb) return;
  sb.storage.from(BUCKET).createSignedUrl(path, 120).then(function(r){
    if(r.data && r.data.signedUrl) window.open(r.data.signedUrl, '_blank', 'noopener');
    else { S.dataError = 'That file could not be opened.'; render(true); }
  });
}

/* ---------- writing ---------- */
/* every write ends the same way: surface the failure, or forget the draft
   and pull the truth back from the database */
function after(id){
  return function(r){
    S.busyId = '';
    if(r && r.error){ S.dataError = r.error.message; render(true); return; }
    if(id) delete S.draft[id];
    load();
  };
}
function setStage(id, stage){
  if(!sb) return;
  S.busyId = id; render(true);
  sb.from('briefs').update({ stage: stage }).eq('id', id).then(after());
}
function setCallStatus(id, status){
  if(!sb) return;
  S.busyId = id; render(true);
  sb.from('bookings').update({ status: status }).eq('id', id).then(after());
}
function addNote(id){
  var text = (S.draft[id] || '').trim();
  if(!sb || !text) return;
  var b = byId(S.briefs, id);
  S.busyId = id; render(true);
  sb.from('brief_events').insert({ brief_id:id, stage:(b ? b.stage : null), note:text }).then(after(id));
}
function saveCallNote(id){
  if(!sb) return;
  var c = byId(S.calls, id);
  var text = S.draft[id] != null ? S.draft[id] : (c ? c.admin_note : '');
  S.busyId = id; render(true);
  sb.from('bookings').update({ admin_note: text }).eq('id', id).then(after(id));
}
function saveClientNote(userId){
  if(!sb || !S.user) return;
  var c = byId(S.clients, userId);
  var text = S.draft[userId] != null ? S.draft[userId] : (c ? c.note : '');
  S.busyId = userId; render(true);
  sb.from('client_notes').upsert(
    { user_id:userId, note:text, updated_at:new Date().toISOString(), updated_by:S.user.id },
    { onConflict:'user_id' }
  ).then(after(userId));
}

function byId(list, id){
  for(var i=0;i<list.length;i++){ if(list[i].id === id) return list[i]; }
  return null;
}

/* ============================== DERIVED ==============================
   Briefs and calls are linked to a client by account first and by
   email second — exactly the rule the database uses, so what the
   studio sees here matches what that client sees on the site.       */
function ownedBy(list, c){
  var mail = (c.email || '').toLowerCase();
  return list.filter(function(x){
    return x.user_id === c.id || (x.email && x.email.toLowerCase() === mail);
  });
}
function hit(q, parts){
  if(!q) return true;
  return parts.filter(Boolean).join(' ').toLowerCase().indexOf(q) > -1;
}

function visibleBriefs(){
  var q = S.q.trim().toLowerCase();
  return S.briefs.filter(function(b){
    if(S.briefFilter === 'open' && b.stage === 3) return false;
    if(S.briefFilter === 'done' && b.stage !== 3) return false;
    if(S.briefFilter === 'new'  && b.stage !== 0) return false;
    return hit(q, [b.ref, b.name, b.email, b.company, b.type, b.location, b.brief]);
  });
}
/* still on the studio's plate: not yet completed or cancelled, and either
   in the future or with no time given at all (which also needs dealing with) */
function isUpcoming(c){
  var d = slotAt(c);
  return c.status <= 1 && (!d || d.getTime() >= Date.now() - 36e5);
}
function visibleCalls(){
  var q = S.q.trim().toLowerCase();
  var list = S.calls.filter(function(c){
    if(S.callFilter === 'upcoming' && !isUpcoming(c)) return false;
    if(S.callFilter === 'past'     &&  isUpcoming(c)) return false;
    if(S.callFilter === 'new'      &&  c.status !== 0) return false;
    return hit(q, [c.ref, c.name, c.email, c.company, c.topic, c.message]);
  });
  /* upcoming reads soonest-first; everything else newest-first */
  if(S.callFilter === 'upcoming'){
    list.sort(function(a, b){
      var x = slotAt(a), y = slotAt(b);
      return (x ? x.getTime() : Infinity) - (y ? y.getTime() : Infinity);
    });
  }
  return list;
}
function visibleClients(){
  var q = S.q.trim().toLowerCase();
  var list = S.clients.filter(function(c){
    return hit(q, [c.full_name, c.email, c.note]);
  });
  var sorters = {
    recent: function(a, b){ return new Date(b.created_at) - new Date(a.created_at); },
    active: function(a, b){ return new Date(b.last_sign_in_at || 0) - new Date(a.last_sign_in_at || 0); },
    busy:   function(a, b){ return (b.brief_count + b.call_count) - (a.brief_count + a.call_count); },
    name:   function(a, b){ return (a.full_name || a.email).localeCompare(b.full_name || b.email); }
  };
  return list.sort(sorters[S.clientSort] || sorters.recent);
}

function exportClients(){
  var head = ['Name','Email','Sign-in','Joined','Last sign-in','Briefs','Open briefs','Calls','Upcoming calls','Internal note'];
  var cell = function(v){
    v = v == null ? '' : String(v);
    return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  };
  var rows = visibleClients().map(function(c){
    return [c.full_name, c.email, c.provider, fmtDate(c.created_at),
      c.last_sign_in_at ? fmtDateTime(c.last_sign_in_at) : 'never',
      c.brief_count, c.open_brief_count, c.call_count, c.open_call_count, c.note].map(cell).join(',');
  });
  var stamp = new Date().toISOString().slice(0, 10);
  download('diaprod-clients-' + stamp + '.csv', '﻿' + [head.map(cell).join(',')].concat(rows).join('\r\n'), 'text/csv');
}

/* ============================== PIECES ============================== */
function statusPill(label, tone){
  return '<span class="status" data-tone="'+tone+'"><i></i>'+esc(label)+'</span>';
}
function stageBadge(stage){
  return statusPill(STAGES[stage] || STAGES[0], stage === 3 ? 'done' : 'live');
}
function callBadge(status){
  var tone = status === 1 ? 'done' : status === 2 ? 'mute' : status === 3 ? 'warn' : 'live';
  return statusPill(CALL[status] || CALL[0], tone);
}
function stageRail(stage){
  return '<div class="stages">'+STAGES.map(function(s, i){
    return '<div class="stage-step" data-on="'+(i<=stage?1:0)+'"><div class="rail"></div><span>'+esc(s)+'</span></div>';
  }).join('')+'</div>';
}
function kv(k, v){
  if(!v || (Array.isArray(v) && !v.length)) return '';
  return '<div class="kv"><span>'+esc(k)+'</span><b>'+esc(Array.isArray(v) ? v.join(', ') : v)+'</b></div>';
}
function kvLink(k, v, href){
  if(!v) return '';
  return '<div class="kv"><span>'+esc(k)+'</span><b><a href="'+esc(href)+'">'+esc(v)+'</a></b></div>';
}
function avatar(c){
  return c.avatar_url
    ? '<img class="avatar" src="'+esc(c.avatar_url)+'" alt="" referrerpolicy="no-referrer">'
    : '<span class="avatar" aria-hidden="true">'+esc(initials(c.full_name, c.email))+'</span>';
}
function chips(name, items, active){
  return '<div class="chips">'+items.map(function(x){
    return '<button class="chip" data-'+name+'="'+x[0]+'" aria-pressed="'+(active === x[0])+'">'+
      esc(x[1])+(x[2] == null ? '' : '<b>'+x[2]+'</b>')+'</button>';

}
function noteBox(id, value, placeholder, action, label){
  var busy = S.busyId === id;

    '<button class="btn btn-primary" data-'+action+'="'+esc(id)+'"'+(busy ? ' disabled' : '')+'>'+

/* ------------------------------ briefs ------------------------------ */
function viewBriefs(){
  var all = S.briefs, list = visibleBriefs();

  return head('Briefs.', pluralise(n.open, 'open job', 'open jobs') + ' · ' + n.done + ' delivered')+

    toolbar('Search reference, name, email, company')+

function meta(shown, total, noun){
  if(!total) return '';

function body(list, all, rowFn, emptyMsg){

  return '<div class="rows">'+list.map(rowFn).join('')+'</div>';

/* ============================== RENDER ============================== */
function renderTop(){
  var tabs = '';
  if(S.isAdmin){
    var counts = { briefs:S.briefs.length, clients:S.clients.length, calls:S.calls.length };
    tabs = '<nav class="tabbar" aria-label="Portal sections">'+TABS.map(function(t){
      return '<button class="tabbtn" data-tab="'+t.id+'"'+(S.tab === t.id ? ' aria-current="page"' : '')+'>'+
        t.label+(S.loadedOnce ? '<b>'+counts[t.id]+'</b>' : '')+'</button>';
    }).join('')+'</nav>';
  }
  var right = S.user
    ? '<span class="pwho">'+esc(S.user.email)+'</span>'+
      '<a class="small" href="'+SITE+'" target="_blank" rel="noopener">View site &#8599;</a>'+
      '<button class="btn-line" data-signout="1">Sign out</button>'
    : '<a class="small" href="'+SITE+'">&#8592; diaprod.it</a>';

  document.getElementById('pnav').innerHTML = '<div class="pnav-in">'+

    tabs+
    '<span class="pright">'+right+'</span>'+
  '</div>';

function render(keep){
  var y = window.scrollY;
  var active = document.activeElement;
  var focusId = active && active.id ? active.id : null;
  var caret = (focusId && active.selectionStart != null) ? active.selectionStart : null;

  var html;
  if(!S.ready)                    html = screenMessage('Checking your session…');
  else if(!S.user)                html = screenLogin();
  else if(S.isAdmin === null)     html = screenMessage('Checking your account…');
  else if(!S.isAdmin)             html = screenDenied();
  else {
    html = (S.dataError ? '<div class="errbar" role="alert">'+esc(S.dataError)+'</div>' : '') +
      (S.tab === 'clients' ? viewClients() : S.tab === 'calls' ? viewCalls() : viewBriefs());
  }

  document.getElementById('app').innerHTML = html;
  renderTop();

  if(keep){
    window.scrollTo(0, y);
    if(focusId){
      var el = document.getElementById(focusId);
      if(el){
        el.focus();
        if(caret != null && el.setSelectionRange){ try{ el.setSelectionRange(caret, caret); }catch(e){} }
      }
    }
  } else {
    window.scrollTo(0, 0);
  }
}

function goTab(id){
  if(S.tab === id) return;
  S.tab = id; S.q = '';
  if(location.hash.slice(1) !== id) location.hash = id;
  render();
}

/* ============================== EVENTS ============================== */
document.addEventListener('submit', function(e){
  if(e.target && e.target.id === 'loginform'){ e.preventDefault(); signIn(); }
});

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-signin],[data-signout],[data-refresh],[data-export],[data-tab],'+
    '[data-bfilter],[data-cfilter],[data-row],[data-jump],[data-stage],[data-callstatus],'+
    '[data-briefnote],[data-callnote],[data-clientnote],[data-file]');
  if(!el) return;
  var d = el.dataset, parts;

  if(d.signin)      { e.preventDefault(); signIn(); }
  else if(d.signout){ signOut(); }
  else if(d.refresh){ load(); }
  else if(d.export) { exportClients(); }
  else if(d.tab)    { goTab(d.tab); }
  else if(d.bfilter){ S.briefFilter = d.bfilter; render(true); }
  else if(d.cfilter){ S.callFilter  = d.cfilter; render(true); }
  else if(d.row){
    parts = d.row.split(':');
    S.open[parts[0]] = (S.open[parts[0]] === parts[1] ? null : parts[1]);
    render(true);
  }
  else if(d.jump){
    parts = d.jump.split(':');
    S.open[parts[0]] = parts[1];
    S.tab = parts[0]; S.q = '';
    /* whichever filter is on must not hide the row we just jumped to */
    if(parts[0] === 'briefs') S.briefFilter = 'all';
    if(parts[0] === 'calls')  S.callFilter  = 'all';
    location.hash = S.tab;
    render();
  }
  else if(d.stage)     { parts = d.stage.split(':');      setStage(parts[0], Number(parts[1])); }
  else if(d.callstatus){ parts = d.callstatus.split(':'); setCallStatus(parts[0], Number(parts[1])); }
  else if(d.briefnote) { addNote(d.briefnote); }
  else if(d.callnote)  { saveCallNote(d.callnote); }
  else if(d.clientnote){ saveClientNote(d.clientnote); }
  else if(d.file)      { openFile(d.file); }
});

document.addEventListener('input', function(e){
  var el = e.target;
  if(!el.dataset) return;

  if(el.dataset.draft){ S.draft[el.dataset.draft] = el.value; return; }

  var key = el.dataset.input;
  if(!key) return;
  S[key] = el.value;

  if(key === 'q' || key === 'clientSort'){ render(true); return; }
  var btn = document.querySelector('[data-signin]');
  if(btn) btn.disabled = !((S.email || '').trim() && S.password) || S.authBusy;
});

/* Enter saves a note without reaching for the button */
document.addEventListener('keydown', function(e){
  var el = e.target;
  if(e.key === 'Enter' && el && el.dataset && el.dataset.draft){
    var id = el.dataset.draft;
    var btn = document.querySelector('[data-briefnote="'+id+'"],[data-callnote="'+id+'"],[data-clientnote="'+id+'"]');
    if(btn && !btn.disabled){ e.preventDefault(); btn.click(); }
    return;
  }
  if(!S.isAdmin) return;
  if(e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)){
    var q = document.getElementById('q');
    if(q){ e.preventDefault(); q.focus(); q.select(); }
  } else if(e.key === 'Escape' && el.id === 'q' && S.q){
    S.q = ''; render(true);
  }
});

window.addEventListener('hashchange', function(){
  var id = location.hash.slice(1);
  if(TABS.some(function(t){ return t.id === id; }) && id !== S.tab){ S.tab = id; S.q = ''; render(); }
});

/* a quiet refresh, so a portal left open on a second screen stays true —
   skipped while something is being typed or saved */
setInterval(function(){
  if(!S.isAdmin || S.loading || S.busyId || document.hidden) return;
  if(/^(INPUT|TEXTAREA)$/.test((document.activeElement || {}).tagName || '')) return;
  load();
}, 90000);

/* ============================== START ============================== */
(function(){
  var id = location.hash.slice(1);
  if(TABS.some(function(t){ return t.id === id; })) S.tab = id;
})();
initBackend();
render();
})();
</script>

</body>
</html>
