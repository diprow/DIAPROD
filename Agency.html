@media (prefers-color-scheme:dark){
  :root{
    --bg:#000; --card:#1c1c1e; --sunk:#2c2c2e; --hair:rgba(255,255,255,.04);
    --glass:rgba(0,0,0,.72); --barglass:rgba(28,28,30,.82);
    --ink:#f5f5f7; --ink2:#b0b0b5; --ink3:#8e8e93; --line:rgba(255,255,255,.14);
    --blue:#0a84ff; --blue-soft:rgba(10,132,255,.2);
    --green:#4fd57f; --green-soft:rgba(48,209,88,.17);
    --amber:#ffcf70; --amber-soft:rgba(255,159,10,.17);
    --shadow:0 1px 1px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.45);
    --shadow-lg:0 20px 60px rgba(0,0,0,.75);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI","Helvetica Neue",Inter,system-ui,sans-serif;
  background:var(--bg); color:var(--ink); line-height:var(--lh);
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none;
}
html[lang="fa"]{--lh:1.85}
html[lang="fa"] body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Arabic","Geeza Pro","Segoe UI","Iranian Sans",Tahoma,"Noto Sans Arabic",sans-serif;
  letter-spacing:0;
}
html[lang="fa"] .desc,html[lang="fa"] .tip,html[lang="fa"] .lede p{line-height:1.95}
.wrap{max-width:1120px;margin:0 auto;padding-left:var(--padL);padding-right:var(--padR)}
@media(min-width:760px){:root{--gut:30px}}
a{color:var(--blue)}
button,select,input{font:inherit;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:7px}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink3);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
bdi{unicode-bidi:isolate}

/* ============ TOP BAR ============ */
.topbar{position:sticky;top:0;z-index:120;padding-top:var(--safeT);background:var(--glass);
  backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);
  border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;height:var(--top)}
.mark{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;letter-spacing:-.015em;
  white-space:nowrap;min-width:0;margin-inline-end:auto;direction:ltr}
.mark img{width:21px;height:21px;border-radius:6px;flex:none}
.mark span{overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:2px;background:var(--sunk);border-radius:11px;padding:3px}
.tabs button{border:0;background:transparent;color:var(--ink2);font-size:13.5px;font-weight:500;
  padding:6px 14px;border-radius:8.5px;cursor:pointer;white-space:nowrap;transition:background .18s,color .18s}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:600}
#lang{width:auto;flex:none;padding:6px 30px 6px 11px;font-size:13px;font-weight:600;border-radius:20px;
  background-color:var(--sunk);border:0;color:var(--ink);cursor:pointer;direction:ltr;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 11px) 52%;background-size:4.5px 4.5px;background-repeat:no-repeat}
#install{border:0;background:var(--blue);color:#fff;font-size:13.5px;font-weight:500;padding:7px 15px;
  border-radius:20px;cursor:pointer;white-space:nowrap;display:none;flex:none}
#install:active{opacity:.7}

/* ============ BOTTOM BAR ============ */
.tabbar{display:none}
@media(max-width:430px){
  .mark span{display:none}
  #install{padding:7px 13px;font-size:13px}
  :root{--gut:22px}
}
@media(max-width:840px){
  .tabs{display:none}
  .tabbar{display:flex;position:fixed;inset-inline:0;bottom:0;z-index:130;
    padding:6px max(6px,var(--safeR)) calc(4px + var(--safeB)) max(6px,var(--safeL));
    background:var(--barglass);backdrop-filter:saturate(180%) blur(24px);
    -webkit-backdrop-filter:saturate(180%) blur(24px);border-top:1px solid var(--line)}
  .tabbar button{flex:1;border:0;background:none;cursor:pointer;color:var(--ink3);
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px 4px;
    font-size:10.5px;font-weight:500;line-height:1.3;transition:color .16s}
  .tabbar button[aria-selected="true"]{color:var(--blue)}
  .tabbar button:active{opacity:.5}
  .tabbar svg{width:23px;height:23px;stroke-width:1.8;flex:none}
  .panel{padding-bottom:calc(86px + var(--safeB))!important}
}
.toolbar{top:calc(var(--top) + var(--safeT))}

/* ============ PANELS ============ */
.panel{display:none;padding-top:34px;padding-bottom:90px}
.panel.on{display:block;animation:in .34s cubic-bezier(.22,.7,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.lede h1{font-size:clamp(28px,5.2vw,46px);font-weight:700;letter-spacing:-.028em;line-height:1.14}
html[lang="fa"] .lede h1{line-height:1.42;letter-spacing:0}
.lede p{margin-top:11px;color:var(--ink2);font-size:16.5px;max-width:64ch}
.rule{height:1px;background:var(--line);margin:34px 0 24px}
h2.sec{font-size:21px;font-weight:600;letter-spacing:-.02em}
.note-inline{color:var(--ink3);font-size:14px;margin-top:4px}

/* ============ KPI ============ */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-top:28px}
.kpi{background:var(--card);border-radius:19px;padding:18px 19px;box-shadow:var(--shadow)}
.kpi .n{font-size:31px;font-weight:600;letter-spacing:-.03em;line-height:1.2;direction:ltr;text-align:start}
.kpi .n em{font-style:normal;font-size:17px;color:var(--ink3);font-weight:500}
.kpi .l{font-size:13.5px;color:var(--ink2);margin-top:3px}
.kpi .s{font-size:12px;color:var(--ink3);margin-top:6px}

/* ============ BOXES ============ */
.split{display:grid;grid-template-columns:1.35fr 1fr;gap:13px;margin-top:13px}
@media(max-width:880px){.split{grid-template-columns:1fr}}
.box{background:var(--card);border-radius:19px;padding:21px;box-shadow:var(--shadow)}
.box h3{font-size:16px;font-weight:600;letter-spacing:-.01em}
.cap{font-size:13px;color:var(--ink3);margin-top:3px;margin-bottom:15px}
.stack{font-size:13.5px;color:var(--ink2);display:flex;flex-direction:column;gap:13px}
.stack b{color:var(--ink)}

/* ============ LADDER ============ */
.lrow{margin-bottom:14px}
.lt{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;gap:12px}
.lt b{font-weight:500}
.lt span{color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}
.track{height:9px;background:var(--sunk);border-radius:5px;position:relative;overflow:hidden}
.fill{position:absolute;top:0;bottom:0;background:var(--blue);border-radius:5px;min-width:5px}
.fill.hi{background:linear-gradient(90deg,var(--blue),#7d5bef)}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin-top:9px;font-variant-numeric:tabular-nums}

/* ============ BREAKDOWN ============ */
.bd{display:flex;flex-direction:column;gap:12px}
.bd .r{display:grid;grid-template-columns:86px 1fr 32px;align-items:center;gap:11px;font-size:13.5px}
.bd .r span:first-child{color:var(--ink2)}
.bd .r b{text-align:end;font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;border-radius:4px;background:var(--blue)}
.bar i.g{background:var(--green)} .bar i.n{background:var(--ink3)}

/* ============ FORM ============ */
.calc{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media(max-width:540px){.calc{grid-template-columns:1fr}}
label.f{display:block;font-size:12.5px;color:var(--ink3);margin-bottom:6px}
input,select{width:100%;font-size:16px;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:11px;padding:10px 13px;outline:none;
  transition:border-color .15s,box-shadow .15s}
input[type=number]{direction:ltr;text-align:start}
input[type=search]::-webkit-search-decoration,input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3.5px var(--blue-soft)}
select.sel{background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);
  background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px;background-repeat:no-repeat;
  padding-inline-end:34px;cursor:pointer}
[dir="rtl"] select.sel{background-position:17px 52%,12px 52%;
  background-image:linear-gradient(135deg,var(--ink3) 50%,transparent 50%),linear-gradient(45deg,transparent 50%,var(--ink3) 50%)}
.readout{margin-top:17px;background:var(--bg);border-radius:15px;padding:16px 17px}
.readout .big{font-size:30px;font-weight:600;letter-spacing:-.028em;line-height:1.2;direction:ltr;text-align:start}
.readout .big em{font-style:normal;font-size:15px;color:var(--ink3);font-weight:500}
.verdict{margin-top:10px;font-size:13.5px;display:flex;gap:8px;align-items:flex-start;color:var(--ink2)}
.verdict i{width:8px;height:8px;border-radius:50%;flex:none;margin-top:7px;background:var(--ink3)}
.verdict.ok i{background:var(--green)} .verdict.warn i{background:#e08600} .verdict.hi i{background:var(--blue)}
.subline{font-size:12.5px;color:var(--ink3);margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}

/* ============ PICKS ============ */
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:13px;margin-top:15px}
.pick{background:var(--card);border-radius:19px;padding:18px;box-shadow:var(--shadow);cursor:pointer;
  border:0;text-align:start;color:inherit;transition:transform .18s;display:block;width:100%}
.pick:hover{transform:translateY(-2px)} .pick:active{transform:scale(.985)}
.pick .rank{font-size:11.5px;font-weight:600;color:var(--blue)}
.pick b{display:block;font-size:16.5px;font-weight:600;letter-spacing:-.015em;margin-top:5px}
.pick p{font-size:13.5px;color:var(--ink2);margin-top:7px}

/* ============ TOOLBAR ============ */
.toolbar{position:sticky;z-index:100;padding:12px var(--padR) 12px var(--padL);
  margin-left:calc(-1*var(--padL));margin-right:calc(-1*var(--padR));background:var(--glass);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.tb1{display:flex;gap:10px;flex-wrap:wrap}
.searchbox{flex:1 1 250px;position:relative}
.searchbox input{padding-inline-start:38px}
.searchbox svg{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);opacity:.42;pointer-events:none}
.seg{display:flex;background:var(--sunk);border-radius:11px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:transparent;color:var(--ink2);font-size:13.5px;font-weight:500;
  padding:7px 14px;border-radius:8.5px;cursor:pointer;white-space:nowrap;transition:background .18s}
.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:600}
select.sort{flex:0 0 auto;width:auto;font-size:14px}
.chips{display:flex;gap:7px;margin-top:10px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink2);font-size:12.5px;
  padding:5px 13px;border-radius:20px;cursor:pointer;white-space:nowrap;transition:.15s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.resline{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink3);padding:12px 2px 0;gap:12px}
.linkbtn{border:0;background:none;color:var(--blue);font-size:13px;cursor:pointer;padding:4px 0}

/* ============ CARDS ============ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px;margin-top:12px}
.card{background:var(--card);border-radius:19px;box-shadow:var(--shadow);padding:19px;display:flex;flex-direction:column;position:relative}
.card h3{font-size:17px;font-weight:600;letter-spacing:-.015em;line-height:1.32;padding-inline-end:36px}
.star{position:absolute;top:14px;inset-inline-end:13px;border:0;background:none;cursor:pointer;
  font-size:18px;line-height:1;color:var(--ink3);padding:6px;transition:transform .15s}
.star[aria-pressed="true"]{color:#ff9f0a}
.star:active{transform:scale(.82)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:11.5px;padding:3px 9px;border-radius:20px;background:var(--sunk);color:var(--ink2);white-space:nowrap;line-height:1.75}
.tag.city{background:var(--blue-soft);color:var(--blue);font-weight:600}
.tag.hire{background:var(--green-soft);color:var(--green);font-weight:600}
.desc{font-size:13.5px;color:var(--ink2);margin-top:11px;flex:1}
.priceline{display:flex;align-items:baseline;gap:7px;margin-top:14px;flex-wrap:wrap}
.priceline b{font-size:16px;font-weight:600;letter-spacing:-.015em}
.priceline small{font-size:12px;color:var(--ink3)}
.btn{margin-top:14px;width:100%;border:0;background:var(--blue);color:#fff;font-size:15px;font-weight:500;
  padding:11px;border-radius:11px;cursor:pointer;transition:opacity .15s,transform .12s}
.btn:hover{opacity:.88} .btn:active{opacity:.7;transform:scale(.985)}
.empty{grid-column:1/-1;background:var(--card);border-radius:19px;padding:32px;text-align:center;color:var(--ink2);box-shadow:var(--shadow)}

/* ============ SHEET ============ */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;opacity:0;pointer-events:none;transition:opacity .3s}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:210;background:var(--card);inset:auto 0 0 0;margin:0 auto;max-width:640px;
  border-radius:24px 24px 0 0;max-height:90vh;max-height:90dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;padding-bottom:var(--safeB);
  transform:translateY(103%);transition:transform .38s cubic-bezier(.32,.72,0,1);box-shadow:var(--shadow-lg)}
.sheet.on{transform:translateY(0)}
.sheet.drag{transition:none}
@media(min-width:700px){
  .sheet{inset:50% 0 auto 0;transform:translateY(-46%) scale(.965);opacity:0;border-radius:24px;max-height:84vh}
  .sheet.on{transform:translateY(-50%) scale(1);opacity:1}
}
.grab{padding:9px 0 3px;cursor:grab;touch-action:none}
.grab i{display:block;width:38px;height:5px;background:var(--line);border-radius:3px;margin:0 auto}
@media(min-width:700px){.grab{display:none}}
.sin{padding:14px 24px 30px;position:relative}
.sin h2{font-size:23px;font-weight:700;letter-spacing:-.026em;padding-inline-end:44px;line-height:1.28}
.sin .sub{font-size:13.5px;color:var(--ink3);margin-top:5px}
.close{position:absolute;top:12px;inset-inline-end:20px;width:31px;height:31px;border:0;border-radius:50%;
  background:var(--sunk);color:var(--ink2);font-size:15px;line-height:1;cursor:pointer}
.rows{margin-top:19px;border-top:1px solid var(--line)}
.row{display:flex;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.row .k{width:104px;flex:none;color:var(--ink3);font-size:13px}
.row .v{flex:1;word-break:break-word;min-width:0}
.badge{display:inline-block;font-size:11.5px;padding:3px 10px;border-radius:20px;font-weight:600;line-height:1.7}
.badge.ok{background:var(--green-soft);color:var(--green)}
.badge.chk{background:var(--amber-soft);color:var(--amber)}
.tip{margin-top:18px;background:var(--bg);border-radius:15px;padding:15px 16px;font-size:13.5px;color:var(--ink2)}
.tip b{color:var(--ink);display:block;margin-bottom:5px;font-size:12.5px}
.actions{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}
.actions a{flex:1 1 126px;text-align:center;text-decoration:none;font-size:14.5px;font-weight:500;
  padding:12px;border-radius:11px;background:var(--blue);color:#fff}
.actions a.ghost{background:var(--sunk);color:var(--ink)}
.actions a:active{opacity:.7}

/* ============ TABLE ============ */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:19px;box-shadow:var(--shadow);margin-top:15px}
table{width:100%;border-collapse:collapse;background:var(--card);font-size:14.5px;min-width:320px}
th,td{padding:14px 18px;text-align:start;border-bottom:1px solid var(--line)}
th{font-weight:600;font-size:12.5px;color:var(--ink3);background:var(--hair)}
tr:last-child td{border-bottom:0}
td:last-child{text-align:end;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ============ JOBS ============ */
.joblist{display:flex;flex-direction:column;gap:11px;margin-top:15px}
.job{background:var(--card);border-radius:19px;box-shadow:var(--shadow);padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.job .jm{flex:1 1 230px;min-width:0}
.job b{font-size:16px;font-weight:600;letter-spacing:-.012em;display:block}
.job .rl{font-size:13.5px;color:var(--ink2);margin-top:3px}
.job .lc{font-size:12.5px;color:var(--ink3);margin-top:5px}
.job a.go{text-decoration:none;font-size:14.5px;font-weight:500;padding:10px 18px;border-radius:11px;
  background:var(--sunk);color:var(--ink);white-space:nowrap;flex:1 1 auto;text-align:center}
.boards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-top:15px}
.boards a{background:var(--card);border-radius:16px;padding:16px;text-decoration:none;box-shadow:var(--shadow);
  color:var(--ink);font-size:14.5px;font-weight:600}
.boards a small{display:block;color:var(--ink3);font-weight:400;font-size:12px;margin-top:4px}

/* ============ SOURCES ============ */
.srcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:13px;margin-top:15px}
.slist{margin-top:13px;font-size:14px;color:var(--ink2)}
.slist li{margin-inline-start:19px;margin-bottom:7px}
kbd{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:11.5px;background:var(--sunk);
  border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1.5px 6px;color:var(--ink2);direction:ltr;display:inline-block}
footer{border-top:1px solid var(--line);padding:24px 0 40px;color:var(--ink3);font-size:12.5px;line-height:1.9}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

"ORBIS Production":["خانه فول‌سرویس فیلم، عکس و ویدیو با بیش از ۱۵ سال کار. اسپات تلویزیونی و دیجیتال، فیلم شرکتی، برندد کانتنت، مستند و رویداد.","تیم در وین، زوریخ، پاریس، آمستردام، لندن، مونیخ، دبی، توکیو و لس‌آنجلس. تأمین کرو، اجاره تجهیزات، لوکیشن اسکاوتینگ و کستینگ را به‌عنوان سرویس می‌فروشند، یعنی مدام دنبال کرو محلی هستند. قوی‌ترین سرنخ این فهرست.","میلان، با دفاتر رم و ونیز"],
"Courage Production":["تولید ویدیو و عکس های‌اند و جایزه‌گرفته برای فشن، لاکچری و صنعت عینک.","دفتر مرکزی در میلان اما فیلم‌برداری در دریاچه کومو، ونیز، فلورانس، توسکانی، سیسیل، پولیا، ساحل آمالفی و ناپل. کستینگ، لوکیشن اسکاوتینگ و اجاره کرو و تجهیزات ارائه می‌دهند.","میلان"],
"Dare Studio":["استودیو کریتیو میلانی در ارتباطات بصری و محتوای مولتی‌مدیا: ویدیوی تبلیغاتی، فشن فیلم، موزیک ویدیو و فیلم نهادی.","تیمی یکپارچه از ویدیومیکر، عکاس، استایلیست و دیجیتال استراتژیست — دقیقاً همان ساختاری که مدام به آدم پشت دوربین نیاز دارد.","میلان"],
"Bliss Agency":["ایجنسی یکپارچه مارکتینگ و ارتباطات، متخصص پوزیشنینگ برندهای پریمیوم. دفاتر رم و میلان.","مشتریان شامل Pandora، Laura Biagiotti، Profumum Roma، Doreca و Charles Philip Milano. کیس‌استادی‌هایشان اعداد سخت گزارش می‌کند، مثل ۶٫۳ میلیون بازدید در ۶۰ روز برای Doreca — این سطح از خروجی به تولید حجمی نیاز دارد.","میلان و رم"],
"Ad Produzioni (Ad Sphera Group)":["خانه تولید ویدیو بر پایه روایت بصری: کارگردان، مدیر فیلم‌برداری و اپراتور دوربین برای تلویزیون و کانال‌های سوشال، به‌همراه پخش زنده.","بخشی از Ad Sphera Group در کنار Ad Web Agency و Ad Comunicazione. خودشان از یک تیم داخلی عکاس و ویدیومیکر می‌گویند.","میلان"],
"CM Video Agency":["خانه تولید ویدیوی شرکتی و تبلیغاتی برای شرکت‌های ایتالیایی که در خارج تبلیغ می‌کنند. تروپ ENG، تلویزیون، مستند و ویدیوی آموزشی.","موشن گرافیک و سه‌بعدی صنعتی، کارگردانی و پخش زنده، فیلم‌برداری هوایی و کمرا کار، ترجمه چندزبانه و صداگذاری. کار براڈکست یعنی اپراتور حرفه‌ای.","میلان و رم"],
"ELEVEN STUDIO PRODUZIONI SAS":["تولید ویدیو در میلان: اسپات تبلیغاتی، فیلم شرکتی و نهادی، رویداد، ویدیوی محصول، سه‌بعدی و موشن گرافیک.","طیف خدمات گسترده شامل سه‌بعدی و موشن، پس مهارت افترافکتس این‌جا مزیت واقعی است.","میلان"],
"CA Video Production":["ایجنسی ویدیو در خدمت شرکت‌ها و متخصصان، با دفتر مرکزی میلان.","خودشان می‌گویند دفتر مرکزی را به‌خاطر تراکم شرکت‌ها و مولتی‌نشنال‌ها در میلان انتخاب کرده‌اند.","میلان"],
"Multistudio (Visual Storymaking Srl)":["ایجنسی ارتباطات متخصص تولید محتوا با تمرکز بر تصویر.","برندی از Visual Storymaking Srl. جهت‌گیری محتوامحور یعنی حجم خروجی بالا و احتمال همکاری پیوسته.","میلان"],
"NDV Comunicazione":["تولید ویدیو یکپارچه با سئو، تبلیغات و قیف تبدیل.","یک مجموعه پرفورمنس‌محور. ویدیو را به‌عنوان ابزار کمپین می‌فروشند، پس سرعت و حجم مهم‌تر از پرداخت سینمایی است.","میلان"],
"Maya Studios":["خدمات تولید ویدیو و اسپات تبلیغاتی.","در دایرکتوری کسب‌وکارهای Europages فهرست شده.","میلان"],
"Square Marketing":["ایجنسی دیجیتال مارکتینگ با ارائه خدمات ویدیو.","ویدیو یکی از چند سرویس است، نه پیشنهاد اصلی.","میلان"],
"Wrdigital Srl":["دنبال ویدیومیکر برای محتوای سوشال: فیلم‌برداری و تدوین، محتوای کوتاه عمودی برای ریلز، تیک‌تاک و یوتیوب شورتس.","این تقریباً دقیقاً همان مدل ۳۰ ویدیو در ماه است. نیاز به راحتی با ابزارهای گرافیک و تدوین دارد. توجه کن که نووا میلانزه بیرون از شهر میلان است.","نووا میلانزه، استان مونزا"],
"Randstad Group Italia":["کارآموزی ویدیومیکر و متخصص صوتی‌تصویری. دو تا چهار سال تجربه به‌عنوان ویدیومیکر یا ادیتور در ایجنسی، شرکت یا فریلنس می‌خواهد.","فیلم‌برداری در استودیو و لوکیشن: ست‌آپ دوربین، نور و صدا. Randstad واسطه است و چند کارفرما را هم‌زمان پوشش می‌دهد، پس ثبت‌نام در آن به‌تنهایی ارزش وقتش را دارد.","استان میلان"],
"Vidmotion SRL":["ایجنسی مارکتینگ و تولید ویدیو با دفتر میلان، در حال جذب ویدیومیکر و عکاس برای تیم کریتیو.","نقشی ترکیبی از ویدیو و عکس. از طریق Adzuna منتشر شده — لینک مستقیمش در تب استخدام است.","میلان"],
"Lombardini22 Spa":["شرکت معماری و طراحی، در حال جذب ویدیومیکر داخلی.","آشنایی با CapCut، InShot یا مشابه می‌خواهد، برای ساخت و تطبیق ریلز، تیک‌تاک، استوری و ویدیوی کوتاه. نقش داخلی بیرون از دنیای ایجنسی معمولاً یعنی ساعت کاری باثبات‌تر.","استان میلان"],
"CAFFEINA":["در حال جذب متخصص پروداکشن AI. محتوای سوشال، کمپین‌های دیجیتال تمام‌AI، اسپات تلویزیونی و آزمایش کریتیو.","نقشی که ویدیوی سنتی را با تولید مولد ترکیب می‌کند. هر تجربه عملی با ابزارهای ویدیوی AI این‌جا تمایز جدی است.","میلان"],
"Digital Dust Agency":["دنبال ویدیومیکر، ادیتور و عکاس جونیور برای پیوستن به ایجنسی.","کارآموزی curriculare شش‌ماهه با کمک‌هزینه ۳۰۰ یورو در ماه. توجه کن که stage curriculare معمولاً به توافق‌نامه با یک مؤسسه آموزشی نیاز دارد — قبل از اقدام این شرط را تأیید کن.","میلان"],
"RE-FORME SRL":["کارآموز تدوین ویدیو و تولید محتوا در تیم Studios. ساخت محتوا با ابزارهای AI مولد برای تصویر، ویدیو، صدا و متن.","موقعیتی در سطح کارآموزی.","میلان"],
"Ciaopeople Media Group":["کارآموز روایتگری شبکه‌های اجتماعی برای Geopop. تحقیق ترند و ایده‌های کریتیو عکس و ویدیو، توسعه فرمت‌های سوشال و کمک به اداره کانال‌ها.","Geopop یکی از بزرگ‌ترین ناشران محتوای علمی ایتالیاست. حجم انتشار بسیار بالا، که تجربه پورتفولیویی عالی می‌سازد.","میلان"],
"Tether Operations Limited":["فیلم‌ساز AI، کاملاً دورکاری.","دورکاری کامل مسئله جغرافیا را کلاً حذف می‌کند. اگر اقامت یا رفت‌وآمد هنوز تثبیت نشده، گزینه عملی‌ای است.","دورکاری، آگهی برای میلان"]
},
it:{
"UNCUT Studio SRL":["Fondata nel 2014 da Gianluca Guidone e Tazio Massimi. Video corporate pensati per il marketing, realizzati da team coordinati di videomaker.","Registrata anche come spazio studio affittabile a Torino. La struttura per team la rende uno dei bersagli più realistici per una collaborazione freelance.","Via Boston 118a, 10137 Torino"],
"Company Trailer Srl":["Film aziendali emozionali, video industriali, reportage, riprese di eventi e spot pubblicitari.","Una delle due sole agenzie torinesi con una soglia dichiarata così bassa. Molto conosciuta per il lavoro industriale in tutto il Piemonte.","Torino"],
"Born Human":["Agenzia creativa che copre video e VR a 360 gradi, brand identity, design visivo e gestione di campagne pubblicitarie. Clienti nazionali e internazionali.","Email e indirizzo sono pubblicati sul loro profilo. Con una soglia di €5.000 è quasi certo che i lavori più piccoli finiscano a freelance — una buona via d'ingresso.","Via Buttigliera 11, 10132 Torino"],
"Sixeleven":["Agenzia di comunicazione e digitale con un reparto di produzione video interno.","Una realtà full-service: il video è uno dei tanti servizi, non il mestiere centrale.","Torino"],
"Mailander":["Agenzia indipendente di comunicazione integrata con oltre 35 anni di attività. Relazioni pubbliche, crisis management, comunicazione interna ed eventi.","Membro del network internazionale di agenzie indipendenti PROI Worldwide dal 2016, certificata ISO 9001 e ISO 27001. Il nome più consolidato di questo elenco.","Torino"],
"Domino Interaction Agency":["Quattro aree di competenza: service design, digital marketing e lead generation, prodotti digitali e produzione, e IT.","Attiva dal 1996, circa 50 persone, certificata B Corp dal 2025. Due sedi, Torino e Venezia.","Torino e Venezia"],
"Magma Marketing":["Agenzia di comunicazione a Torino e Alba che supporta piccole e medie imprese su fotografia, video, brand identity, siti, e-commerce e social.","Dichiarano apertamente che riprese e produzione video sono gestite con partner esterni. È un'apertura diretta per un videomaker freelance.","Torino e Alba"],
"The Basket":["Gestione social media, riprese video compresi 3D e drone, affissioni e siti web, supportati da campagne Google Ads.","Se hai il patentino per il drone, è una delle poche agenzie torinesi che pubblicizza esplicitamente il lavoro aereo.","Torino"],
"Reelab Studio":["Un'agenzia di comunicazione e una casa di produzione video insieme.","Il modello ibrido agenzia più produzione di solito significa lavoro più costante e più probabilità di un contratto social ricorrente.","Torino"],
"MediaVideo SaS":["Specialisti in montaggio e post-produzione.","Orientata al montaggio, quindi più adatta se il tuo punto forte è la post. Il mercato torinese del montaggio va da €70 a €900 a progetto.","Torino"],
"RECTV Produzioni":["Produzione video con un'inclinazione broadcast.","Il nome punta al lavoro televisivo, che tende a significare domanda ricorrente di operatori di ripresa e troupe.","Torino"],
"RIPRESE VIDEO TORINO":["Servizi di riprese e produzione video.","Un modello di business da servizio riprese. Queste realtà lavorano quasi sempre su una rosa di operatori freelance.","Torino"],
"Torino Podcast":["Produzione di podcast e video podcast.","Il video podcast è una nicchia in crescita e normalmente richiede un operatore multicamera.","Torino"],
"videosocial chef":["Video social concentrati sul settore food e ristorazione.","Una nicchia food. Alto volume di reel con budget più bassi, il che si sposa bene con il modello da €40 a video.","Torino"],
"Golden Studios":["Studio combinato di fotografia e video.","Nessun prezzo pubblico. Gli studi a guida fotografica lavorano di solito a tariffa giornaliera e tendono a essere flessibili sulla collaborazione a progetto.","Torino"],
"VALI Production":["Casa di produzione video a Torino.","Nessun prezzo pubblico. Dovrai chiedere un preventivo.","Torino"],
"Robin Studio":["Studio di produzione video.","Nessun prezzo pubblico.","Torino"],
"Filmika":["Casa di produzione video.","Nessun prezzo pubblico.","Torino"],
"The Lab":["Studio di produzione video.","Nessun prezzo pubblico.","Torino"],
"SECRET STUDIO®":["Studio di produzione video con marchio registrato.","Nessun prezzo pubblico.","Torino"],
"Soundless Studio":["Studio di produzione video e comunicazione.","Nessun prezzo pubblico.","Torino"],
"Paola Caramella News":["Agenzia di comunicazione e casa di produzione multimediale con sede a Torino, operativa a livello nazionale.","La copertura nazionale comporta un bisogno ricorrente di troupe locali in altre città.","Torino"],
"Ars Media":["Agenzia di comunicazione integrata con una sede a Torino.","Al momento ha un annuncio aperto per un copy strategist. Un team in crescita è un buon momento per una candidatura spontanea con portfolio video.","Torino"],
"Manuele di Siro VIDEO":["Videomaker indipendente e produzione video.","Un freelance singolo — più concorrente che cliente, ma utile per fare rete e per la seconda camera su set più grandi.","Torino"],
"Luigi Naro Videomaker":["Videomaker indipendente.","Freelance singolo. Vale la pena conoscerlo per le riprese in due.","Torino"],
"Silvia Pesce Videomaker":["Videomaker indipendente.","Freelance singolo.","Torino"],
"Thirty Seconds Milano":["Oltre 25 anni di attività. Documentari e reportage, video commerciali e corporate, conferenze e congressi, spettacoli musicali, riprese aeree e interviste in lingua madre in Italia e in Europa.","Linea ufficio +39 02 8718 6040. P.IVA 07064450963. Tra i clienti Samsung Italia, Nintendo, General Electric, Electronic Arts, Savills e CEIA. Lavorano anche in B2B per altre agenzie, che è una via d'ingresso.","Via Vincenzo Monti 54, 20123 Milano"],
"ORBIS Production":["Casa full-service di produzione film, foto e video con oltre 15 anni di lavoro. Spot TV e digital, corporate film, branded content, documentari ed eventi.","Team a Vienna, Zurigo, Parigi, Amsterdam, Londra, Monaco, Dubai, Tokyo e Los Angeles. Vendono reperimento troupe, noleggio attrezzature, location scouting e casting come servizi, il che significa che cercano costantemente troupe locali. Il contatto singolo più promettente.","Milano, con sedi a Roma e Venezia"],
"Courage Production":["Produzione video e fotografica di alto profilo e pluripremiata per moda, lusso e occhialeria.","Quartier generale a Milano ma riprese sul Lago di Como, a Venezia, Firenze, in Toscana, Sicilia, Puglia, Costiera Amalfitana e Napoli. Offrono casting, location scouting, noleggio troupe e attrezzature.","Milano"],
"Dare Studio":["Studio creativo milanese di comunicazione visiva e contenuti multimediali: video promozionali, fashion film, videoclip e film istituzionali.","Un team integrato di videomaker, fotografi, stylist e digital strategist — esattamente la struttura che continua ad aver bisogno di persone dietro la camera.","Milano"],
"Bliss Agency":["Agenzia integrata di marketing e comunicazione specializzata nel posizionamento di brand premium. Sedi a Roma e Milano.","Tra i clienti Pandora, Laura Biagiotti, Profumum Roma, Doreca e Charles Philip Milano. I loro case study riportano numeri concreti, come 6,3 milioni di visualizzazioni in 60 giorni per Doreca — un volume così richiede produzione continua.","Milano e Roma"],
"Ad Produzioni (Ad Sphera Group)":["Casa di produzione video costruita sul visual storytelling: registi, direttori della fotografia e operatori per la televisione e i canali social, più live streaming.","Parte di Ad Sphera Group insieme ad Ad Web Agency e Ad Comunicazione. Descrivono un team interno di fotografi e videomaker.","Milano"],
"CM Video Agency":["Casa di produzione per video corporate e pubblicitari rivolti alle imprese italiane che promuovono all'estero. Troupe ENG, televisione, documentari e video formativi.","Motion graphics e 3D industriale, regia e diretta streaming, riprese aeree e camera car, traduzione multilingua e oversound. Il lavoro broadcast richiede operatori professionisti.","Milano e Roma"],
"ELEVEN STUDIO PRODUZIONI SAS":["Produzione video a Milano: spot, film corporate e istituzionali, eventi, video di prodotto, 3D e motion graphics.","Gamma di servizi ampia che comprende 3D e motion, quindi qui la competenza in After Effects è un vantaggio reale.","Milano"],
"CA Video Production":["Agenzia video al servizio di aziende e professionisti, con sede principale a Milano.","Dichiarano di aver scelto Milano per la sede centrale per la densità di aziende e multinazionali.","Milano"],
"Multistudio (Visual Storymaking Srl)":["Agenzia di comunicazione specializzata nella produzione di contenuti con un focus sull'immagine.","Un brand di Visual Storymaking Srl. Il posizionamento sui contenuti implica alto volume di output e possibilità di collaborazione continuativa.","Milano"],
"NDV Comunicazione":["Produzione video integrata con SEO, advertising e funnel di conversione.","Una realtà orientata alla performance. Vendono il video come strumento di campagna, quindi contano più velocità e volume della finitura cinematografica.","Milano"],
"Maya Studios":["Servizi di produzione video e spot pubblicitari.","Elencata nella directory aziendale Europages.","Milano"],
"Square Marketing":["Agenzia di digital marketing che offre servizi video.","Il video è uno dei servizi, non l'offerta principale.","Milano"],
"Wrdigital Srl":["Cercano un video maker per contenuti social: riprese e montaggio, contenuti verticali brevi per Reels, TikTok e YouTube Shorts.","È quasi esattamente il modello da 30 video al mese. Richiede dimestichezza con strumenti di grafica e montaggio. Nota che Nova Milanese è fuori dal comune di Milano.","Nova Milanese, provincia di Monza"],
"Randstad Group Italia":["Stage come Video Maker e Audiovisual Specialist. Chiedono da due a quattro anni di esperienza come videomaker o montatore, in agenzia, in azienda o da freelance.","Riprese in studio e in location: setup camera, luci e audio. Randstad è un intermediario che copre più datori di lavoro insieme, quindi iscriversi vale il tempo anche solo per questo.","Provincia di Milano"],
"Vidmotion SRL":["Agenzia di marketing e produzione video con sede a Milano, cerca un videomaker e fotografo per il team creativo.","Un ruolo che unisce video e foto. Pubblicato via Adzuna — il link diretto è nella scheda Lavoro.","Milano"],
"Lombardini22 Spa":["Studio di architettura e design che cerca un video maker interno.","Chiede dimestichezza con CapCut, InShot o simili, per produrre e adattare reel, TikTok, storie e video short-form. Un ruolo interno fuori dal mondo delle agenzie di solito significa orari più stabili.","Provincia di Milano"],
"CAFFEINA":["Cercano un AI Production Specialist. Contenuti social, campagne digital full-AI, spot TV e sperimentazione creativa.","Un ruolo che unisce il video tradizionale alla produzione generativa. Qualsiasi esperienza pratica con strumenti video AI è un differenziatore serio.","Milano"],
"Digital Dust Agency":["Cercano un videomaker, montatore e fotografo junior da inserire in agenzia.","Uno stage curricolare di sei mesi con un rimborso spese di €300 al mese. Attenzione: lo stage curriculare richiede normalmente una convenzione con un ente formativo — verifica questa condizione prima di candidarti.","Milano"],
"RE-FORME SRL":["Stage come video editor e content creator nel team Studios. Creazione di contenuti con strumenti di AI generativa per immagini, video, audio e copy.","Una posizione a livello di stage.","Milano"],
"Ciaopeople Media Group":["Stage come social media storyteller per Geopop. Ricerca di trend e spunti creativi foto e video, sviluppo di format social e supporto alla gestione dei canali.","Geopop è uno dei maggiori editori di contenuti scientifici in Italia. Volume di pubblicazione altissimo, il che lo rende un'ottima esperienza da portfolio.","Milano"],
"Tether Operations Limited":["AI Filmmaker, completamente da remoto.","Il full remote elimina del tutto il problema geografico. Un'opzione pratica se residenza o spostamenti non sono ancora sistemati.","Da remoto, annuncio per Milano"]
}};

function calc(){
  const fEl=document.getElementById('cf'), vEl=document.getElementById('cv');
  if(!fEl||!vEl) return;
  const f=+fEl.value||0, v=Math.max(+vEl.value||1,1), per=f/v, d=L.dash;
  document.getElementById('cout').innerHTML=`€${nf(Math.round(per*100)/100)}<em>${esc(d.per)}</em>`;
  const vd=document.getElementById('cverd'), tx=vd.querySelector('span');
  vd.className='verdict';
  if(per<40){vd.classList.add('warn'); tx.textContent=d.v0;}
  else if(per<=50){vd.classList.add('ok'); tx.textContent=d.v1;}
  else if(per<=150){vd.classList.add('hi'); tx.textContent=d.v2;}
  else {vd.classList.add('hi'); tx.textContent=d.v3;}
  document.getElementById('cnote').textContent=d.cn(eur(Math.round(f*12)), v*2);
}

      <div class="chips" id="chips">${tags.map(p=>
        `<button class="chip" aria-pressed="${p[0]===chip}" data-s="${esc(p[0])}">${esc(p[1])}</button>`).join('')}</div>
      <div class="resline"><span id="count"></span><button class="linkbtn" id="copybtn">${esc(t.copy)}</button></div>
    </div>
    <div class="grid" id="grid"></div>`;
  renderGrid();
}
function matches(){
  return D.filter(r=>{
    if(filter==='hiring'&&!r.h) return false;
    if(filter==='saved'&&!saved.has(r.n)) return false;
    if((filter==='Turin'||filter==='Milan')&&r.c!==filter) return false;
    if(chip&&!r.t.includes(chip)) return false;
    if(query&&!hay(r).includes(query)) return false;
    return true;
  });
}
function renderGrid(){
  const t=L.dr; let M=matches();
  if(sort==='az')    M=[...M].sort((a,b)=>a.n.localeCompare(b.n));
  if(sort==='ver')   M=[...M].sort((a,b)=>(b.v-a.v)||a.n.localeCompare(b.n));
  if(sort==='price') M=[...M].sort((a,b)=>(a.min||99999)-(b.min||99999));
  const cEl=document.getElementById('count');
  if(cEl) cEl.textContent=M.length?t.of(M.length,D.length)+(saved.size?t.sv(saved.size):''):'';
  const g=document.getElementById('grid'); if(!g) return;
  g.innerHTML=M.length?M.map(r=>{
    const i=D.indexOf(r), on=saved.has(r.n);
    return `<article class="card">
      <button class="star" aria-pressed="${on}" data-save="${i}" aria-label="${esc(t.save)}">${on?'★':'☆'}</button>
      <h3>${esc(r.n)}</h3>
      <div class="meta"><span class="tag city">${esc(rc(r))}</span>${r.h?`<span class="tag hire">${esc(L.sh.open)}</span>`:''}${rt(r).slice(0,2).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>
      <p class="desc">${esc(rd(r))}</p>
      <div class="priceline"><b><bdi>${esc(rp(r))}</bdi></b><small>${r.min>0?esc(t.minimum):(r.p==='Open role'?'':esc(t.norate))}</small></div>
      <button class="btn" data-i="${i}">${esc(t.view)}</button>
    </article>`;}).join('')
    :`<div class="empty">${esc(t.empty)}</div>`;
}

/* ==================== PRICING ==================== */

  const tbl=(head,rows)=>`<div class="scroll"><table><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${esc(r[0])}</td><td><bdi>${esc(r[1])}</bdi></td></tr>`).join('')}</tbody></table></div>`;
  document.getElementById('p-price').innerHTML=`
    <div class="lede"><h1>${esc(p.h1)}</h1><p>${esc(p.p)}</p></div>
    <div class="rule"></div>
    <h2 class="sec">${esc(p.ladH)}</h2><div class="note-inline">${esc(p.ladC)}</div>${tbl(p.th,p.rows)}
    <div class="rule"></div>
    <h2 class="sec">${esc(p.pkH)}</h2><div class="note-inline">${esc(p.pkC)}</div>${tbl(p.pth,p.prows)}
    <div class="box" style="margin-top:15px"><h3>${esc(p.bxH)}</h3><div class="cap">${esc(p.bxC)}</div>
      <p style="font-size:14px;color:var(--ink2)">${esc(p.bxP)}</p></div>
    <div class="rule"></div>
    <h2 class="sec">${esc(p.exH)}</h2><div class="note-inline">${esc(p.exC)}</div>${tbl(p.eth,p.erows)}`;
}

    <h2 class="sec">${esc(j.openH)}</h2>

      `<a href="${BOARD_URLS[i]}" target="_blank" rel="noopener">${esc(b[0])}<small>${esc(b[1])}</small></a>`).join('')}</div>`;

/* ==================== SOURCES ==================== */

  const s=L.sr, sh=L.sh;

      <div class="box"><h3><span class="badge ok">${esc(sh.verified)}</span></h3><p style="font-size:13.5px;color:var(--ink2);margin-top:11px">${esc(s.verP)}</p></div>
      <div class="box"><h3><span class="badge chk">${esc(sh.check)}</span></h3><p style="font-size:13.5px;color:var(--ink2);margin-top:11px">${esc(s.chkP)}</p></div>
      <div class="box"><h3>${esc(s.priH)}</h3><p style="font-size:13.5px;color:var(--ink2);margin-top:11px">${esc(s.priP)}</p></div>

/* ==================== SHEET ==================== */
const sheet=document.getElementById('sheet'), bdEl=document.getElementById('bd'), sin=document.getElementById('sin');
let lastFocus=null;
function openSheet(i){
  const r=D[i], sh=L.sh; lastFocus=document.activeElement;
  const addr=ra(r);
  const gq=encodeURIComponent(r.n+' '+r.c+' Italy contatti email telefono');
  const rows=[
    [sh.city, esc(rc(r))],
    [sh.address, addr?esc(addr):esc(sh.none)],
    [sh.phone, r.ph?`<a href="tel:${r.ph.replace(/\s/g,'')}" dir="ltr">${esc(r.ph)}</a>`:esc(sh.none)],
    [sh.email, r.e?`<a href="mailto:${esc(r.e)}" dir="ltr">${esc(r.e)}</a>`:esc(sh.none)],
    [sh.website, r.w?`<a href="${esc(r.w)}" target="_blank" rel="noopener" dir="ltr">${esc(r.w.replace(/^https?:\/\//,''))}</a>`:esc(sh.none)],
    [sh.services, esc(rt(r).join(SEP[lang]))],
    [sh.budget, r.p==='Open role'?esc(sh.na):`<bdi>${esc(rp(r))}</bdi>`],
    [sh.hiring, r.h?`<span class="badge ok">${esc(sh.open)}</span>`:esc(sh.nolist)],
    [sh.data, r.v?`<span class="badge ok">${esc(sh.verified)}</span>`:`<span class="badge chk">${esc(sh.check)}</span>`]
  ];
  sin.innerHTML=`
    <button class="close" id="cls" aria-label="${esc(sh.close)}">✕</button>
    <h2 id="shtitle">${esc(r.n)}</h2>
    <div class="sub">${esc(rc(r))} · ${esc(rt(r).slice(0,3).join(' · '))}</div>
    <div class="rows">${rows.map(x=>`<div class="row"><div class="k">${esc(x[0])}</div><div class="v">${x[1]}</div></div>`).join('')}</div>
    <div class="tip"><b>${esc(sh.note)}</b>${esc(rx(r))}</div>
    <div class="actions">
      ${r.e?`<a href="mailto:${esc(r.e)}?subject=${encodeURIComponent(sh.subject(r.n))}">${esc(sh.doEmail)}</a>`:''}
      ${r.w?`<a class="${r.e?'ghost':''}" href="${esc(r.w)}" target="_blank" rel="noopener">${esc(sh.doSite)}</a>`:''}
      <a class="ghost" href="https://www.google.com/search?q=${gq}" target="_blank" rel="noopener">${esc(sh.doFind)}</a>
      ${r.a&&r.a.length>6?`<a class="ghost" href="${mapURL(r.a)}" target="_blank" rel="noopener">${esc(sh.doMap)}</a>`:''}
    </div>`;
  bdEl.classList.add('on'); sheet.classList.add('on'); sheet.scrollTop=0;
  document.body.style.overflow='hidden';
  document.getElementById('cls').focus();
}
function shut(){
  bdEl.classList.remove('on'); sheet.classList.remove('on'); sheet.style.transform='';
  document.body.style.overflow='';
  if(lastFocus&&document.contains(lastFocus)) lastFocus.focus();
}
bdEl.onclick=shut;
(function(){
  const grab=document.getElementById('grab'); let y0=0,dy=0,on=false;
  grab.addEventListener('touchstart',e=>{y0=e.touches[0].clientY;dy=0;on=true;sheet.classList.add('drag')},{passive:true});
  grab.addEventListener('touchmove',e=>{if(!on)return;dy=Math.max(0,e.touches[0].clientY-y0);sheet.style.transform='translateY('+dy+'px)'},{passive:true});
  grab.addEventListener('touchend',()=>{if(!on)return;on=false;sheet.classList.remove('drag');if(dy>90)shut();else sheet.style.transform=''});
})();

/* ==================== EVENTS ==================== */
function go(p){
  tab=p;
  document.querySelectorAll('[data-p]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.p===p)));
  document.querySelectorAll('.panel').forEach(el=>el.classList.toggle('on',el.id==='p-'+p));
  window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
  const t=e.target;
  const nav=t.closest('[data-p]');   if(nav){go(nav.dataset.p); return;}
  if(t.closest('#cls')){shut(); return;}
  const sv=t.closest('[data-save]');
  if(sv){const n=D[+sv.dataset.save].n; saved.has(n)?saved.delete(n):saved.add(n); renderGrid(); return;}
  const it=t.closest('[data-i]');    if(it){openSheet(+it.dataset.i); return;}
  const ch=t.closest('.chip');
  if(ch){const on=ch.getAttribute('aria-pressed')==='true';
    document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed','false'));
    if(on){chip=null;} else {ch.setAttribute('aria-pressed','true'); chip=ch.dataset.s;}
    renderGrid(); return;}
  const sg=t.closest('#dseg button');
  if(sg){document.querySelectorAll('#dseg button').forEach(b=>b.setAttribute('aria-selected','false'));
    sg.setAttribute('aria-selected','true'); filter=sg.dataset.f; renderGrid(); return;}
  const cp=t.closest('#copybtn');    if(cp) doCopy(cp);
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){query=e.target.value.trim().toLowerCase(); renderGrid();}
  else if(e.target.id==='cf'||e.target.id==='cv') calc();
});
document.addEventListener('change',e=>{
  if(e.target.id==='sort'){sort=e.target.value; renderGrid();}
  else if(e.target.id==='lang') setLang(e.target.value);
});
async function doCopy(btn){
  const t=L.dr;
  if(!saved.size){btn.textContent=t.nothing; setTimeout(()=>{btn.textContent=t.copy},1700); return;}
  const txt=[...saved].map(n=>{const r=D.find(z=>z.n===n);
    return r.n+' — '+r.c+'\n  '+(r.a||'—')+'\n  '+(r.e||'—')+' '+(r.ph||'')+'\n  '+(r.w||'—');}).join('\n\n');
  try{await navigator.clipboard.writeText(txt); btn.textContent=t.copied;}
  catch(err){btn.textContent=t.blocked;}
  setTimeout(()=>{btn.textContent=t.copy},1700);
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&sheet.classList.contains('on')){shut(); return;}
  const tg=(e.target.tagName||'').toLowerCase();
  if(tg==='input'||tg==='select'||tg==='textarea') return;
  if(e.key==='/'){e.preventDefault(); go('dir'); const q=document.getElementById('q'); if(q)q.focus(); return;}
  const n=parseInt(e.key,10);
  if(n>=1&&n<=5) go(PANELS[n-1]);
});

/* ==================== INSTALL ==================== */
const installBtn=document.getElementById('install');
const standalone=(typeof window.matchMedia==='function'&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let deferred=null;
function refreshInstall(){
  if(standalone){installBtn.style.display='none'; return;}
  if(deferred){installBtn.textContent=L.install; installBtn.style.display='block';}
  else if(isIOS){installBtn.textContent=L.installIOS; installBtn.style.display='block';}
  else installBtn.style.display='none';
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault(); deferred=e; refreshInstall();});
window.addEventListener('appinstalled',()=>{deferred=null; installBtn.style.display='none';});
installBtn.onclick=async()=>{
  if(deferred){deferred.prompt(); const r=await deferred.userChoice;
    if(r.outcome==='accepted') installBtn.style.display='none';
    deferred=null; return;}
  go('src');
};

/* ==================== BOOT ==================== */
function setLang(l){
  if(!T[l]) l='en';
  lang=l; L=T[l];
  document.title = l==='fa' ? 'VideoMap — تورین و میلان'
                 : l==='it' ? 'VideoMap — Torino e Milano'
                 : 'VideoMap — Turin & Milan';
  if(sheet.classList.contains('on')) shut();
  renderChrome(); renderDash(); renderDir(); renderPrice(); renderJobs(); renderSrc();
}
setLang(lang);
go('dash');
</script>
