/* ============================================================
   DIA PROD — obsidian gallery vitrine
   Tokens per the supplied design system (variables.css / tokens.json)
   ============================================================ */
:root{
   --dia-origin:'diaprod.it';
--dia-build:'DIAPROD-VTAX-7F3Y';
  /* Colors */
  --obsidian:#1d1d1f;
  --frost-white:#f5f5f7;
  --pure-black:#000000;
  --paper-white:#ffffff;
  --carbon:#111111;
  --platinum:#86868b;
  --graphite:#333336;
  --silver-mist:#cccccc;
  --smoke:#424245;
  --apple-blue:#0071e3;
  --link-blue:#0066cc;
  --halo-blue:#2997ff;
  --signal-orange:#f56900;
  --iris-violet:#8668ff;
  --reef-teal:#00a1b3;
  --line-light:#d2d2d7;

  /* Type */
  --display:'SF Pro Display',-apple-system,BlinkMacSystemFont,'Inter',system-ui,'Segoe UI',sans-serif;
  --text:'SF Pro Text',-apple-system,BlinkMacSystemFont,'Inter',system-ui,'Segoe UI',sans-serif;

  --t-caption:10px;
  --t-xs:12px;
  --t-body:14px;
  --t-lg:17px;
  --t-xl:20px;
  --t-h-sm:19px;
  --t-h:clamp(21px,2.2vw,24px);
  --t-h-lg:clamp(26px,3.2vw,32px);
  --t-display:clamp(32px,5.4vw,56px);
  --t-hero:clamp(40px,7.6vw,80px);

  /* Spacing */
  --s4:4px; --s8:8px; --s12:12px; --s16:16px; --s20:20px; --s24:24px;
  --s28:28px; --s32:32px; --s40:40px; --s48:48px; --s60:60px;
  --s76:76px; --s80:80px; --s96:96px; --s104:104px; --s160:160px;

  --page:1440px;
  --gutter:clamp(20px,4.4vw,48px);
  --band:clamp(72px,9.5vw,120px);

  /* Radius */
  --r-link:10px;
  --r-card:28px;
  --r-card-lg:32px;
  --r-btn:36px;
  --r-pill:980px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--pure-black);
  color:var(--frost-white);
  font-family:var(--text);
  font-size:var(--t-lg);
  line-height:1.47;
  letter-spacing:-0.01em;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
img{max-width:100%;display:block}
button,input,textarea,select{font-family:inherit;font-size:inherit;letter-spacing:inherit;color:inherit}
textarea{resize:vertical}
a{color:var(--halo-blue);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:var(--apple-blue);color:#fff}
:focus-visible{outline:2px solid var(--halo-blue);outline-offset:3px;border-radius:var(--r-link)}
::placeholder{color:var(--smoke)}
.light ::placeholder{color:var(--platinum)}

/* ---------- primitives ---------- */
.wrap{max-width:var(--page);margin:0 auto;padding-inline:var(--gutter);width:100%}
.band{padding-block:var(--band)}
.light{background:var(--paper-white);color:var(--obsidian)}
.frost{background:var(--frost-white);color:var(--obsidian)}
.carbon{background:var(--carbon)}
.stage{background:var(--pure-black)}

.eyebrow{
  font-family:var(--text);font-size:var(--t-lg);font-weight:600;
  letter-spacing:-0.011em;color:var(--signal-orange);margin:0;
}
.eyebrow.violet{color:var(--iris-violet)}
.eyebrow.teal{color:var(--reef-teal)}
.kicker{
  font-family:var(--text);font-size:var(--t-xs);font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;color:var(--platinum);margin:0;
}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
.hero-type{font-size:var(--t-hero);line-height:1.05;letter-spacing:-0.003em;font-weight:600}
.display-type{font-size:var(--t-display);line-height:1.07;letter-spacing:-0.015em;font-weight:600}
.h-lg{font-size:var(--t-h-lg);line-height:1.14;letter-spacing:-0.01em;font-weight:700}
.h-md{font-size:var(--t-h);line-height:1.17;letter-spacing:-0.01em;font-weight:600}
.h-sm{font-size:var(--t-h-sm);line-height:1.21;letter-spacing:-0.015em;font-weight:600}
.body-copy{font-size:var(--t-lg);line-height:1.47;color:var(--platinum);margin:0;max-width:62ch}
.small{font-size:var(--t-body);line-height:1.43;letter-spacing:-0.016em;color:var(--platinum);margin:0}
.caption{font-size:var(--t-caption);line-height:1.83;letter-spacing:-0.037em;color:var(--platinum);margin:0}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s8);
  border:none;cursor:pointer;border-radius:var(--r-btn);
  padding:12px 22px;font-size:var(--t-body);font-weight:600;letter-spacing:-0.016em;
  background:transparent;color:inherit;transition:background .22s ease,color .22s ease,border-color .22s ease,opacity .22s ease;
  text-align:center;
}
.btn-primary{background:var(--apple-blue);color:var(--paper-white)}
.btn-primary:hover{background:#0077ed}
.btn-primary:disabled{opacity:.42;cursor:not-allowed;background:var(--apple-blue)}
.btn-ghost{color:var(--frost-white)}
.btn-ghost:hover{color:var(--paper-white)}
.light .btn-ghost{color:var(--obsidian)}
/* the studio's own call to action: an outline rather than a block of
   colour. A shade brighter than .btn-outline so that where the two stand
   side by side you can still tell which one is the invitation. */
.btn-cta{
  background:rgba(245,245,247,.05);border:1px solid rgba(245,245,247,.34);
  border-radius:var(--r-pill);color:var(--frost-white);
  padding-inline:30px;
  transition:border-color .28s ease,background .28s ease;
}
.btn-cta:hover{border-color:rgba(245,245,247,.62);background:rgba(245,245,247,.09)}
.btn-cta:active{background:rgba(245,245,247,.13)}
.btn-cta.btn-lg{padding:15px 34px}
.light .btn-cta,.frost .btn-cta{
  background:rgba(29,29,31,.04);border-color:rgba(29,29,31,.28);color:var(--obsidian);
}
.light .btn-cta:hover,.frost .btn-cta:hover{border-color:rgba(29,29,31,.55);background:rgba(29,29,31,.08)}
.light .btn-cta:active,.frost .btn-cta:active{background:rgba(29,29,31,.12)}
.btn-outline{border:1px solid var(--smoke);color:var(--frost-white)}
.btn-outline:hover{border-color:var(--silver-mist)}
.light .btn-outline{border-color:var(--line-light);color:var(--obsidian)}
.light .btn-outline:hover{border-color:var(--obsidian)}
.btn-lg{padding:14px 28px;font-size:var(--t-lg);letter-spacing:-0.011em}
.linky{
  background:none;border:none;padding:0;cursor:pointer;
  color:var(--halo-blue);font-size:var(--t-lg);font-weight:400;letter-spacing:-0.011em;
}
.light .linky{color:var(--link-blue)}
.linky:hover{text-decoration:underline}

/* ---------- nav ----------
   Glass, not a black band. At the top of a page the bar is not there
   at all: no pane, no rim, the hero reads straight through it. The
   moment the page moves under it, it takes a frosted pane, a hairline
   of light along its upper edge and a shadow it did not have before.
   The strip it sits in carries a second, softer blur that fades out
   below the bar, so whatever passes underneath dissolves instead of
   being cut off by a hard edge.                                     */
.navwrap{position:sticky;top:0;z-index:60;padding:var(--s12) var(--gutter);background:transparent}

/* the fade under the bar — masked, so the blur itself falls away */
.navwrap::after{
  content:'';position:absolute;left:0;right:0;top:0;height:calc(100% + 36px);
  z-index:-1;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.58),rgba(0,0,0,0));
  backdrop-filter:blur(14px) saturate(140%);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
  -webkit-mask-image:linear-gradient(to bottom,#000 0,#000 55%,rgba(0,0,0,.5) 80%,transparent 100%);
          mask-image:linear-gradient(to bottom,#000 0,#000 55%,rgba(0,0,0,.5) 80%,transparent 100%);
  transition:opacity .45s ease;
}
html.nav-lift .navwrap::after{opacity:1}

.nav{
  max-width:var(--page);margin:0 auto;display:flex;align-items:center;gap:var(--s16);
  justify-content:space-between;border-radius:var(--r-pill);
  padding:8px 8px 8px 20px;
  background:rgba(0,0,0,0);
  backdrop-filter:saturate(100%) blur(0px);
  -webkit-backdrop-filter:saturate(100%) blur(0px);
  border:1px solid transparent;box-shadow:none;
  transition:background .45s ease,border-color .45s ease,box-shadow .45s ease,
             backdrop-filter .45s ease,-webkit-backdrop-filter .45s ease;
}
html.nav-lift .nav{
  background:rgba(14,14,16,.52);
  backdrop-filter:saturate(185%) blur(22px);
  -webkit-backdrop-filter:saturate(185%) blur(22px);
  border-color:rgba(245,245,247,.09);
}

/* ---------- the bar takes its tone from whatever is under it ----------
   Flat in both states — a pane of tinted glass, no rim light and no
   shadow under it. Over the dark bands it darkens slightly; the moment
   a white section passes beneath, the pane and everything written on
   it turn over together.                                             */
html.nav-lift.nav-light .nav{
  background:rgba(255,255,255,.62);
  border-color:rgba(0,0,0,.07);
}
.nav .brand-name,.nav .navlink,.nav .acct-chip,.nav .langbtn,.nav .burger i,
.nav .langbox,.nav .brand svg rect,.nav .btn-cta{
  transition:color .35s ease,background .35s ease,border-color .35s ease,fill .35s ease;
}
html.nav-light .nav .brand-name,
html.nav-light .nav .navlink,
html.nav-light .nav .acct-chip{color:var(--obsidian)}
html.nav-light .nav .brand svg rect{fill:var(--obsidian)}
html.nav-light .nav .langbox{border-color:rgba(0,0,0,.13)}
html.nav-light .nav .langbtn[aria-pressed="true"]{background:var(--obsidian);color:var(--paper-white)}
html.nav-light .nav .burger i{background:var(--obsidian)}
html.nav-light .nav .burger{color:var(--obsidian)}
/* the call to action turns over with the rest of the bar — white on white
   is no button at all */
html.nav-light .nav .btn-cta{
  background:rgba(29,29,31,.05);border-color:rgba(29,29,31,.30);color:var(--obsidian);
}
html.nav-light .nav .btn-cta:hover{border-color:rgba(29,29,31,.58);background:rgba(29,29,31,.09)}
html.nav-light .nav .btn-cta:active{background:rgba(29,29,31,.13)}
html.nav-light .nav-pill{background:rgba(0,0,0,.07)}
html.nav-light .navwrap::after{
  background:linear-gradient(to bottom,rgba(255,255,255,.62),rgba(255,255,255,0));
}

/* no backdrop to filter, no glass — the bar stays readable anyway */
@supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){
  html.nav-lift .nav{background:rgba(0,0,0,.92)}
  html.nav-lift.nav-light .nav{background:rgba(255,255,255,.94)}
  .navwrap::after{background:linear-gradient(to bottom,rgba(0,0,0,.92),rgba(0,0,0,0))}
  html.nav-light .navwrap::after{background:linear-gradient(to bottom,rgba(255,255,255,.94),rgba(255,255,255,0))}
}

/* with no pane under it at the top of a page, the lettering carries its
   own shadow instead — invisible on black, insurance over a bright still */
.nav .brand-name,.nav .navlink,.nav .langbtn,.nav .acct-chip{
  text-shadow:0 1px 14px rgba(0,0,0,.55);
}
html.nav-lift .nav .brand-name,html.nav-lift .nav .navlink,
html.nav-lift .nav .langbtn,html.nav-lift .nav .acct-chip,
html.nav-light .nav .brand-name,html.nav-light .nav .navlink,
html.nav-light .nav .langbtn,html.nav-light .nav .acct-chip{text-shadow:none}
.brand{display:flex;align-items:center;gap:10px;background:none;border:none;cursor:pointer;padding:6px 0}
.brand-name{font-family:var(--display);font-size:var(--t-body);font-weight:600;letter-spacing:.02em;color:var(--frost-white);text-transform:uppercase}
.navlinks{display:flex;align-items:center;gap:2px}
.navlink{
  background:none;border:none;cursor:pointer;padding:8px 14px;border-radius:var(--r-pill);
  font-size:var(--t-xs);font-weight:400;letter-spacing:-0.01em;color:var(--frost-white);opacity:.72;
  transition:opacity .2s ease,background .2s ease;white-space:nowrap;
}
.navlink:hover{opacity:1}
.navlink[aria-current="page"]{opacity:1}
.langbox{display:flex;gap:2px;padding:3px;border-radius:var(--r-pill);border:1px solid var(--graphite)}
.langbtn{
  background:none;border:none;cursor:pointer;padding:5px 10px;border-radius:var(--r-pill);
  font-size:var(--t-caption);font-weight:600;letter-spacing:.06em;color:var(--platinum);transition:.2s;
}
.langbtn[aria-pressed="true"]{background:var(--frost-white);color:var(--pure-black)}
.burger{
  display:none;position:relative;background:none;border:none;cursor:pointer;padding:0;
  width:44px;height:44px;align-items:center;justify-content:center;
  color:var(--frost-white);
}
/* the two lines */
.burger-lines{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;
}
.burger-lines i{
  display:block;width:20px;height:1.5px;background:currentColor;border-radius:2px;
  transition:transform .62s var(--ease-sig),opacity .3s ease .04s;
}
/* the camera, waiting underneath */
.burger-mark{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(.72);filter:blur(3px);
  transition:opacity .34s ease,transform .62s var(--ease-sig),filter .34s ease;
}
.burger-mark svg{display:block}
/* open: the lines meet in the middle and leave, the camera settles in behind them */
html.menu-open .burger-lines i{opacity:0;transition:transform .62s var(--ease-sig),opacity .22s ease}
html.menu-open .burger-lines i:first-child{transform:translateY(3.25px) scaleX(.34)}
html.menu-open .burger-lines i:last-child{transform:translateY(-3.25px) scaleX(.34)}
html.menu-open .burger-mark{
  opacity:1;transform:none;filter:blur(0);
  transition:opacity .42s ease .16s,transform .66s var(--ease-sig) .12s,filter .42s ease .16s;
}
@media (max-width:1000px){
  .navlinks{display:none}
  .burger{display:flex}
}

/* mobile menu */
.sheet{
  position:fixed;inset:0;z-index:90;
  background:
    radial-gradient(120% 70% at 50% 8%,rgba(245,105,0,.07) 0%,rgba(0,0,0,0) 58%),
    radial-gradient(100% 60% at 50% 100%,rgba(41,151,255,.06) 0%,rgba(0,0,0,0) 60%),
    rgba(7,7,8,.94);
  backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);
  display:flex;flex-direction:column;
  padding:calc(var(--nav-h,74px) + var(--s16)) var(--gutter)
          max(var(--s32),calc(env(safe-area-inset-bottom) + 20px));
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .46s var(--ease-sig),visibility 0s linear .46s;
}
html.menu-open .sheet{
  opacity:1;visibility:visible;pointer-events:auto;
  transition:opacity .46s var(--ease-sig),visibility 0s;
}
.sheet[hidden]{display:none!important}
.sheet-top{display:none}
/* the names sit in the middle of the screen, with room to breathe */
.sheet-links{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(14px,3.1vh,30px);text-align:center;width:100%;
}
.sheet-links button{
  background:none;border:none;cursor:pointer;text-align:center;
  padding:4px 8px;font-family:var(--display);
  font-size:clamp(27px,7.4vw,38px);font-weight:500;letter-spacing:-0.018em;line-height:1.06;
  color:var(--frost-white);transition:opacity .28s ease;
}
.sheet-links button:active{opacity:.55}
/* the page you are on keeps a small mark of its own */
.sheet-links button[aria-current="page"]::before{
  content:'';display:inline-block;vertical-align:middle;
  width:24px;height:2px;border-radius:2px;background:var(--signal-orange);
  margin-right:15px;transform:translateY(-3px);
}
.iconbtn{
  background:none;border:1px solid var(--graphite);color:var(--frost-white);cursor:pointer;
  width:40px;height:40px;border-radius:var(--r-pill);font-size:20px;line-height:1;
  display:flex;align-items:center;justify-content:center;
}

/* ---------- hero ---------- */
.hero{padding-block:clamp(28px,4vw,56px) var(--band)}
.hero-stage{
  position:relative;border-radius:var(--r-card-lg);overflow:hidden;background:var(--pure-black);
  aspect-ratio:16/9;max-width:100%;
}
@media (max-width:700px){.hero-stage{aspect-ratio:4/5}}
.hero-still{position:absolute;inset:0;background-size:cover;background-position:center}
.hero-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.1) 42%,rgba(0,0,0,.86) 100%)}
.hero-copy{position:absolute;left:0;right:0;bottom:0;padding:clamp(20px,3.4vw,var(--s48));display:flex;flex-direction:column;gap:var(--s20)}
.hero-actions{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s16)}
.hero-note{font-size:var(--t-body);color:var(--silver-mist);margin:0;max-width:44ch}
.hero-meta{display:flex;flex-wrap:wrap;gap:var(--s24);margin-top:var(--s28);border-top:1px solid var(--graphite);padding-top:var(--s24)}
.hero-meta div{display:flex;flex-direction:column;gap:2px}
.hero-meta b{font-family:var(--display);font-size:var(--t-h-sm);font-weight:600;letter-spacing:-0.015em;color:var(--frost-white)}

/* ---------- section headers ---------- */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s24);flex-wrap:wrap;margin-bottom:var(--s48)}
.sec-head .stack{display:flex;flex-direction:column;gap:var(--s12)}

/* ---------- work carousel ---------- */
.reel{position:relative;border-radius:var(--r-card);overflow:hidden;background:var(--carbon)}
.reel-frame{position:relative;width:100%;aspect-ratio:16/9;border:none;padding:0;background:none;cursor:pointer;display:block}
.reel-still{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .8s cubic-bezier(.16,.84,.34,1)}
.reel-frame:hover .reel-still{transform:scale(1.03)}
.reel-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2) 0%,transparent 38%,rgba(0,0,0,.8) 100%)}
.reel-cap{position:absolute;left:0;right:0;bottom:0;padding:clamp(18px,2.6vw,var(--s40));display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s20);flex-wrap:wrap;text-align:left}
.reel-count{position:absolute;top:var(--s24);right:var(--s28);font-size:var(--t-body);font-weight:600;color:var(--frost-white);letter-spacing:.02em}
.reel-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:var(--r-pill);
  border:1px solid var(--smoke);background:rgba(0,0,0,.55);backdrop-filter:blur(10px);color:var(--frost-white);
  cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:.2s}
.reel-nav:hover{background:rgba(0,0,0,.85);border-color:var(--silver-mist)}
.reel-prev{left:var(--s16)}
.reel-next{right:var(--s16)}
.reel-dots{display:flex;flex-wrap:wrap;gap:var(--s8);margin-top:var(--s20)}
.dot{background:none;border:none;cursor:pointer;padding:6px 12px;border-radius:var(--r-pill);
  font-size:var(--t-caption);font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--platinum);border:1px solid transparent;transition:.2s}
.dot:hover{color:var(--frost-white)}
.dot[aria-pressed="true"]{color:var(--frost-white);border-color:var(--smoke)}

/* ---------- awards ---------- */
.awards{display:flex;flex-wrap:wrap;gap:var(--s12) var(--s48);align-items:baseline}
.awards li{list-style:none;font-family:var(--display);font-size:var(--t-h);font-weight:600;letter-spacing:-0.015em;color:var(--obsidian)}
.awards-list{display:flex;flex-wrap:wrap;gap:var(--s16) var(--s40);margin:0;padding:0}
.award-year{font-family:var(--text);font-size:var(--t-xs);font-weight:600;color:var(--platinum);letter-spacing:-0.01em;margin-left:8px}

/* ---------- case studies (two-column, no cards) ---------- */
.case{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,var(--s76));align-items:center;padding-block:var(--band)}
.case:first-of-type{padding-top:var(--s60)}
.case + .case{border-top:1px solid var(--line-light)}
.case:nth-child(even) .case-media{order:2}
.case-media{position:relative;aspect-ratio:4/3;background:var(--pure-black);overflow:hidden;border:none;padding:0;cursor:pointer;display:block;width:100%}
.case-still{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .8s cubic-bezier(.16,.84,.34,1)}
.case-media:hover .case-still{transform:scale(1.04)}
.case-body{display:flex;flex-direction:column;gap:var(--s16);align-items:flex-start}
.metric{display:flex;flex-direction:column;gap:2px;margin-top:var(--s8)}
.metric b{font-family:var(--display);font-size:clamp(38px,5vw,56px);line-height:1;font-weight:600;letter-spacing:-0.015em;color:var(--obsidian);font-variant-numeric:tabular-nums}
@media (max-width:780px){
  .case{grid-template-columns:1fr;padding-block:var(--s60)}
  .case:nth-child(even) .case-media{order:0}
}

/* ---------- closing stage ---------- */
.closing{display:flex;flex-direction:column;align-items:flex-start;gap:var(--s24);max-width:900px}

/* ---------- portfolio ---------- */
.filters{display:flex;flex-wrap:wrap;gap:var(--s8);align-items:center}
.chip{
  background:none;border:1px solid var(--graphite);cursor:pointer;color:var(--platinum);
  padding:8px 16px;border-radius:var(--r-pill);font-size:var(--t-xs);font-weight:600;letter-spacing:-0.01em;transition:.2s;
}
.chip:hover{color:var(--frost-white);border-color:var(--smoke)}
.chip[aria-pressed="true"]{background:var(--frost-white);border-color:var(--frost-white);color:var(--pure-black)}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(20px,3vw,var(--s60)) clamp(16px,2.4vw,var(--s40))}
@media (max-width:700px){.gallery{grid-template-columns:1fr}}
.tile{background:none;border:none;padding:0;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:var(--s16)}
.tile-media{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;border-radius:var(--r-card);background:var(--carbon)}
.tile-still{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .8s cubic-bezier(.16,.84,.34,1)}
.tile:hover .tile-still{transform:scale(1.045)}
.tile-play{position:absolute;right:var(--s16);bottom:var(--s16);width:44px;height:44px;border-radius:var(--r-pill);
  background:rgba(0,0,0,.6);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;
  color:var(--frost-white);font-size:13px;opacity:0;transform:translateY(6px);transition:.28s ease}
.tile:hover .tile-play{opacity:1;transform:none}
.tile-foot{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s16)}
.tile-index{font-size:var(--t-xs);color:var(--smoke);font-variant-numeric:tabular-nums}

/* ---------- packages (rows, not cards) ---------- */
.pkg{
  display:grid;grid-template-columns:minmax(220px,1fr) minmax(240px,1.2fr) auto;
  gap:var(--s24) var(--s48);align-items:center;padding-block:var(--s40);border-top:1px solid var(--graphite);
}
.pkg:last-of-type{border-bottom:1px solid var(--graphite)}
.pkg-points{display:flex;flex-direction:column;gap:var(--s8);margin:0;padding:0}
.pkg-points li{list-style:none;font-size:var(--t-body);color:var(--platinum);display:flex;gap:var(--s12)}
.pkg-points li::before{content:"—";color:var(--smoke);flex:none}
.badge{
  display:inline-block;background:var(--graphite);color:var(--frost-white);border-radius:var(--r-pill);
  padding:4px 10px;font-size:var(--t-caption);font-weight:600;letter-spacing:.06em;text-transform:uppercase;
}
.price{font-family:var(--display);font-size:var(--t-h);font-weight:600;color:var(--frost-white);letter-spacing:-0.015em;font-variant-numeric:tabular-nums}
@media (max-width:820px){
  .pkg{grid-template-columns:1fr;align-items:flex-start}
  .pkg > *:last-child{justify-self:stretch}
  .pkg .btn{width:100%}
}

/* ---------- forms / request flow ---------- */
.form-col{max-width:720px;margin:0 auto;width:100%}
.progress{height:2px;background:var(--graphite);border-radius:2px;overflow:hidden;margin-top:var(--s16)}
.progress i{display:block;height:100%;background:var(--apple-blue);transition:width .45s cubic-bezier(.16,.84,.34,1)}
.opt{
  width:100%;display:flex;align-items:center;gap:var(--s16);text-align:left;cursor:pointer;
  background:var(--carbon);border:1px solid var(--graphite);border-radius:var(--r-btn);
  padding:16px 20px;transition:border-color .2s ease,background .2s ease;
}
.opt:hover{border-color:var(--smoke)}
.opt[aria-pressed="true"]{border-color:var(--apple-blue);background:rgba(0,113,227,.1)}
.opt .mark{flex:none;width:18px;height:18px;border-radius:var(--r-pill);border:1.5px solid var(--smoke);display:flex;align-items:center;justify-content:center}
.opt[aria-pressed="true"] .mark{border-color:var(--apple-blue);background:var(--apple-blue)}
.opt[aria-pressed="true"] .mark::after{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
.opt .label{display:flex;flex-direction:column;gap:2px}
.opt .label b{font-weight:600;font-size:var(--t-lg);letter-spacing:-0.011em}
.opt-grid{display:flex;flex-direction:column;gap:var(--s12)}
.tagwrap{display:flex;flex-wrap:wrap;gap:var(--s8)}
.tag{
  background:var(--carbon);border:1px solid var(--graphite);border-radius:var(--r-pill);cursor:pointer;
  padding:10px 18px;font-size:var(--t-body);color:var(--frost-white);transition:.2s;
}
.tag:hover{border-color:var(--smoke)}
.tag[aria-pressed="true"]{background:var(--apple-blue);border-color:var(--apple-blue);color:#fff;font-weight:600}
.field{display:flex;flex-direction:column;gap:var(--s8);width:100%}
.field > span{font-size:var(--t-xs);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--platinum)}
.input{
  width:100%;background:var(--carbon);border:1px solid var(--graphite);border-radius:var(--r-btn);
  padding:15px 20px;color:var(--frost-white);font-size:var(--t-lg);letter-spacing:-0.011em;transition:border-color .2s;
}
textarea.input{border-radius:var(--r-card);line-height:1.47}
.input:focus{outline:none;border-color:var(--apple-blue)}
.input:focus-visible{outline:none}
.stepnav{display:flex;align-items:center;justify-content:space-between;gap:var(--s16);margin-top:var(--s40);border-top:1px solid var(--graphite);padding-top:var(--s24)}
.review{display:flex;flex-direction:column}
.review-row{
  display:flex;align-items:center;justify-content:space-between;gap:var(--s20);width:100%;text-align:left;
  background:none;border:none;border-bottom:1px solid var(--graphite);cursor:pointer;padding:var(--s16) 0;color:inherit;
}
.review-row:hover .edit{color:var(--halo-blue)}
.review-row .edit{font-size:var(--t-xs);font-weight:600;color:var(--platinum);letter-spacing:.04em;text-transform:uppercase;flex:none}
.review-row .rv{display:flex;flex-direction:column;gap:2px;min-width:0}
.review-row .rv b{font-size:var(--t-body);font-weight:400;color:var(--platinum)}
.review-row .rv span{font-size:var(--t-lg);color:var(--frost-white);letter-spacing:-0.011em;overflow-wrap:anywhere}
.centered{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--s20);max-width:560px;margin:0 auto}
.refbox{display:flex;flex-direction:column;gap:var(--s4);align-items:center;background:var(--carbon);border-radius:var(--r-card);padding:var(--s24) var(--s40)}
.refbox b{font-family:var(--display);font-size:var(--t-h-lg);font-weight:700;letter-spacing:.04em;color:var(--frost-white);font-variant-numeric:tabular-nums}
.notice{background:var(--carbon);border-radius:var(--r-card);padding:var(--s28);display:flex;flex-direction:column;gap:var(--s8)}

/* ---------- track ---------- */
.job{border-top:1px solid var(--graphite);padding-block:var(--s28);display:flex;flex-direction:column;gap:var(--s20)}
.job:last-child{border-bottom:1px solid var(--graphite)}
.job-top{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s16);flex-wrap:wrap}
.status{display:inline-flex;align-items:center;gap:8px;font-size:var(--t-xs);font-weight:600;letter-spacing:-0.01em;
  border-radius:var(--r-pill);padding:6px 12px;background:var(--graphite);color:var(--frost-white)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--halo-blue);display:block}
.status[data-done="1"] i{background:var(--reef-teal)}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s12)}
.stage-step{display:flex;flex-direction:column;gap:var(--s8)}
.stage-step .rail{height:2px;background:var(--graphite);border-radius:2px}
.stage-step[data-on="1"] .rail{background:var(--apple-blue)}
.stage-step span{font-size:var(--t-xs);color:var(--platinum)}
.stage-step[data-on="1"] span{color:var(--frost-white)}
@media (max-width:620px){.stages{grid-template-columns:repeat(2,1fr)}}

/* ---------- slots ---------- */
.slots{display:flex;flex-wrap:wrap;gap:var(--s8)}
.slot{background:var(--carbon);border:1px solid var(--graphite);border-radius:var(--r-pill);cursor:pointer;
  padding:12px 20px;font-size:var(--t-body);color:var(--frost-white);transition:.2s;font-variant-numeric:tabular-nums}
.slot:hover{border-color:var(--smoke)}
.slot[aria-pressed="true"]{background:var(--apple-blue);border-color:var(--apple-blue);font-weight:600}

/* ---------- footer ---------- */
.footer{background:var(--obsidian);padding-block:var(--band) var(--s40);margin-top:0}
.footer-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:clamp(28px,4vw,var(--s76))}
@media (max-width:900px){.footer-grid{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.footer-grid{grid-template-columns:1fr}}
.fcol{display:flex;flex-direction:column;gap:var(--s16);align-items:flex-start}
.fcol h4{font-size:var(--t-xs);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--platinum);font-family:var(--text)}
.fcol a,.fcol button{font-size:var(--t-body);color:var(--frost-white);background:none;border:none;padding:0;cursor:pointer;text-align:left;text-decoration:none}
.fcol a:hover,.fcol button:hover{color:var(--halo-blue);text-decoration:none}
.fstack{display:flex;flex-direction:column;gap:var(--s12);align-items:flex-start}
.footer-base{display:flex;justify-content:space-between;gap:var(--s16);flex-wrap:wrap;
  border-top:1px solid var(--graphite);margin-top:var(--band);padding-top:var(--s24)}

/* ---------- lightbox ---------- */
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;padding:var(--gutter)}
.lightbox[hidden]{display:none!important}
.lb-inner{width:min(1100px,100%);display:flex;flex-direction:column;gap:var(--s20)}
.lb-media{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--r-card);overflow:hidden;background:var(--carbon)}
.lb-media iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
.lb-still{position:absolute;inset:0;background-size:cover;background-position:center}
/* real photographs show whole in the lightbox — no crop on the big view */
.lb-still.fit{background-size:contain;background-repeat:no-repeat;background-color:#000}
.lb-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s20);flex-wrap:wrap}
.lb-close{position:fixed;top:var(--s20);right:var(--s20);z-index:101}

/* reveal — resting state is visible */
.rise{animation:rise .8s cubic-bezier(.22,.61,.36,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ---------- account / Google sign-in ---------- */
.acct-chip{
  display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap;
  background:none;border:1px solid var(--graphite);border-radius:var(--r-pill);
  padding:4px 12px 4px 4px;color:var(--frost-white);
  font-size:var(--t-xs);letter-spacing:-0.01em;transition:background .2s ease,border-color .2s ease;
}
.acct-chip:hover{background:var(--graphite)}
.acct-chip[aria-current="page"]{background:var(--graphite);border-color:var(--silver-mist)}
.avatar{
  width:26px;height:26px;border-radius:50%;flex:0 0 auto;object-fit:cover;
  background:var(--graphite);display:grid;place-items:center;
  font-size:var(--t-caption);font-weight:600;color:var(--frost-white);overflow:hidden;
}
.avatar.lg{width:64px;height:64px;font-size:var(--t-lg)}
.sheet-acct{
  display:flex;align-items:center;justify-content:center;gap:var(--s12);
  padding:0 0 var(--s8);margin-bottom:var(--s8);text-align:left;
}
.acct-head{display:flex;align-items:center;gap:var(--s20);margin-top:var(--s40);flex-wrap:wrap}
.acct-head .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.acct-head .who strong{font-family:var(--display);font-size:var(--t-h-sm);font-weight:600;color:var(--frost-white)}
.acct-head .who span{font-size:var(--t-xs);color:var(--platinum);overflow-wrap:anywhere}
.btn-line{
  background:none;border:1px solid var(--graphite);color:var(--frost-white);
  border-radius:var(--r-pill);padding:10px 20px;cursor:pointer;
  font-size:var(--t-xs);transition:background .2s ease;
}
.btn-line:hover{background:var(--graphite)}
.btn-line:disabled{opacity:.4;cursor:default}
.gsi-slot{min-height:44px;display:flex;justify-content:flex-start;color-scheme:light}
.or-rule{display:flex;align-items:center;gap:var(--s12);color:var(--platinum);font-size:var(--t-caption);
  letter-spacing:.06em;text-transform:uppercase}
.or-rule::before,.or-rule::after{content:'';flex:1;height:1px;background:var(--graphite)}
.setup-note{
  background:var(--carbon);border:1px dashed var(--smoke);border-radius:var(--r-card);
  padding:var(--s20);display:flex;flex-direction:column;gap:var(--s8);
}
.setup-note code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--t-caption);color:var(--halo-blue)}

/* ---------- brief cards, studio controls ---------- */
.job-head{
  display:flex;align-items:center;justify-content:space-between;gap:var(--s16);
  width:100%;background:none;border:none;cursor:pointer;padding:0;color:inherit;text-align:left;
}
.job-head:hover .h-md{color:var(--paper-white)}
.sub{display:flex;flex-direction:column;gap:var(--s8);padding-top:var(--s20);border-top:1px solid var(--graphite)}
.sub .kicker{color:var(--platinum)}
.kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--s12) var(--s20);margin-top:var(--s8)}
.kv{display:flex;flex-direction:column;gap:2px;min-width:0}
.kv span{font-size:var(--t-caption);letter-spacing:.06em;text-transform:uppercase;color:var(--platinum)}
.kv b{font-size:var(--t-xs);font-weight:400;color:var(--frost-white);overflow-wrap:anywhere}
.filelist{display:flex;flex-wrap:wrap;gap:var(--s8);margin-top:var(--s8)}
.filechip{
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  background:var(--carbon);border:1px solid var(--graphite);border-radius:var(--r-pill);
  padding:8px 16px;color:var(--frost-white);font-size:var(--t-xs);transition:border-color .2s ease;
}
.filechip:hover{border-color:var(--silver-mist)}
.filechip span{color:var(--platinum);font-size:var(--t-caption)}
.timeline{list-style:none;margin:var(--s12) 0 0;padding:0;display:flex;flex-direction:column;gap:var(--s16)}
.timeline li{display:flex;gap:var(--s12);align-items:flex-start}
.timeline .dot{width:7px;height:7px;border-radius:50%;background:var(--apple-blue);margin-top:7px;flex:0 0 auto}
.timeline li:not(:first-child) .dot{background:var(--smoke)}
.timeline p{margin:0;font-size:var(--t-xs);color:var(--frost-white);line-height:1.5}

/* ============================================================
   MOTION — reveal on scroll, parallax stills, a cursor of its own.
   Everything here is decoration: the page works with all of it
   switched off, and it is switched off for anyone who has asked
   their system for less motion.
   ============================================================ */

/* ---------- sections arriving ---------- */
[data-reveal]{
  opacity:0;
  transform:translate3d(0,20px,0);
  transition:opacity .9s cubic-bezier(.16,.84,.34,1),
             transform .9s cubic-bezier(.16,.84,.34,1);
  transition-delay:var(--rd,0ms);
  will-change:opacity,transform;
}
[data-reveal].in{opacity:1;transform:none}

/* ---------- a screen arriving ---------- */
@keyframes pageIn{
  from{opacity:0;transform:translate3d(0,12px,0)}
  to{opacity:1;transform:none}
}
.page-in{animation:pageIn .42s cubic-bezier(.16,.84,.34,1) both}

/* ---------- the hero, on first paint ---------- */
@keyframes heroIn{
  from{opacity:0;transform:translate3d(0,16px,0)}
  to{opacity:1;transform:none}
}
.hero-copy > *{animation:heroIn .9s cubic-bezier(.16,.84,.34,1) both}
.hero-copy > *:nth-child(1){animation-delay:.10s}
.hero-copy > *:nth-child(2){animation-delay:.18s}
.hero-copy > *:nth-child(3){animation-delay:.28s}
.hero-copy > *:nth-child(4){animation-delay:.36s}
@keyframes stillIn{from{opacity:0}to{opacity:1}}
.hero-still,.reel-still{animation:stillIn .5s ease both}

/* ---------- stills drifting against the scroll ----------
   Each still is taller than the frame that crops it, so it can
   travel without ever showing an edge. The hover scale lives in
   its own variable so the two never fight over `transform`.   */
.hero-still,.hero-plate,.man-still,.reel-still,.case-still,.tile-still{
  top:-9%;bottom:-9%;
  transform:translate3d(0,var(--py,0px),0) scale(var(--ts,1));
  transition:transform .45s cubic-bezier(.16,.84,.34,1);
  will-change:transform;
}
.reel-frame:hover .reel-still{--ts:1.03;transform:translate3d(0,var(--py,0px),0) scale(var(--ts,1))}
.case-media:hover .case-still{--ts:1.04;transform:translate3d(0,var(--py,0px),0) scale(var(--ts,1))}
.tile:hover .tile-still{--ts:1.045;transform:translate3d(0,var(--py,0px),0) scale(var(--ts,1))}

/* ---------- the cursor ----------
   A pointer cast in glass. The arrow is a real piece of material: the
   backdrop is bent and lifted inside it, the wall between the outer
   edge and the inner edge catches the light the way a thick bevel
   does, and the rim splits that light into a little blue and violet
   where it leaves the glass. The tip sits exactly on the pointer, so
   nothing about the aim changes; everything that moves — the tilt
   into the direction of travel, the swell over a link, the squash on
   a press — happens around that one fixed point.                   */
.cur-arrow,.cur-cap{
  position:fixed;top:0;left:0;z-index:900;pointer-events:none;opacity:0;
  will-change:transform;
}
.cur-arrow{width:40px;height:52px;transform-origin:4px 3px}
html.cur-on .cur-arrow,html.cur-on .cur-cap{opacity:1}
html.cur-on,html.cur-on body{cursor:none}
html.cur-on a,html.cur-on button,html.cur-on .chip,html.cur-on .tag,html.cur-on .dot,
html.cur-on label,html.cur-on summary{cursor:none}
html.cur-on input,html.cur-on textarea,html.cur-on select{cursor:auto}

/* the piece itself — scaled about its tip, so the point never moves */
.cur-in{
  position:absolute;inset:0;transform-origin:4px 3px;
  transform:scale(var(--cs,.74));
  transition:transform .42s cubic-bezier(.22,1.2,.36,1);
}
.cur-shadow,.cur-body,.cur-art{position:absolute;inset:0;pointer-events:none}

/* the body — whatever is behind, seen through the glass */
.cur-body{
  -webkit-clip-path:url(#curArrowClip);clip-path:url(#curArrowClip);
  background:linear-gradient(138deg,
    rgba(255,255,255,.30) 0%, rgba(255,255,255,.07) 26%,
    rgba(255,255,255,.02) 54%, rgba(255,255,255,.17) 100%);
  backdrop-filter:blur(.7px) saturate(205%) brightness(1.15) contrast(1.06);
  -webkit-backdrop-filter:blur(.7px) saturate(205%) brightness(1.15) contrast(1.06);
  transition:backdrop-filter .35s ease,-webkit-backdrop-filter .35s ease,background .35s ease;
}

/* over a text field the caret does the job on its own */
html.cur-text .cur-arrow,html.cur-text .cur-cap{opacity:0!important}

/* over anything clickable the glass thickens and opens up */
html.cur-link .cur-in{--cs:.88}
html.cur-link .cur-body{
  backdrop-filter:blur(1.5px) saturate(230%) brightness(1.22) contrast(1.08);
  -webkit-backdrop-filter:blur(1.5px) saturate(230%) brightness(1.22) contrast(1.08);
}
html.cur-media .cur-in{--cs:.80}

/* pressed — the piece is pushed into the page and springs back */
html.cur-down .cur-in{--cs:.62}
html.cur-down .cur-body{background:linear-gradient(138deg,
  rgba(255,255,255,.42) 0%, rgba(255,255,255,.14) 30%,
  rgba(255,255,255,.08) 56%, rgba(255,255,255,.26) 100%)}

/* the word the pointer carries over a film or a photograph */
.cur-cap{width:0;height:0}
.cur-label{
  position:absolute;left:26px;top:22px;
  font-size:var(--t-caption);font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:#fff;white-space:nowrap;
  padding:7px 14px;border-radius:var(--r-pill);
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(10px) saturate(180%);
  -webkit-backdrop-filter:blur(10px) saturate(180%);
  box-shadow:0 6px 20px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.3);
  opacity:0;transform:scale(.88) translateY(4px);transform-origin:0 0;
  transition:opacity .3s ease,transform .42s cubic-bezier(.22,1.2,.36,1);
}
html.cur-media .cur-label{opacity:1;transform:scale(1) translateY(0)}

/* no backdrop to filter, no glass — fall back to something visible */
@supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){
  .cur-body{background:rgba(245,245,247,.26)}
}

@media (hover:none),(pointer:coarse){
  .cur-arrow,.cur-cap{display:none}
}

/* ---------- the pill that follows the pointer across the nav ---------- */
.navlinks{position:relative}
.navlink{position:relative;z-index:1}
.nav-pill{
  position:absolute;top:0;left:0;width:0;height:0;z-index:0;opacity:0;
  border-radius:var(--r-pill);background:rgba(245,245,247,.12);pointer-events:none;
  transition:transform .42s cubic-bezier(.16,.84,.34,1),
             width .42s cubic-bezier(.16,.84,.34,1),
             height .42s cubic-bezier(.16,.84,.34,1),
             opacity .28s ease;
}
.nav-pill.no-anim{transition:none}

/* ---------- and none of it for anyone who asked for less ---------- */
@media (prefers-reduced-motion:reduce){
  .nav-pill{transition:none}
  [data-reveal]{opacity:1;transform:none;transition:none}
  .page-in{animation:none}
  .hero-copy > *{animation:none}
  .hero-still,.reel-still{animation:none}
  .hero-still,.reel-still,.case-still,.tile-still{top:0;bottom:0;transform:none}
  .cur-arrow,.cur-cap{display:none}
  html.cur-on,html.cur-on body{cursor:auto}
}

/* ============================================================
   SIGNATURE MOTION
   One ease, one set of timings, applied to everything: text that
   rises out of its own line, media that opens from the middle,
   labels that roll over on the way past, a curtain between one
   screen and the next, and the mark drawing itself before any of
   it arrives. The curve is a long glide out of a heavy start —
   the whole reason the page feels weighted rather than springy.
   All of it is decoration; the page is complete without any of
   it, and none of it runs for anyone who asked for less motion.
   ============================================================ */
:root{
  --ease-sig:cubic-bezier(.625,.05,0,1);   /* the signature curve */
  --d-text:.55s;                           /* words arriving      */
  --d-media:.62s;                          /* a frame opening     */
  --d-roll:.3s;                            /* a label rolling     */
}

/* the text as it really reads, for anything that isn't looking */
.sp-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
html.sig [data-reveal].now{transition:none}

/* ---------- text: lines that hold their words below the floor ---------- */
.sp-line{
  display:block;overflow:clip;
  margin-bottom:-.16em;padding-bottom:.16em;   /* keeps descenders whole */
}
.sp-c{
  display:inline-block;white-space:pre;
  transform:translate3d(0,110%,0);
  transition:transform var(--d-text) var(--ease-sig);
  transition-delay:var(--cd,0ms);
  will-change:transform;
}
.sp-on .sp-c{transform:none}
.sp-f{
  display:block;opacity:0;
  transition:opacity var(--d-text) var(--ease-sig);
  transition-delay:var(--cd,0ms);
}
.sp-on .sp-f{opacity:1}
.sp-now .sp-c,.sp-now .sp-f{transform:none;opacity:1;transition:none}

/* ---------- media: a frame opening from its own middle ---------- */
[data-mrev]{
  clip-path:inset(20% round var(--mr,0px));
  transition:clip-path var(--d-media) var(--ease-sig);
  will-change:clip-path;
}
[data-mrev].in{clip-path:inset(0% round var(--mr,0px))}
[data-mrev].now{transition:none}

/* ---------- blocks arriving, on the signature curve ---------- */
html.sig [data-reveal]{
  transform:translate3d(0,24px,0) scale(.985);
  transition:opacity var(--d-text) var(--ease-sig),
             transform var(--d-text) var(--ease-sig);
}
html.sig [data-reveal].in{transform:none}
html.sig .hero-copy > *{animation:none}      /* the split handles these now */

/* ---------- labels that roll over ----------
   Two copies of the same word stacked in a clipped box: the top one
   leaves upward, the one waiting below takes its place, letter after
   letter. */
.btn.bm{overflow:hidden}
.bm-lab{
  position:relative;display:inline-block;overflow:clip;
  line-height:1.34;vertical-align:middle;   /* room for descenders inside the clip */
}
.bm-b{position:absolute;left:0;top:0}
.bm-c{
  display:inline-block;white-space:pre;
  transition:transform var(--d-roll) var(--ease-sig);
  transition-delay:var(--bd,0ms);
  will-change:transform;
}
.bm-b .bm-c{transform:translate3d(0,110%,0)}
.btn.bm:hover .bm-a .bm-c,
.btn.bm:focus-visible .bm-a .bm-c,
.reel-frame:hover .bm-a .bm-c,
.tile:hover .bm-a .bm-c{transform:translate3d(0,-110%,0)}
.btn.bm:hover .bm-b .bm-c,
.btn.bm:focus-visible .bm-b .bm-c,
.reel-frame:hover .bm-b .bm-c,
.tile:hover .bm-b .bm-c{transform:none}

/* ---------- buttons opening from their own centre ---------- */
[data-bwipe]{
  clip-path:inset(0 50%);
  transition:clip-path .44s var(--ease-sig);
  transition-delay:var(--cd,0ms);
}
[data-bwipe].in{clip-path:inset(0 0%)}
[data-bwipe].now{transition:none}

/* ---------- numbers that roll up to their value ---------- */
.od,.od-s{
  display:inline-block;overflow:hidden;
  height:1.2em;line-height:1.2;vertical-align:bottom;
}
.od-r{
  display:block;transform:translate3d(0,0,0);
  transition:transform var(--d-media) var(--ease-sig);
  transition-delay:var(--cd,0ms);
  will-change:transform;
}
.od-d{display:block;height:1.2em;line-height:1.2}
.od-now .od-r{transition:none}

/* ---------- the curtain between one screen and the next ----------
   A single panel that sweeps down over the page, lets the new screen
   build underneath it, then keeps going the same way and leaves. */
.curtain{
  position:fixed;inset:0;z-index:950;background:var(--pure-black);
  display:grid;place-items:center;pointer-events:none;
  clip-path:inset(0 0 100% 0);
  transition:clip-path .34s var(--ease-sig);
  will-change:clip-path;
}
.curtain.cover{clip-path:inset(0 0 0 0);pointer-events:auto}
.curtain.lift{clip-path:inset(100% 0 0 0);transition-duration:.42s}
.curtain.snap{transition:none}
.curtain-mark{
  opacity:0;transform:translate3d(0,10px,0) scale(.96);
  transition:opacity .3s ease,transform .5s var(--ease-sig);
}
.curtain.cover .curtain-mark{opacity:1;transform:none;transition-delay:.14s}

/* ---------- the mark, before any of it ----------
   The logo wipes in from the left, a rule draws itself underneath,
   a count runs up beside it, and then the whole panel leaves the
   same way the curtain does. */
.intro{
  position:fixed;inset:0;z-index:1000;background:var(--pure-black);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:var(--s24);padding:var(--gutter);
  clip-path:inset(0 0 0 0);
  transition:clip-path .52s var(--ease-sig);
  /* if the script never runs, the panel takes itself away */
  animation:introFailsafe 0s linear 6s forwards;
}
@keyframes introFailsafe{to{opacity:0;visibility:hidden;pointer-events:none}}
.intro-mark{
  clip-path:inset(0 100% 0 0);
  transition:clip-path .7s var(--ease-sig),opacity .38s ease,transform .45s var(--ease-sig);
  will-change:clip-path;
}
.intro-rule{
  width:min(240px,44vw);height:1px;background:var(--graphite);position:relative;overflow:hidden;
}
.intro-rule i{
  position:absolute;inset:0;background:var(--frost-white);
  transform:scaleX(0);transform-origin:0 50%;
  transition:transform .85s var(--ease-sig);
}
.intro-num{
  font-family:var(--display);font-size:var(--t-xs);font-weight:600;
  letter-spacing:.16em;color:var(--platinum);font-variant-numeric:tabular-nums;
  transition:opacity .4s ease;
}
.intro.go .intro-mark{clip-path:inset(0 0% 0 0)}
.intro.go .intro-rule i{transform:scaleX(1)}
.intro.out .intro-mark{opacity:0;transform:translate3d(0,-18px,0)}
.intro.out .intro-num{opacity:0}
.intro.out{clip-path:inset(100% 0 0 0)}
html.sig-boot,html.sig-boot body{overflow:hidden}

/* ---------- the menu, one line after another ---------- */
@keyframes sheetIn{from{opacity:0;transform:translate3d(0,18px,0)}to{opacity:1;transform:none}}
html.menu-open .sheet-links button,
html.menu-open .sheet-acct,
html.menu-open .sheet-foot{animation:sheetIn .62s var(--ease-sig) both}
html.menu-open .sheet-links button:nth-child(1){animation-delay:.10s}
html.menu-open .sheet-links button:nth-child(2){animation-delay:.16s}
html.menu-open .sheet-links button:nth-child(3){animation-delay:.22s}
html.menu-open .sheet-links button:nth-child(4){animation-delay:.28s}
html.menu-open .sheet-links button:nth-child(5){animation-delay:.34s}
html.menu-open .sheet-links button:nth-child(6){animation-delay:.40s}
html.menu-open .sheet-links button:nth-child(n+7){animation-delay:.46s}
html.menu-open .sheet-foot{animation-delay:.44s}

/* while it is open the bar keeps only its two marks, and nothing scrolls behind */
html.menu-open,html.menu-open body{overflow:hidden}
html.menu-open .navwrap{z-index:95}
html.menu-open .navwrap::after{opacity:0}
html.menu-open .nav,
html.menu-open.nav-lift .nav,
html.menu-open.nav-light .nav,
html.menu-open.nav-lift.nav-light .nav{
  background:transparent;border-color:transparent;box-shadow:none;
  backdrop-filter:none;-webkit-backdrop-filter:none;
}
html.menu-open .nav .brand-name,html.menu-open .nav .brand svg rect,
html.menu-open .nav .burger{color:var(--frost-white)}
html.menu-open .nav .brand svg rect{fill:var(--frost-white)}
html.menu-open .nav .brand-name{color:var(--frost-white)}


/* ============================================================
   ON A PHONE
   The design doesn't change here — the size of the things you
   have to hit with a thumb does. Nothing you can tap is under
   44px, the top bar carries only the name and the way in, and
   the long rows of small controls become one thing you swipe.
   ============================================================ */

/* a tap should never wait to see whether a second one is coming */
button,a,.chip,.tag,.dot,.slot,.opt,.filechip,.review-row,.job-head{touch-action:manipulation}

/* a space inside a rolling number is still a space */
.od-s{white-space:pre}

@media (max-width:1000px){
  /* language and the call to action both move into the menu, so the
     bar stops competing with itself for room */
  .nav > div:last-child .langbox,
  .nav > div:last-child > .btn{display:none}
  .nav{padding:6px 10px 6px 16px;gap:var(--s12)}
  .brand-name{white-space:nowrap}
  .burger{width:44px;height:44px;padding:0;align-items:center;justify-content:center}
  .burger span{width:22px}
  .navwrap{padding-top:max(var(--s12),env(safe-area-inset-top))}
  .wrap{padding-inline:max(var(--gutter),env(safe-area-inset-left),env(safe-area-inset-right))}
  .sheet-foot{display:flex;flex-direction:column;align-items:center;gap:var(--s16);margin-top:var(--s24)}
  .sheet-foot .btn-cta{font-weight:500}
  .sheet-foot .btn{min-width:230px}
  .footer{padding-bottom:max(var(--s40),calc(env(safe-area-inset-bottom) + 16px))}
  .sheet-lang{display:flex;justify-content:center;margin-bottom:0}
}

/* ---------- anything a thumb has to land on ---------- */
@media (max-width:820px),(pointer:coarse){
  .btn{min-height:48px;padding:13px 22px}
  .btn-lg{min-height:54px;padding:16px 26px}
  .btn-line{min-height:48px;padding:13px 22px;font-size:var(--t-body)}
  .iconbtn{width:48px;height:48px;font-size:24px}
  .chip{min-height:44px;padding:11px 18px;font-size:var(--t-body)}
  .dot{min-height:44px;padding:12px 16px;font-size:var(--t-xs)}
  .tag{min-height:46px;padding:12px 20px}
  .slot{min-height:48px;padding:13px 20px;font-size:var(--t-lg)}
  .filechip{min-height:44px;padding:11px 18px;font-size:var(--t-body)}
  .langbtn{min-height:40px;min-width:52px;padding:10px 14px;font-size:var(--t-xs)}
  .opt{padding:18px 20px}
  .opt .mark{width:22px;height:22px}
  .reel-nav{width:48px;height:48px}
  .lb-close{width:48px;height:48px}
  .linky{min-height:46px;display:inline-flex;align-items:center;gap:6px}
  .fcol a,.fcol button:not(.btn){min-height:44px;display:inline-flex;align-items:center}
  .brand{min-height:44px;padding:6px 0}
  .review-row{padding:var(--s20) 0}
  .acct-chip{min-height:44px}
  .stepnav .btn{flex:1 1 auto}
}

/* ---------- the calls to action take the full width ---------- */
@media (max-width:560px){
  /* the frame grows with the words instead of cropping them */
  .hero-stage{aspect-ratio:auto;min-height:calc(100svh - 150px)}
  .notice > div > .btn,
  .closing > div > .btn{width:100%}
  .hero-actions{flex-direction:column;align-items:stretch;gap:var(--s12)}
  .hero-actions .btn{width:100%}
  .closing > div{width:100%}
  .closing > div > .btn{flex:1 1 100%}
  .centered .btn{width:100%}
  .form-col .stepnav{gap:var(--s12)}
}

@media (max-width:430px){
  :root{--t-hero:clamp(34px,8.6vw,80px);--t-display:clamp(28px,7.4vw,56px)}
}

/* ---------- one long row of small controls becomes a swipe ---------- */
@media (max-width:700px){
  .reel-dots{
    flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;
    -webkit-overflow-scrolling:touch;
    margin-inline:calc(var(--gutter) * -1);padding-inline:var(--gutter);
    scrollbar-width:none;
  }
  .reel-dots::-webkit-scrollbar{display:none}
  .dot{flex:none}

  /* the reel gets a taller frame and a caption that stops fighting
     itself for the width */
  .reel-frame{aspect-ratio:4/3}
  .reel-cap{flex-direction:column;align-items:flex-start;gap:var(--s16)}
  .reel-cap > span:first-child{width:100%}
  .reel-cap .btn{width:100%}
  /* the count takes one corner, the arrows the other, and the middle
     of the frame is left to the film — a flick moves it anyway */
  .reel-count{top:var(--s16);left:var(--s16);right:auto}
  .reel-nav{top:var(--s12);transform:none;width:44px;height:44px}
  .reel-prev{left:auto;right:calc(var(--s12) + 52px)}
  .reel-next{right:var(--s12)}
  .slots{gap:var(--s8)}
  .filters{gap:var(--s8)}
}


/* ============================================================
   SECOND MOVEMENT
   A reference reel came in with five things worth taking, and
   this is all five, translated into the studio's own material:
   a frame that arrives in two halves and meets in the middle,
   sections that stop and let the next one climb over them, a
   word that turns over on a fixed line, numbers that roll up
   behind a rule drawing itself across, a hand of frames that
   opens out of a single stack, and one long line of type that
   never stops moving. One curve for all of it — the signature
   one — and none of it for anyone who asked for less motion.
   ============================================================ */

/* ---------- type that hands the sentence over halfway ----------
   The first half carries the weight; the rest of the line steps
   back a tone. Both halves are the same size and the same face,
   so it reads as one sentence, not two.                        */
.sp-dim,.dim{color:var(--platinum)}
.light .sp-dim,.light .dim,.frost .sp-dim,.frost .dim{color:var(--silver-mist)}

/* ---------- a frame that arrives in two halves ----------
   Each half carries the whole photograph and shows only its own
   side of it, so when the two meet there is no seam: what lands
   is one picture, not two pressed together.                    */
.hero-half{position:absolute;inset:0;overflow:hidden;will-change:transform}
.hero-half.hh-l{-webkit-clip-path:inset(0 50% 0 0);clip-path:inset(0 50% 0 0)}
.hero-half.hh-r{-webkit-clip-path:inset(0 0 0 50%);clip-path:inset(0 0 0 50%)}
html.sig .hero-half{
  transform:translate3d(var(--hx,0),0,0);
  transition:transform 1.15s var(--ease-sig);
}
html.sig .hh-l{--hx:-26%}
html.sig .hh-r{--hx:26%}
html.sig .hero-half.in{--hx:0%}
.hero-plate{position:absolute;left:0;right:0;background-size:cover;background-position:center}

/* ---------- sections that stop and are climbed over ----------
   Every band on the home screen pins itself once it has been
   read, and the next one comes up over it with its own top
   corners and its own shadow, and the one underneath takes a
   shade so the eye knows which of the two is on top. `top` is
   set from script: a band taller than the screen scrolls all
   the way through before it pins.

   Three things here are deliberate and should stay that way:

   - Nothing is scaled. A band scaled down no longer fills its
     own box, and the sliver it gives up shows whatever is
     behind it — which is what a seam and a flickering edge
     between two bands actually are.
   - The shade is a real element, not a custom property read by
     `::after`. A custom property set on a band inherits into
     everything inside it, so writing one on every scroll frame
     asks the browser to recalculate the whole subtree each
     time. An element with its own opacity touches one node.
   - Each band overlaps the one before it by a pixel. At a
     fractional scroll offset or a fractional device pixel
     ratio, a pinned band and the band climbing over it round
     to different pixels, and a hairline of whatever is behind
     shows through between them — a one-pixel slice of another
     part of the page, blinking on and off as the offset moves.
     Two pixels of overlap close it at any ratio; the covering
     band is opaque and paints last, so nothing is lost.      */
#app{background:var(--pure-black)}
#app.stacked > section{position:sticky;top:0}
.sec-cov{
  position:absolute;inset:0;z-index:5;pointer-events:none;
  border-radius:inherit;
  background:var(--pure-black);opacity:0;
}
#app.stacked > section + section{
  margin-top:-2px;
  border-top-left-radius:var(--r-card-lg);
  border-top-right-radius:var(--r-card-lg);
  box-shadow:0 -24px 52px rgba(0,0,0,.55);
}

/* ---------- a word that turns over on a fixed line ----------
   One clipped line with the whole list stacked inside it. The
   first word is repeated at the bottom, so the roll from the
   last back to the first goes the same way as all the others
   and the return is never seen.                              */
.cyc{
  display:inline-block;overflow:hidden;vertical-align:bottom;
  height:var(--ch,1.16em);line-height:var(--ch,1.16em);
}
.cyc-r{display:block;transition:transform .66s var(--ease-sig);will-change:transform}
.cyc-d{display:block;height:var(--ch,1.16em);line-height:var(--ch,1.16em);white-space:nowrap}

/* ---------- the band that goes to the edges ---------- */
.manifesto{
  position:relative;overflow:hidden;background:var(--pure-black);
  min-height:min(84vh,760px);display:flex;flex-direction:column;justify-content:center;
  padding-block:var(--band);
}
.man-still{position:absolute;left:0;right:0;background-size:cover;background-position:center;opacity:.42}
.man-scrim{
  position:absolute;inset:0;
  background:radial-gradient(120% 78% at 50% 50%,rgba(0,0,0,.18) 0%,rgba(0,0,0,.72) 62%,rgba(0,0,0,.94) 100%);
}
.man-word{
  position:relative;text-align:center;margin:0;
  font-family:var(--display);font-weight:500;
  font-size:clamp(24px,5.6vw,68px);line-height:1.16;
  letter-spacing:.2em;text-transform:uppercase;color:var(--frost-white);
  text-indent:.2em;   /* the tracking would otherwise push it off centre */
}
.man-foot{
  position:absolute;left:0;right:0;bottom:clamp(26px,4.6vw,64px);
  display:flex;justify-content:flex-end;
}
.man-foot > div{display:flex;flex-direction:column;gap:var(--s8);max-width:44ch}
.man-foot p:not(.eyebrow){margin:0;font-size:var(--t-body);color:var(--silver-mist);line-height:1.6}
@media (max-width:700px){
  .man-foot{justify-content:flex-start}
  .man-word{letter-spacing:.12em;text-indent:.12em}
}

/* ---------- numbers under a rule that draws itself ---------- */
.ledger{display:flex;flex-direction:column;margin-top:clamp(28px,4vw,52px)}
.led{
  position:relative;display:grid;gap:var(--s12) var(--s24);
  grid-template-columns:minmax(0,1fr) auto;align-items:center;
  padding-block:clamp(22px,3.2vw,40px);
}
.led-rule{
  position:absolute;left:0;right:0;top:0;height:1px;background:var(--graphite);
  transform:scaleX(0);transform-origin:0 50%;
  transition:transform 1.05s var(--ease-sig);
  transition-delay:var(--rd,0ms);
}
.led[data-reveal].in .led-rule,.led.in .led-rule{transform:scaleX(1)}
.led-n{
  font-family:var(--display);font-weight:600;
  font-size:clamp(40px,7.4vw,96px);line-height:.94;letter-spacing:-0.035em;
  color:var(--frost-white);font-variant-numeric:tabular-nums;
  display:flex;align-items:center;gap:var(--s16);
}
.led-dot{
  width:26px;height:26px;border-radius:50%;flex:0 0 auto;
  border:1px solid var(--graphite);
  display:flex;align-items:center;justify-content:center;
}
.led-dot i{width:5px;height:5px;border-radius:50%;background:var(--smoke);display:block}
.led-l{margin:0;font-size:var(--t-xs);color:var(--platinum);letter-spacing:.06em;text-transform:uppercase;text-align:right}
@media (max-width:640px){
  .led{grid-template-columns:1fr}
  .led-l{text-align:left}
}

/* ---------- a hand of frames, opening out of one stack ----------
   Every frame starts where the middle one is and comes out to
   its own place in the arch, each a beat behind the one before
   it. The outer pair sit lower, which is what makes the row
   read as a curve rather than a line.                         */
.fan{
  display:flex;justify-content:center;align-items:flex-start;
  gap:clamp(4px,.9vw,16px);
  margin-top:clamp(36px,5vw,72px);
  padding-bottom:clamp(30px,4vw,56px);
}
.fan-card{
  position:relative;flex:0 0 auto;
  width:clamp(52px,12.6vw,186px);aspect-ratio:9/16.6;
  border-radius:clamp(12px,1.5vw,20px);overflow:hidden;
  background:var(--carbon);
  box-shadow:0 26px 60px rgba(0,0,0,.5);
  transform:translate3d(var(--sx,0),18px,0) rotate(0deg) scale(.9);
  opacity:0;
  transition:transform 1.05s var(--ease-sig),opacity .7s var(--ease-sig);
  transition-delay:var(--fd,0ms);
}
.fan[data-reveal].in .fan-card,.fan.in .fan-card{
  transform:translate3d(0,var(--fy,0px),0) rotate(var(--fr,0deg)) scale(1);
  opacity:1;
}
.fan-still{position:absolute;inset:0;background-size:cover;background-position:center}
@media (max-width:700px){
  .fan{gap:3px}
  .fan-card{box-shadow:0 14px 34px rgba(0,0,0,.5)}
}
.fan-card::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  border-radius:inherit;border:1px solid rgba(245,245,247,.1);
  background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%);
}

/* ---------- one line of type that never stops ---------- */
.marq{
  overflow:hidden;white-space:nowrap;user-select:none;
  margin-top:clamp(44px,6vw,88px);
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 7%,#000 93%,transparent 100%);
          mask-image:linear-gradient(90deg,transparent 0,#000 7%,#000 93%,transparent 100%);
}
.marq-t{
  display:inline-block;
  font-family:var(--display);font-weight:600;
  font-size:clamp(34px,8.4vw,112px);line-height:1.1;letter-spacing:-0.035em;
  color:var(--frost-white);
  animation:marqRun 34s linear infinite;
  will-change:transform;
}
.marq-t span{padding-right:.34em}
.marq:hover .marq-t{animation-play-state:paused}
@keyframes marqRun{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}


/* ---------- the hero, at the width of the screen ----------
   The same band the cycling word sits in, given to the opening
   line: photograph to all four edges, one vignette over it, and
   the sentence set in the middle of the screen rather than
   tucked into a corner of a card.                            */
.hero-band{
  position:relative;overflow:hidden;background:var(--pure-black);
  min-height:min(94vh,940px);
  display:flex;align-items:center;justify-content:center;
  padding-block:var(--band);
}
.hero-band .hero-half{opacity:.62}
.hero-band .hero-vignette{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(120% 82% at 50% 46%,rgba(0,0,0,.12) 0%,rgba(0,0,0,.62) 58%,rgba(0,0,0,.92) 100%),
    linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 26%,rgba(0,0,0,0) 62%,rgba(0,0,0,.72) 100%);
}
.hero-band .hero-copy{
  position:relative;left:auto;right:auto;bottom:auto;padding:0;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  gap:var(--s20);max-width:min(100%,1040px);margin:0 auto;
}
.hero-band .hero-type{
  font-size:clamp(38px,6.6vw,88px);line-height:1.04;
  max-width:15ch;margin-inline:auto;
}
.hero-band .eyebrow{max-width:none}
.hero-band .hero-actions{justify-content:center;margin-top:var(--s8)}
.hero-band .hero-note{max-width:42ch;color:var(--silver-mist)}
@media (max-width:700px){
  .hero-band{min-height:min(92vh,780px)}
  .hero-band .hero-type{max-width:100%}
}

/* ---------- the work, as a pile that comes apart ----------
   Every frame starts on top of the one before it in a single
   pile at the middle of the stage. As the band climbs the
   screen the pile opens: the frames turn on a vertical axis,
   push apart in depth, and then come down flat into their own
   place in the arrangement. The turning is strongest halfway
   through and gone at both ends, so the pile and the finished
   arrangement are both square to the screen and only the
   travel between them is loose.

   No word anywhere on a frame. The photograph is the whole of
   it; the pointer grows the picture a little and deepens the
   shadow, and a press opens the frame full size.             */
/* The band gives the arrangement two and a half screens of scroll and
   holds it still in the middle of them. Everything the frames do —
   opening, changing places, closing — is spent against that travel,
   so the whole move belongs to the scroll and never runs on its own. */
.cg-track{position:relative;height:250vh}
.cg-pin{
  position:sticky;top:0;min-height:100vh;
  display:flex;flex-direction:column;justify-content:center;
  gap:clamp(16px,2.4vw,32px);
  padding-block:clamp(88px,11vh,124px) clamp(24px,5vh,56px);  /* clear of the bar */
}
.cg-pin .sec-head{margin-bottom:0}
.collage{
  position:relative;
  width:min(100%,calc((100vh - 290px) * 1.86));
  aspect-ratio:16/8.6;margin-inline:auto;
  perspective:1500px;perspective-origin:50% 48%;
  transform-style:preserve-3d;   /* depth decides what covers what */
  --cgs:1;
}
.cg-slot{
  position:absolute;
  left:calc(50% + var(--fx,0%));top:calc(50% + var(--fy,0%));
  width:calc(var(--w,20%) * var(--cgs));
  transform:translate(-50%,-50%);
  transform-style:preserve-3d;
}
.cg-card{
  position:relative;display:block;width:100%;
  aspect-ratio:var(--ar,1);
  border:none;padding:0;margin:0;background:var(--carbon);
  border-radius:clamp(10px,1.3vw,18px);
  overflow:hidden;cursor:pointer;
  box-shadow:0 20px 44px rgba(0,0,0,.55);
  transform-origin:50% 50%;
  will-change:transform;
  transition:box-shadow .45s var(--ease-sig);
}
.cg-card::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  border-radius:inherit;border:1px solid rgba(245,245,247,.09);
}
.cg-still{
  position:absolute;inset:0;background-size:cover;background-position:center;
  transition:transform .8s var(--ease-sig);
}
.cg-card:hover,.cg-card:focus-visible{box-shadow:0 30px 68px rgba(0,0,0,.72)}
.cg-card:hover .cg-still,.cg-card:focus-visible .cg-still{transform:scale(1.07)}
@media (max-width:860px){ .collage{--cgs:1.16;aspect-ratio:4/3;width:min(100%,calc((100vh - 270px) * 1.33))} }
@media (max-width:700px){ .cg-track{height:210vh} }
@media (max-width:560px){ .collage{--cgs:1.52;aspect-ratio:1/1;perspective:900px;width:min(100%,calc(100vh - 290px))} }

/* ---------- and none of it for anyone who asked for less ---------- */
@media (prefers-reduced-motion:reduce){
  .sheet-links button,.sheet-acct,.sheet-foot{animation:none!important}
  .burger-lines i,.burger-mark,.sheet{transition-duration:.01ms!important}
  .sp-c,.sp-f,.bm-c,.od-r,[data-mrev],[data-bwipe]{transition:none!important;transform:none!important;opacity:1!important;clip-path:none!important}
  .curtain,.intro{display:none!important}
  .hero-half,.cyc-r,.led-rule,.fan-card{transition:none!important;transform:none!important;opacity:1!important}
  .cg-card{transition:none!important;transform:none!important}
  .cg-track{height:auto!important}
  .cg-pin{position:static!important;min-height:0!important;padding-block:0!important}
  #app.stacked > section{position:static!important;transform:none!important;box-shadow:none!important;margin-top:0!important}
  .sec-cov{display:none}
  .marq-t{animation:none!important}
  html.sig-boot,html.sig-boot body{overflow:auto}
}
</style>
