/* ============================== MOTION ==============================
   Three small pieces, all of them optional: sections that arrive as
   you reach them, stills that drift a little against the scroll, and
   a cursor of the studio's own. Each one checks for a real pointer
   and for the system's reduced-motion setting before it does
   anything, and the page is complete without any of them.        */

var REDUCED = false;
try{ REDUCED = window.matchMedia('(prefers-reduced-motion:reduce)').matches; }catch(e){}

/* ---------- sections arriving ---------- */
var REVEAL_SEL = '.sec-head,.tile,.case,.pkg,.awards-list li,.closing,.hero-meta > div,'+
                 '.job,.step-card,.notice,.refbox,.slot-grid,.form-col > .kicker,'+
                 '.led,.fan';
var revealObserver = null;

function initReveal(){
  if(REDUCED || !('IntersectionObserver' in window)) return;
  revealObserver = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(!en.isIntersecting) return;
      en.target.classList.add('in');
      revealObserver.unobserve(en.target);
    });
  }, {threshold:0, rootMargin:'0px 0px -28% 0px'});
}

function bindReveal(){
  if(!revealObserver) return;
  var app = document.getElementById('app');
  var groups = {};
  var nodes = app.querySelectorAll(REVEAL_SEL);
  for(var i=0;i<nodes.length;i++){
    var el = nodes[i];
    if(el.hasAttribute('data-reveal')) continue;
    /* stagger within whatever row or grid the element belongs to */
    var pid = el.parentNode.className || 'x';
    groups[pid] = (groups[pid] == null) ? 0 : groups[pid] + 1;
    var n = Math.min(groups[pid], 5);
    el.setAttribute('data-reveal','');
    el.style.setProperty('--rd', (n * 55) + 'ms');
    /* anything already on screen when the page loads arrives at once —
       unless something is still covering the page, in which case it
       waits its turn, or unless nothing about this render is new. */
    var r = el.getBoundingClientRect();
    if(r.top < window.innerHeight * 0.92){
      if(SIG.on && SIG.gate){
        el.__sigPlay = (function(el){ return function(){ el.classList.add('in'); }; })(el);
        SIG.pending.push(el);
        continue;
      }
      if(SIG.on && !SIG.anim){ el.classList.add('now','in'); continue; }
      el.classList.add('in'); continue;
    }
    revealObserver.observe(el);
  }
}

/* ---------- stills drifting against the scroll ---------- */
var pxNodes = [], pxTicking = false;

function bindParallax(){
  if(REDUCED) return;
  pxNodes = Array.prototype.slice.call(document.querySelectorAll('[data-px]'));
  updateParallax();
}

function updateParallax(){
  var vh = window.innerHeight || 1;
  for(var i=0;i<pxNodes.length;i++){
    var el = pxNodes[i], host = el.parentNode;
    if(!host || !host.getBoundingClientRect) continue;
    var r = host.getBoundingClientRect();
    if(r.bottom < -200 || r.top > vh + 200) continue;
    var mid = r.top + r.height / 2;
    var p = (mid - vh / 2) / (vh / 2);              /* -1 above, +1 below */
    if(p > 1.4) p = 1.4; if(p < -1.4) p = -1.4;
    el.style.setProperty('--py', (p * -22).toFixed(1) + 'px');
  }
  updateStack();
  updateCollage();
  pxTicking = false;
}

function onScroll(){
  if(pxTicking || REDUCED) return;
  pxTicking = true;
  window.requestAnimationFrame(updateParallax);
}

/* ---------- the bar only becomes glass once there is something behind it ----------
   Kept off the parallax path on purpose: that one bows out under
   prefers-reduced-motion, and the glass is not motion, it is state.  */
function initNavLift(){
  var root = document.documentElement, ticking = false, on = null, wasLight = null;
  function toneUnderBar(){
    var wrap = document.querySelector('.navwrap');
    if(!wrap) return false;
    var y = wrap.getBoundingClientRect().bottom + 2;
    var secs = document.querySelectorAll('#app > section, .footer');
    for(var i=0;i<secs.length;i++){
      var r = secs[i].getBoundingClientRect();
      if(r.top <= y && r.bottom > y){
        return secs[i].classList.contains('light') || secs[i].classList.contains('frost');
      }
    }
    return false;
  }
  function apply(){
    ticking = false;
    var lift = (window.scrollY || window.pageYOffset || 0) > 12;
    var light = toneUnderBar();
    if(lift !== on){ on = lift; root.classList.toggle('nav-lift', lift); }
    if(light !== wasLight){ wasLight = light; root.classList.toggle('nav-light', light); }
  }
  window.addEventListener('scroll', function(){
    if(ticking) return;
    ticking = true;
    window.requestAnimationFrame(apply);
  }, {passive:true});
  window.addEventListener('resize', apply, {passive:true});
  apply();
  NAVLIFT = apply;
}
var NAVLIFT = function(){};

/* ---------- the cursor ---------- */
var CUR = {on:false, x:0, y:0, arrow:null, cap:null, label:null, ang:0};
var CUR_LINK = 'a,button,[data-go],[data-open],[data-lang],[data-menu],[data-reel],'+
               '[data-reelstep],.chip,.tag,.dot,label,summary';

function initCursor(){
  if(REDUCED) return;
  var fine = false;
  try{ fine = window.matchMedia('(pointer:fine)').matches; }catch(e){}
  if(!fine) return;

  CUR.arrow = document.getElementById('curArrow');
  CUR.cap   = document.getElementById('curCap');
  CUR.label = document.getElementById('curLabel');
  if(!CUR.arrow || !CUR.cap) return;

  document.addEventListener('mousemove', function(e){
    CUR.x = e.clientX; CUR.y = e.clientY;
    if(!CUR.on){
      CUR.on = true;
      document.documentElement.classList.add('cur-on');
      loop();
    }
    hoverState(e.target);
  }, {passive:true});

  document.addEventListener('mouseleave', function(){
    document.documentElement.classList.remove('cur-on');
    CUR.on = false;
  });
  document.addEventListener('mouseenter', function(){
    if(CUR.x || CUR.y){ document.documentElement.classList.add('cur-on'); CUR.on = true; loop(); }
  });
  document.addEventListener('mousedown', function(){ document.documentElement.classList.add('cur-down'); });
  document.addEventListener('mouseup',   function(){ document.documentElement.classList.remove('cur-down'); });
}

function hoverState(target){
  var root = document.documentElement;
  if(!target || !target.closest) return;

  var field = target.closest('input,textarea,select');
  root.classList.toggle('cur-text', !!field);
  if(field){ root.classList.remove('cur-link','cur-media'); return; }

  var media = target.closest('[data-cursor]');
  if(media){
    root.classList.add('cur-media');
    root.classList.remove('cur-link');
    var want = media.getAttribute('data-cursor') || '';
    if(CUR.label && CUR.label.textContent !== want) CUR.label.textContent = want;
    return;
  }
  root.classList.remove('cur-media');
  root.classList.toggle('cur-link', !!target.closest(CUR_LINK));
}

/* The tip stays exactly where the pointer is — aim is never guesswork.
   What lags is the tilt: the piece leans into the direction of travel
   and settles back upright a few frames later, which is what makes a
   solid object read as heavy rather than drawn.                     */
var CUR_PX = 0;
function loop(){
  if(!CUR.on) return;
  var vx = CUR.x - CUR_PX;
  CUR_PX = CUR.x;

  var want = Math.max(-15, Math.min(15, vx * 1.1));
  CUR.ang += (want - CUR.ang) * 0.12;
  if(Math.abs(CUR.ang) < 0.02) CUR.ang = 0;

  CUR.arrow.style.transform =
    'translate3d('+(CUR.x - 4)+'px,'+(CUR.y - 3)+'px,0) rotate('+CUR.ang.toFixed(2)+'deg)';
  CUR.cap.style.transform = 'translate3d('+CUR.x+'px,'+CUR.y+'px,0)';

  window.requestAnimationFrame(loop);
}

/* ---------- the nav pill ----------
   One rounded block behind the links. It rests under whichever page
   you are on and slides to whatever the pointer is over, so the nav
   answers the mouse instead of only the click.                    */
function movePill(el){
  var pill = document.getElementById('navPill');
  if(!pill || !el) return;
  pill.style.opacity = '1';
  pill.style.width  = el.offsetWidth + 'px';
  pill.style.height = el.offsetHeight + 'px';
  pill.style.transform = 'translate3d('+el.offsetLeft+'px,'+el.offsetTop+'px,0)';
}

function syncNavPill(instant){
  var wrap = document.querySelector('.navlinks');
  var pill = document.getElementById('navPill');
  if(!wrap || !pill) return;
  if(instant) pill.classList.add('no-anim');
  var active = wrap.querySelector('.navlink[aria-current="page"]');
  if(active) movePill(active);
  else pill.style.opacity = '0';
  if(instant){ void pill.offsetWidth; pill.classList.remove('no-anim'); }
}

document.addEventListener('mouseover', function(e){
  var t = e.target;
  if(!t || !t.closest) return;
  if(!t.closest('.navlinks')) return;
  var link = t.closest('.navlink');
  if(link) movePill(link); else syncNavPill();
});

document.addEventListener('mouseout', function(e){
  var t = e.target;
  if(!t || !t.closest || !t.closest('.navlinks')) return;
  var to = e.relatedTarget;
  if(to && to.closest && to.closest('.navlinks')) return;   /* still inside */
  syncNavPill();
});

window.addEventListener('resize', function(){ syncNavPill(true); }, {passive:true});
/* the links change width when the real typeface lands */
try{ if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ syncNavPill(true); }); }catch(e){}


/* ============================================================
   SIGNATURE MOTION — the machinery
   Text is split where the browser already broke it, so the lines
   it rises through are the real ones and nothing shifts when the
   words go back afterwards. Frames open from their own middle,
   labels roll over letter by letter, numbers climb to their value,
   and a curtain carries you from one screen to the next. Every
   piece runs on one curve and one set of timings.
   ============================================================ */
/* The curtain between screens is off: moving between tabs is instant,
   and the new screen introduces itself with its own text and frames.
   Set this to true to bring the black sweep and the mark back.       */
var USE_CURTAIN = false;

var SIG = {
  on:!REDUCED,
  gate:true,            /* something is covering the page */
  anim:true,            /* this render is worth animating */
  pending:[],
  char:11, line:34, item:55, dur:550
};

var SPLIT_TITLE = '.hero-type,.display-type,.h-lg,.h-md,.h-sm,.kicker,.eyebrow';
var SPLIT_BODY  = '.body-copy';
var MEDIA_SEL   = '.hero-still,.reel,.tile-media,.case-media';
var WIPE_SEL    = '.btn-lg,.hero-copy .btn';

function sigPlain(el){
  return el.childNodes.length === 1 && el.firstChild.nodeType === 3;
}
function sigInView(el, edge){
  var r = el.getBoundingClientRect();
  return r.top < (window.innerHeight || 800) * (edge || 0.92);
}

/* ---------- watching ---------- */
var sigObs = null;
function sigInit(){
  if(!SIG.on || !('IntersectionObserver' in window)) return;
  /* "top 72%" — a block starts the moment its top passes 72% of the screen */
  sigObs = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(!en.isIntersecting) return;
      sigObs.unobserve(en.target);
      sigFire(en.target);
    });
  }, {threshold:0, rootMargin:'0px 0px -28% 0px'});
}
function sigFire(el){
  var f = el.__sigPlay;
  if(f){ el.__sigPlay = null; f(); }
}
function sigWatch(el){
  if(SIG.gate){ SIG.pending.push(el); return; }
  if(sigInView(el)){ sigFire(el); return; }
  if(sigObs) sigObs.observe(el); else sigFire(el);
}
/* Anything sitting inside a frame is invisible to the observer until
   that frame opens — a clipped ancestor counts as out of sight. So the
   frame brings its own contents in, a beat behind itself. */
function sigFireInside(root, delay){
  var els = root.querySelectorAll('*');
  for(var i=0;i<els.length;i++){
    if(!els[i].__sigPlay) continue;
    (function(el){ window.setTimeout(function(){ sigFire(el); }, delay || 0); })(els[i]);
  }
}

function sigPlayPending(){
  var q = SIG.pending; SIG.pending = [];
  for(var i=0;i<q.length;i++){
    var el = q[i];
    if(!document.body.contains(el)) continue;
    if(sigInView(el, 1)) sigFire(el);
    else if(sigObs) sigObs.observe(el);
    else sigFire(el);
  }
}

/* ---------- text ----------
   The words are measured where they already sit, so the split keeps
   the wrapping the browser chose — including a balanced heading. */
function sigLines(el){
  var node = el.firstChild, text = node.nodeValue;
  var re = /\S+/g, m, ws = [];
  while((m = re.exec(text)) !== null) ws.push([m[0], m.index]);
  if(!ws.length) return null;
  var range = document.createRange(), lines = [], cur = null, last = null;
  for(var i=0;i<ws.length;i++){
    try{ range.setStart(node, ws[i][1]); range.setEnd(node, ws[i][1] + ws[i][0].length); }
    catch(e){ return null; }
    var top = Math.round(range.getBoundingClientRect().top);
    if(last === null || Math.abs(top - last) > 2){ cur = []; lines.push(cur); last = top; }
    cur.push(ws[i][0]);
  }
  return lines;
}

/* ---------- a sentence that hands itself over halfway ----------
   `data-dim="n"` steps the last n words back a tone. It is one
   sentence in one face and one size: only the colour changes, and
   it survives the split being taken back off again.            */
function sigTone(text, n){
  var parts = text.split(/(\s+)/), idx = [], out = '', open = false;
  for(var i=0;i<parts.length;i++) if(parts[i].trim()) idx.push(i);
  var from = idx.length - n;
  if(n <= 0 || from <= 0) return esc(text);
  for(var j=0;j<parts.length;j++){
    if(parts[j].trim() && !open && idx.indexOf(j) >= from){ out += '<span class="dim">'; open = true; }
    out += esc(parts[j]);
  }
  return out + (open ? '</span>' : '');
}

function sigSplit(el, mode){
  if(!sigPlain(el)) return 0;
  var label = el.textContent;
  if(!label.trim() || label.length > 320) return 0;
  var lines = sigLines(el);
  if(!lines || !lines.length) return 0;

  var dim = Number(el.getAttribute('data-dim') || 0), words = 0;
  for(var q=0;q<lines.length;q++) words += lines[q].length;
  var dimFrom = (dim > 0) ? words - dim : words + 1;
  var wi = 0;

  var out = '', longest = 0;
  for(var i=0;i<lines.length;i++){
    var base = i * SIG.line;
    if(mode === 'fade'){
      out += '<span class="sp-line"><span class="sp-f" style="--cd:'+base+'ms">'+esc(lines[i].join(' '))+'</span></span>';
      if(base > longest) longest = base;
      wi += lines[i].length;
    } else {
      var inner = '', c = 0;
      for(var w=0;w<lines[i].length;w++){
        var word = lines[i][w] + (w < lines[i].length - 1 ? ' ' : '');
        var cls = (wi >= dimFrom) ? 'sp-c sp-dim' : 'sp-c';
        for(var k=0;k<word.length;k++){
          var d = base + Math.min(c, 34) * SIG.char;   /* a long line never drags */
          if(d > longest) longest = d;
          inner += '<span class="'+cls+'" style="--cd:'+d+'ms">'+esc(word.charAt(k))+'</span>';
          c++;
        }
        wi++;
      }
      out += '<span class="sp-line">'+inner+'</span>';
    }
  }
  el.__sigOrig = (dim > 0) ? sigTone(label, dim) : el.innerHTML;
  el.innerHTML = '<span class="sp-sr">'+esc(label)+'</span><span aria-hidden="true">'+out+'</span>';
  return longest + SIG.dur + 60;
}

/* the same two tones for anything the split never reached */
function prepTone(root){
  var els = root.querySelectorAll('[data-dim]');
  for(var i=0;i<els.length;i++){
    var el = els[i];
    if(el.__sigTone || !sigPlain(el)) continue;
    el.__sigTone = 1;
    var n = Number(el.getAttribute('data-dim') || 0);
    if(n > 0) el.innerHTML = sigTone(el.textContent, n);
  }
}

function sigRevert(el){
  if(el.__sigOrig == null) return;
  el.innerHTML = el.__sigOrig;
  el.__sigOrig = null;
  el.classList.remove('sp-on');
}

function prepSplits(root){
  var els = root.querySelectorAll(SPLIT_TITLE + ',' + SPLIT_BODY);
  for(var i=0;i<els.length;i++){
    var el = els[i];
    if(el.__sigDone) continue;
    el.__sigDone = 1;
    if(!SIG.anim && !SIG.gate && sigInView(el)) continue;   /* already read; leave it be */
    var fade = el.className.indexOf('body-copy') > -1;
    var total = sigSplit(el, fade ? 'fade' : 'char');
    if(!total) continue;
    el.__sigTone = 1;
    (function(el, total){
      el.__sigPlay = function(){
        el.classList.add('sp-on');
        window.setTimeout(function(){ sigRevert(el); }, total);
      };
    })(el, total);
    sigWatch(el);
  }
}

/* ---------- frames opening ---------- */
function prepMedia(root){
  var els = root.querySelectorAll(MEDIA_SEL);
  for(var i=0;i<els.length;i++){
    var el = els[i];
    if(el.hasAttribute('data-mrev')) continue;
    var r = '0px';
    try{ r = window.getComputedStyle(el).borderTopLeftRadius || '0px'; }catch(e){}
    el.style.setProperty('--mr', r);
    el.setAttribute('data-mrev','');
    if(!SIG.anim && !SIG.gate && sigInView(el)){ el.classList.add('now','in'); continue; }
    (function(el){
      el.__sigPlay = function(){ el.classList.add('in'); sigFireInside(el, 95); };
    })(el);
    sigWatch(el);
  }
}

/* ---------- labels that roll over ---------- */
function prepButtons(root){
  var els = root.querySelectorAll('.btn');
  for(var i=0;i<els.length;i++){
    var el = els[i];
    if(el.classList.contains('bm') || !sigPlain(el)) continue;
    var label = el.textContent.replace(/\s+/g,' ').trim();
    if(!label || label.length > 46) continue;
    var a = '', b = '';
    for(var c=0;c<label.length;c++){
      var piece = '<span class="bm-c" style="--bd:'+(Math.min(c,20) * 14)+'ms">'+esc(label.charAt(c))+'</span>';
      a += piece; b += piece;
    }
    if(!el.getAttribute('aria-label')) el.setAttribute('aria-label', label);
    el.classList.add('bm');
    el.innerHTML = '<span class="bm-lab" aria-hidden="true">'+
      '<span class="bm-a">'+a+'</span><span class="bm-b">'+b+'</span></span>';
  }
  /* the large calls to action open from their own centre */
  var big = root.querySelectorAll(WIPE_SEL);
  for(var j=0;j<big.length;j++){
    var bt = big[j];
    if(bt.hasAttribute('data-bwipe')) continue;
    bt.setAttribute('data-bwipe','');
    bt.style.setProperty('--cd', (j * SIG.item) + 'ms');
    if(!SIG.anim && !SIG.gate && sigInView(bt)){ bt.classList.add('now','in'); continue; }
    (function(bt){ bt.__sigPlay = function(){ bt.classList.add('in'); }; })(bt);
    sigWatch(bt);
  }
}

/* ---------- numbers climbing to their value ---------- */
function prepOdo(root){
  var els = root.querySelectorAll('.metric b,.hero-meta b,.led-n b');
  for(var i=0;i<els.length;i++){
    var el = els[i];
    if(el.__sigOdo || !sigPlain(el)) continue;
    el.__sigOdo = 1;
    var text = el.textContent, targets = [], out = '', n = 0, has = false;
    for(var c=0;c<text.length;c++){
      var ch = text.charAt(c);
      if(ch >= '0' && ch <= '9'){
        has = true;
        var col = '';
        for(var d=0;d<=9;d++) col += '<span class="od-d">'+d+'</span>';
        out += '<span class="od"><span class="od-r" style="--cd:'+(n * 45)+'ms">'+col+'</span></span>';
        targets.push(Number(ch)); n++;
      } else out += '<span class="od-s">'+esc(ch)+'</span>';
    }
    if(!has) continue;
    el.innerHTML = '<span class="sp-sr">'+esc(text)+'</span><span aria-hidden="true">'+out+'</span>';
    (function(el, targets){
      el.__sigPlay = function(){
        var rolls = el.querySelectorAll('.od-r');
        for(var k=0;k<rolls.length;k++){
          rolls[k].style.transform = 'translate3d(0,-'+(targets[k] * 10)+'%,0)';
        }
      };
      el.__sigSnap = function(){ el.classList.add('od-now'); el.__sigPlay(); };
    })(el, targets);
    if(!SIG.anim && !SIG.gate && sigInView(el)){ el.__sigSnap(); el.__sigPlay = null; continue; }
    sigWatch(el);
  }
}

/* ---------- the frame that arrives in two halves ----------
   Both halves wait off their own edge and come in together. They
   are two pieces of one photograph, so the moment they meet the
   seam disappears and there is simply a picture there.        */
function prepConverge(root){
  var els = root.querySelectorAll('[data-converge]');
  for(var i=0;i<els.length;i++){
    var el = els[i];
    if(el.__sigConv) continue;
    el.__sigConv = 1;
    if(!SIG.on){ continue; }
    if(!SIG.anim && !SIG.gate && sigInView(el)){ el.classList.add('in'); continue; }
    (function(el){ el.__sigPlay = function(){ el.classList.add('in'); }; })(el);
    sigWatch(el);
  }
}

/* ---------- a word that turns over on a fixed line ----------
   The list is stacked inside one clipped line with the first word
   repeated at the bottom, so the return from the last to the first
   travels the same way as every other turn and is never seen. It
   stops whenever the line is off the screen.                    */
var cycTimers = [];
function prepCycle(root){
  for(var i=0;i<cycTimers.length;i++) window.clearInterval(cycTimers[i]);
  cycTimers = [];
  if(REDUCED) return;
  var els = root.querySelectorAll('[data-cyc]');
  for(var j=0;j<els.length;j++){
    (function(el){
      var row = el.querySelector('.cyc-r');
      if(!row) return;
      var n = row.children.length - 1;          /* the repeat does not count */
      if(n < 2) return;
      var at = 0, step = 1.16, held = false;
      cycTimers.push(window.setInterval(function(){
        if(!document.body.contains(el) || held) return;
        var r = el.getBoundingClientRect();
        if(r.bottom < 0 || r.top > (window.innerHeight || 800)) return;
        at++;
        row.style.transform = 'translate3d(0,-' + (at * step).toFixed(3) + 'em,0)';
        if(at >= n){
          held = true;
          window.setTimeout(function(){
            row.style.transition = 'none';
            row.style.transform = 'translate3d(0,0,0)';
            void row.offsetWidth;
            row.style.transition = '';
            at = 0; held = false;
          }, 760);
        }
      }, 2600));
    })(els[j]);
  }
}

/* ---------- the pile that comes apart ----------
   One pile at the middle of the stage at the start, the finished
   arrangement at the end, and the scroll between the two. Two
   curves drive it: `e` carries each frame from the middle of the
   pile out to its own place, and `ch` — a half sine, nothing at
   either end and everything in the middle — turns the frames on
   their vertical axis and pushes them apart in depth on the way.
   That is why the pile and the arrangement both sit square to
   the screen and only the travel between them is loose.

   Each frame's place is read from the page once and kept in
   pixels, so the run only writes transforms: no property any
   child inherits, no measurement, nothing that forces a layout. */
var cgStage = null, cgTrack = null, cgCards = [], cgTopA = null, cgTopB = null;

function bindCollage(){
  cgStage = document.querySelector('[data-collage]');
  cgCards = [];
  cgTrack = null;
  if(!cgStage) return;
  cgTrack = document.querySelector('[data-cgtrack]');
  var slots = cgStage.querySelectorAll('.cg-slot');
  var sr = cgStage.getBoundingClientRect();
  var mx = sr.left + sr.width / 2, my = sr.top + sr.height / 2;
  var i;
  for(i=0;i<slots.length;i++){
    var r = slots[i].getBoundingClientRect();
    cgCards.push({
      el: slots[i].firstElementChild,
      cx: (r.left + r.width / 2) - mx,
      cy: (r.top + r.height / 2) - my,
      /* the frame's own size, read from layout so a transform already
         written on it this frame cannot corrupt the measurement */
      w: slots[i].firstElementChild.offsetWidth  || 1,
      h: slots[i].firstElementChild.offsetHeight || 1,
      ry: Number(slots[i].getAttribute('data-ry')) || 0,
      rz: Number(slots[i].getAttribute('data-rz')) || 0,
      tz: Number(slots[i].getAttribute('data-tz')) || 0,
      bz: Number(slots[i].getAttribute('data-bz')) || 0,
      pair: Number(slots[i].getAttribute('data-pair')) || 0,
      dir: Number(slots[i].getAttribute('data-dir')) || 1
    });
  }
  /* each frame keeps the place and the depth of the one it trades with,
     so the swap is a read of two numbers rather than a search */
  for(i=0;i<cgCards.length;i++){
    var o = cgCards[cgCards[i].pair] || cgCards[i];
    cgCards[i].px = o.cx; cgCards[i].py = o.cy; cgCards[i].pz = o.bz;
  }
  /* Which frame is in front when the pile is closed — the deepest-resting
     one before the trade, and whichever inherits that depth after it. The
     closed pile takes that frame's exact size, so the frame you can see is
     itself and everything else is hidden square behind it. Before this,
     the frames only shared a centre, and a pile of eight different sizes
     read as a mistake rather than as one card. */
  var ta = 0, tb = 0;
  for(i=1;i<cgCards.length;i++){
    if(cgCards[i].bz > cgCards[ta].bz) ta = i;
    if(cgCards[i].pz > cgCards[tb].pz) tb = i;
  }
  cgTopA = cgCards[ta]; cgTopB = cgCards[tb];
  if(REDUCED){                      /* the arrangement, and none of the travel */
    for(i=0;i<cgCards.length;i++) cgCards[i].el.style.transform = 'none';
    return;
  }
  updateCollage();
}

function cgEase(q){                 /* a heavy start and a long glide out */
  return q < 0.5 ? 4*q*q*q : 1 - Math.pow(-2*q + 2, 3) / 2;
}

/* ---------- the three acts, all of them spent against the scroll ----------
   OPEN    the pile comes apart: every frame turns on its vertical axis,
           pushes back in depth and lands flat in its own place.
   TRADE   the frames change places in pairs. One of each pair comes
           forward and the other goes back, so they pass through each
           other's depth rather than around it — which is why one really
           does cover the other on the way past — and they arrive at each
           other's place and each other's resting depth.
   CLOSE   the same move as OPEN, run backwards from wherever the trade
           left them, back into one pile.
   The turn is strongest in the middle of each act and nothing at its
   ends, so every state the scroll can rest on is square to the screen. */
var CG_OPEN = 0.30, CG_TRADE = 0.72;

function updateCollage(){
  if(REDUCED || !cgStage || !cgCards.length) return;
  var vh = window.innerHeight || 1, p;

  if(cgTrack){
    var tr = cgTrack.getBoundingClientRect();
    var run = tr.height - vh;
    p = run > 0 ? (-tr.top) / run : 1;
  } else {
    var r = cgStage.getBoundingClientRect();
    p = (vh * 1.02 - (r.top + r.height / 2)) / (vh * 0.50);
  }
  if(p < 0) p = 0;
  if(p > 1) p = 1;

  var open, trade, turn, q;
  if(p <= CG_OPEN){
    q = p / CG_OPEN;
    open = cgEase(q); trade = 0; turn = Math.sin(q * Math.PI);
  } else if(p <= CG_TRADE){
    q = (p - CG_OPEN) / (CG_TRADE - CG_OPEN);
    open = 1; trade = cgEase(q); turn = 0;
  } else {
    q = (p - CG_TRADE) / (1 - CG_TRADE);
    open = 1 - cgEase(q); trade = 1; turn = Math.sin(q * Math.PI);
  }
  var cross = Math.sin(trade * Math.PI);        /* nothing at either end of the trade */

  /* the size of the closed pile: the front frame's own, so it is undistorted
     and every other frame is squared away exactly behind it */
  var pw = cgTopA.w + (cgTopB.w - cgTopA.w) * trade;
  var ph = cgTopA.h + (cgTopB.h - cgTopA.h) * trade;
  /* and that matching is finished well before the frames are, so nothing is
     still being squeezed while it is out in the open */
  var fit = 1 - open * 1.7;
  if(fit < 0) fit = 0;

  for(var i=0;i<cgCards.length;i++){
    var c = cgCards[i];
    /* where it is meant to be once the pile is open, this far through the trade */
    var tx = c.cx + (c.px - c.cx) * trade;
    var ty = c.cy + (c.py - c.cy) * trade;
    var bz = c.bz + (c.pz - c.bz) * trade;
    /* the frame itself already sits at (cx, cy), so only the difference moves */
    var dx = tx * open - c.cx;
    var dy = ty * open - c.cy;
    /* a sliver of the resting depth survives into the pile: far too little to
       change any size, just enough to keep the front frame in front */
    var dz = bz * (0.06 + 0.94 * open) + c.tz * turn + c.dir * 300 * cross;
    var ry = c.ry * turn + c.dir * 30 * cross;
    var rz = c.rz * turn + c.dir * 4 * cross;
    var sc = 1 - 0.07 * turn - 0.04 * cross;
    var sx = sc * (1 + (pw / c.w - 1) * fit);
    var sy = sc * (1 + (ph / c.h - 1) * fit);
    c.el.style.transform =
      'translate3d(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px,' + dz.toFixed(1) + 'px) ' +
      'rotateY(' + ry.toFixed(2) + 'deg) ' +
      'rotate(' + rz.toFixed(2) + 'deg) ' +
      'scale(' + sx.toFixed(4) + ',' + sy.toFixed(4) + ')';
  }
}

/* ---------- bands that pin and are climbed over ----------
   Each band on the home screen stops once it has been read and the
   next one comes up over it. A band taller than the screen scrolls
   all the way through first — that is what the negative `top` is
   for — so nothing is ever pinned with half of it unread. The one
   underneath takes a shade, and that is the whole of the depth: no
   scaling, no blur, no filter, nothing that has to be recomputed.

   The shade is a real element with its own opacity rather than a
   variable the stylesheet reads. Writing a custom property on a
   band invalidates everything inside it, and doing that on every
   scroll frame is what turns a smooth cover into a stutter.     */
var stackNodes = [], stackCovs = [], stackAt = [];

function bindStack(){
  var app = document.getElementById('app');
  stackNodes = []; stackCovs = []; stackAt = [];
  if(!app) return;
  var on = app.classList.contains('stacked');
  var kids = app.children;
  for(var i=0;i<kids.length;i++){
    if(kids[i].tagName !== 'SECTION') continue;
    if(!on){ kids[i].style.top = ''; continue; }
    stackNodes.push(kids[i]);
  }
  /* every band but the last carries the shade that falls over it */
  for(var j=0;j<stackNodes.length-1;j++){
    var cov = document.createElement('span');
    cov.className = 'sec-cov';
    cov.setAttribute('aria-hidden','true');
    stackNodes[j].appendChild(cov);
    stackCovs.push(cov);
    stackAt.push(-1);
  }
  layoutStack();
  /* A band measured before the webfont lands is measured at the wrong
     height, and a band pinned at the wrong height is a band pinned with
     some of it still unread. Measure again once the type has settled. */
  if(window.document.fonts && document.fonts.ready && document.fonts.ready.then){
    document.fonts.ready.then(function(){ bindCollage(); layoutStack(); });
  }
  window.setTimeout(function(){ bindCollage(); layoutStack(); }, 1200);
}

function layoutStack(){
  if(!stackNodes.length) return;
  var vh = window.innerHeight || 1;
  var tops = [];
  for(var i=0;i<stackNodes.length;i++) tops.push(stackNodes[i].offsetHeight);  /* read */
  for(var j=0;j<stackNodes.length;j++){                                        /* then write */
    stackNodes[j].style.top = (tops[j] > vh ? Math.round(vh - tops[j]) : 0) + 'px';
  }
  updateStack();
}

/* A pinned band stops moving, so anything inside it that was still
   waiting its turn would wait for ever. The moment a band has been
   seen all the way to its bottom edge, everything left in it is let
   through — in the order it sits on the page, so the arrival still
   reads as a sequence rather than a switch being thrown.          */
function stackFlush(sec){
  if(sec.__flushed) return;
  sec.__flushed = 1;
  var els = sec.querySelectorAll('[data-reveal],[data-mrev],[data-bwipe],[data-converge],.fan,.led'), n = 0;
  for(var i=0;i<els.length;i++){
    (function(el, k){
      window.setTimeout(function(){
        el.classList.add('in');
        if(revealObserver){ try{ revealObserver.unobserve(el); }catch(e){} }
        sigFire(el);
      }, k * 45);
    })(els[i], n++);
  }
  /* the split lines and the rolling numbers keep their own handlers */
  var rest = sec.querySelectorAll('*');
  for(var j=0;j<rest.length;j++){
    if(!rest[j].__sigPlay) continue;
    (function(el, k){ window.setTimeout(function(){ sigFire(el); }, k * 45); })(rest[j], n++);
  }
}

function updateStack(){
  if(REDUCED || !stackNodes.length) return;
  var vh = window.innerHeight || 1, n = stackNodes.length;
  /* every measurement first, every write after: reading a rect once a
     style has been written on the same frame forces a second layout. */
  var rects = [];
  for(var i=0;i<n;i++) rects.push(stackNodes[i].getBoundingClientRect());
  for(var j=0;j<n;j++){
    if(rects[j].bottom <= vh + 4 && rects[j].bottom > 0) stackFlush(stackNodes[j]);
    if(j === n - 1) break;
    var p = 1 - (rects[j+1].top / vh);
    if(p < 0) p = 0;
    if(p > 1) p = 1;
    p = Math.round(p * 50) / 50;                 /* fifty steps is past seeing */
    if(p === stackAt[j]) continue;               /* and nothing is written twice */
    stackAt[j] = p;
    stackCovs[j].style.opacity = p * 0.58;
  }
}

/* Anything still holding its turn while it is already on the screen has
   missed it: a band that pins before the reveal line reaches it, or a
   render that lands while the opening curtain is still up, would leave
   a button clipped to nothing with no scroll left to free it. After
   every render, whatever is waiting inside the first screenful is let
   through; everything below the fold still waits for the scroll.    */
function sigSettle(){
  if(!SIG.on || SIG.gate || REDUCED) return;
  var app = document.getElementById('app');
  if(!app) return;
  var vh = window.innerHeight || 800;
  var all = app.querySelectorAll('*');
  for(var i=0;i<all.length;i++){
    if(!all[i].__sigPlay) continue;
    if(all[i].getBoundingClientRect().top < vh) sigFire(all[i]);
  }
  var rev = app.querySelectorAll('[data-reveal]');
  for(var j=0;j<rev.length;j++){
    if(rev[j].classList.contains('in')) continue;
    if(rev[j].getBoundingClientRect().top < vh){
      rev[j].classList.add('in');
      if(revealObserver){ try{ revealObserver.unobserve(rev[j]); }catch(e){} }
    }
  }
}

function bindSignature(routeChanged){
  if(!SIG.on) return;
  SIG.anim = !!routeChanged;
  var app = document.getElementById('app');
  prepSplits(app);
  prepMedia(app);
  prepButtons(app);
  prepOdo(app);
  prepConverge(app);
}

/* ---------- the curtain ----------
   It sweeps down over the page, the next screen is built underneath
   while nothing can be seen, and then it keeps going the same way. */
function sigTransition(work){
  var c = document.getElementById('curtain');
  if(!USE_CURTAIN || !SIG.on || !c){ work(); return; }
  c.classList.remove('snap','lift');
  void c.offsetWidth;
  c.classList.add('cover');
  SIG.gate = true;
  window.setTimeout(function(){
    work();                                   /* new screen, scrolled to top */
    window.setTimeout(function(){
      c.classList.remove('cover');
      c.classList.add('lift');
      SIG.gate = false;
      sigPlayPending();
      window.setTimeout(function(){
        c.classList.add('snap');
        c.classList.remove('lift');
        void c.offsetWidth;
        c.classList.remove('snap');
      }, 440);
    }, 80);
  }, 340);
}

/* ---------- the mark, before any of it ---------- */
function introLogo(size){
  return '<svg viewBox="288 252 500 462" width="'+size+'" style="display:block;overflow:visible" role="img" aria-label="'+STUDIO+'">'+
    '<rect x="250" y="250" width="540" height="470" fill="var(--frost-white)" mask="url(#diaLogoMask)"></rect></svg>';
}

function sigBoot(){
  var intro = document.getElementById('intro');
  var mark  = document.getElementById('curtainMark');
  if(mark) mark.innerHTML = introLogo(74);

  if(!intro) { SIG.gate = false; return; }
  if(!SIG.on){
    intro.parentNode.removeChild(intro);
    SIG.gate = false;
    return;
  }

  document.documentElement.classList.add('sig-boot');
  var host = document.getElementById('introMark');
  if(host) host.innerHTML = introLogo(Math.min(300, Math.round(window.innerWidth * 0.46)));

  var seen = false;
  try{ seen = window.sessionStorage.getItem('dia-intro') === '1'; }catch(e){}
  var hold = seen ? 300 : 1250;               /* once a visit, then briefly */
  var num  = document.getElementById('introNum');
  var t0   = Date.now();

  window.requestAnimationFrame(function(){
    intro.classList.add('go');
    if(seen) intro.style.transitionDuration = '.38s';
  });

  /* the count runs with the wipe, and lands on 100 as it finishes */
  (function tick(){
    var p = Math.min(1, (Date.now() - t0) / hold);
    if(num) num.textContent = (p < 1 ? (p * 100 < 10 ? '0' : '') + Math.floor(p * 100) : '100');
    if(p < 1) window.requestAnimationFrame(tick);
  })();

  function leave(){
    intro.classList.add('out');
    document.documentElement.classList.remove('sig-boot');
    try{ window.sessionStorage.setItem('dia-intro','1'); }catch(e){}
    window.setTimeout(function(){
      SIG.gate = false;
      sigPlayPending();                        /* the hero arrives behind it */
      window.setTimeout(sigSettle, 120);       /* and nothing is left waiting */
    }, 130);
    window.setTimeout(function(){
      if(intro.parentNode) intro.parentNode.removeChild(intro);
    }, 760);
  }

  /* it waits for the typeface and for nothing else — a slow photograph
     further down the page is not a reason to hold the door shut */
  var done = false;
  function ready(){
    if(done) return; done = true;
    window.setTimeout(leave, Math.max(0, hold - (Date.now() - t0)));
  }
  try{
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(ready);
  }catch(e){}
  window.setTimeout(ready, hold + 260);
}

/* ---------- the reel answers a thumb ----------
   A flick across the frame moves to the next film, exactly as the
   arrows do. A vertical drag is left alone so the page still scrolls,
   and the flick itself never counts as a tap on the film.          */
var lastSwipe = 0;

function initReelSwipe(){
  var x0 = null, y0 = null, moved = false;

  document.addEventListener('touchstart', function(e){
    var host = e.target && e.target.closest ? e.target.closest('.reel') : null;
    if(!host || e.touches.length !== 1){ x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; moved = false;
  }, {passive:true});

  document.addEventListener('touchmove', function(e){
    if(x0 === null || e.touches.length !== 1) return;
    var dx = e.touches[0].clientX - x0, dy = e.touches[0].clientY - y0;
    if(Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) moved = true;
  }, {passive:true});

  document.addEventListener('touchend', function(e){
    if(x0 === null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if(!moved || Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
    lastSwipe = Date.now();
    S.reel = (S.reel + (dx < 0 ? 1 : -1) + WORK.length) % WORK.length;
    render(true);
  }, {passive:true});

  /* a flick must not also open the film */
  document.addEventListener('click', function(e){
    if(Date.now() - lastSwipe > 500) return;
    if(e.target && e.target.closest && e.target.closest('.reel')){
      e.preventDefault(); e.stopPropagation();
    }
  }, true);
}

/* the chip for the film you are on stays in sight as the strip scrolls */
function syncReelStrip(){
  var strip = document.querySelector('.reel-dots');
  if(!strip || strip.scrollWidth <= strip.clientWidth + 4) return;
  var on = strip.querySelector('.dot[aria-pressed="true"]');
  if(!on) return;
  var left = on.offsetLeft - strip.clientWidth / 2 + on.offsetWidth / 2;
  try{ strip.scrollTo({left:Math.max(0, left), behavior:'smooth'}); }
  catch(e){ strip.scrollLeft = Math.max(0, left); }
}

/* ---------- called after every render ---------- */
function motionAfterRender(routeChanged){
  SIG.anim = !!routeChanged;
  bindSignature(routeChanged);
  if(!SIG.on) prepTone(document.getElementById('app'));
  bindReveal();
  bindParallax();
  prepCycle(document.getElementById('app'));
  bindCollage();
  bindStack();
  window.setTimeout(sigSettle, 80);
  syncReelStrip();
  if(routeChanged && !REDUCED && !(SIG.on && USE_CURTAIN)){
    var app = document.getElementById('app');
    app.classList.remove('page-in');
    void app.offsetWidth;                           /* restart the animation */
    app.classList.add('page-in');
  }
}

window.addEventListener('scroll', onScroll, {passive:true});
window.addEventListener('resize', function(){ bindParallax(); bindCollage(); layoutStack(); }, {passive:true});
initReveal();
initNavLift();
initCursor();
initReelSwipe();
sigInit();
if(SIG.on) document.documentElement.classList.add('sig');

initBackend();
render();
sigBoot();
})();
</script>
