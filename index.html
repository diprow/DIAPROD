/* ============================== BACKEND / AUTH ==============================
   Supabase does the real work now. Google Identity Services still renders
   the button, but the token it produces is handed to Supabase, which
   verifies it against Google and issues a session. Every read and write
   below goes through row-level security, so what a visitor can see is
   decided by the database, not by this file.                             */

var sb = null;

function backendReady(){ return !!sb; }

function initBackend(){
  if(sb || !window.supabase || !SUPABASE_URL || !SUPABASE_ANON_KEY) return;
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false }
  });
  sb.auth.onAuthStateChange(function(evt, session){ applySession(session); });
  sb.auth.getSession().then(function(r){
    applySession(r && r.data ? r.data.session : null);
  });
}

function applySession(session){
  var u = session && session.user;
  if(u){
    var m = u.user_metadata || {};
    var name = m.full_name || m.name || (u.email || '').split('@')[0];
    S.user = {
      id: u.id,
      email: u.email || '',
      name: name,
      given: (m.given_name || name || '').split(' ')[0],
      picture: m.avatar_url || m.picture || ''
    };
    if(!S.draft.name)  S.draft.name  = S.user.name;
    if(!S.draft.email) S.draft.email = S.user.email;
    loadMyBriefs();
  } else {
    S.user = null; S.briefs = [];
    if(S.route === 'account') S.route = 'home';
  }
  render(true);
}

/* ---------- sign in / out ---------- */
function onGoogleCredential(resp){
  if(!sb){ S.authError = t().siBackend; render(true); return; }
  S.authBusy = true; S.authError = ''; render(true);
  sb.auth.signInWithIdToken({ provider:'google', token: resp && resp.credential })
    .then(function(r){
      S.authBusy = false;
      if(r.error){ S.authError = r.error.message || t().siError; render(true); return; }
      /* back to whatever they were trying to do before the sign-in gate */
      S.route = S.afterSignin || 'account';
      S.afterSignin = null;
      S.menu = false; render();
    })
    .catch(function(e){
      S.authBusy = false; S.authError = (e && e.message) || t().siError; render(true);
    });
}

function signOut(){
  try{ if(window.google && google.accounts) google.accounts.id.disableAutoSelect(); }catch(e){}
  gsiReady = false;
  S.draft.name = ''; S.draft.email = '';
  if(sb) sb.auth.signOut();
  S.user = null; S.briefs = [];
  S.route = 'home'; S.menu = false;
  render();
}

/* ---------- reading ---------- */
var BRIEF_COLS = '*, brief_events(id,stage,note,created_at), brief_files(id,name,path,size,mime)';

function loadMyBriefs(){
  if(!sb || !S.user) return;
  S.loadingBriefs = true;
  sb.from('briefs').select(BRIEF_COLS).order('created_at', {ascending:false})
    .then(function(r){
      S.loadingBriefs = false;
      S.briefs = (r.data || []).map(normaliseBrief);
      S.dataError = r.error ? r.error.message : '';
      render(true);
    });
}

function normaliseBrief(b){
  b.brief_events = (b.brief_events || []).sort(function(x, y){
    return new Date(x.created_at) - new Date(y.created_at);
  });
  b.brief_files = b.brief_files || [];
  return b;
}

/* ---------- tracking by reference, no account needed ---------- */
function trackLookup(){
  var ref = (S.lookup || '').trim().toUpperCase();
  if(!sb || ref.length < 4){ S.trackResult = null; S.trackDone = false; render(true); return; }
  S.trackBusy = true; render(true);
  sb.rpc('track_brief', { p_ref: ref }).then(function(r){
    S.trackBusy = false; S.trackDone = true;
    S.trackResult = (r.data && r.data.length) ? r.data[0] : null;
    render(true);
  });
}

/* ---------- sending a brief ---------- */
function submitBrief(){
  if(!sb){ S.dataError = t().siBackend; render(true); return; }
  if(S.saving) return;
  S.saving = true; S.dataError = ''; render(true);

  var d = S.draft;

  /* Goes through the submit_brief RPC rather than a plain insert on purpose.
     `briefs` gives anon no SELECT policy — correctly, a visitor must not be able to
     read the table — and Postgres applies that policy to INSERT ... RETURNING too.
     A plain .insert().select() therefore fails for a signed-out visitor *after* the
     row is saved, so they would see an error and never get their reference.
     The RPC saves the row and hands back only the id and the reference. */
  sb.rpc('submit_brief', {
    p_name: d.name.trim(), p_email: d.email.trim(),
    p_phone: d.phone.trim(), p_company: d.company.trim(),
    p_type: [d.format, d.type, d.other, d.note].filter(Boolean).join(' — '), p_deliverables: d.deliverables,
    p_budget: d.budget, p_timeline: d.timeline,
    p_shoot_date: d.date || null,
    p_location: d.location.trim(), p_remote: !!d.remote,
    p_brief: d.brief.trim()
  })
    .then(function(r){
      if(r.error) throw r.error;
      var saved = Array.isArray(r.data) ? r.data[0] : r.data;
      if(!saved || !saved.ref) throw new Error(t().rqFailed);
      return uploadFiles(saved).then(function(){ return saved; });
    })
    .then(function(saved){
      /* The brief is safe at this point and a database trigger already mails the
         studio, so nothing else has to happen here. */
      S.saving = false;
      S.submittedRef = saved.ref;
      S.files = [];
      if(S.user) loadMyBriefs();
      render();
    })
    .catch(function(e){
      S.saving = false;
      S.dataError = (e && e.message) || t().rqFailed;
      render(true);
    });
}

/* ---------- booking a call ---------- */
function submitCall(){
  if(!sb){ S.callError = t().siBackend; render(true); return; }
  if(S.callBusy) return;
  if(S.slot === '' || !S.callName.trim() || !S.callEmail.trim()) return;
  S.callBusy = true; S.callError = ''; render(true);

  var i = Number(S.slot);
  var when = nextSlotDate(i);

  /* Same reason as submitBrief: through the RPC, so a signed-out visitor
     still gets their CAL- reference back. */
  sb.rpc('book_call', {
    p_name: S.callName.trim(),
    p_email: S.callEmail.trim(),
    p_topic: 'Intro call booked from the site',
    p_channel: 'Google Meet',
    p_slot_date: when ? when.date : null,
    p_slot_time: when ? when.time : '',
    p_timezone: STUDIO_TZ,
    p_message: 'Slot picked on the site: ' + (SLOTS[i] || '')
  })
    .then(function(r){
      if(r.error) throw r.error;
      var ref = Array.isArray(r.data) ? r.data[0] : r.data;
      if(!ref) throw new Error(t().rqFailed);
      /* a database trigger mails the studio; nothing else to do here */
      S.callBusy = false;
      S.callRef = ref;
      S.callBooked = true;
      render();
    })
    .catch(function(e){
      S.callBusy = false;
      S.callError = (e && e.message) || t().rqFailed;
      render(true);
    });
}

function safeName(n){
  return String(n || 'file').normalize('NFKD')
    .replace(/[^\w.\- ]+/g, '').replace(/\s+/g, '-').slice(-80) || 'file';
}

function uploadFiles(saved){
  /* attachments need an account, so the bucket is never open to the public */
  if(!S.user || !S.files.length) return Promise.resolve();
  var rows = [];
  var chain = S.files.reduce(function(p, f, i){
    return p.then(function(){
      var path = S.user.id + '/' + saved.ref + '/' + i + '-' + safeName(f.name);
      return sb.storage.from(BUCKET).upload(path, f, {upsert:false, contentType:f.type || undefined})
        .then(function(up){
          if(up.error) return;                      /* skip the file, keep the brief */
          rows.push({ brief_id:saved.id, user_id:S.user.id, path:path,
                      name:f.name, size:f.size || 0, mime:f.type || '' });
        });
    });
  }, Promise.resolve());
  return chain.then(function(){
    return rows.length ? sb.from('brief_files').insert(rows) : null;
  });
}

function openFile(path){
  if(!sb) return;
  sb.storage.from(BUCKET).createSignedUrl(path, 120).then(function(r){
    if(r.data && r.data.signedUrl) window.open(r.data.signedUrl, '_blank', 'noopener');
  });
}

/* ---------- the Google button ---------- */
var gsiReady = false, gsiWaiting = false;
function whenGoogle(cb){
  if(window.google && google.accounts && google.accounts.id){ cb(); return; }
  if(gsiWaiting) return;
  gsiWaiting = true;
  var tries = 0;
  var iv = setInterval(function(){
    if(window.google && google.accounts && google.accounts.id){
      clearInterval(iv); gsiWaiting = false; cb();
    } else if(++tries > 100){          /* ~10s — blocked or offline */
      clearInterval(iv); gsiWaiting = false;
      S.authError = t().siBlocked; render(true);
    }
  }, 100);
}

function mountGoogle(){
  var slot = document.getElementById('gsi-slot');
  if(!slot || !GOOGLE_CLIENT_ID || S.user) return;
  whenGoogle(function(){
    var el = document.getElementById('gsi-slot');
    if(!el) return;
    if(!gsiReady){
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: onGoogleCredential,
        auto_select: false,
        cancel_on_tap_outside: true,
        use_fedcm_for_prompt: true,
        context: 'signin',
        ux_mode: 'popup'
      });
      gsiReady = true;
    }
    el.innerHTML = '';
    google.accounts.id.renderButton(el, {
      type:'standard', theme:'filled_black', size:'large',
      text:'continue_with', shape:'pill', logo_alignment:'left',
      locale: S.lang === 'it' ? 'it' : 'en-GB',
      width: Math.min(360, Math.max(200, el.clientWidth || 320))
    });
  });
}

/* ===================== GENERATED FILM STILLS =====================
   Monochrome placeholder frames, deterministic per project, drawn on
   canvas — high-contrast B&W so colour stays functional punctuation.  */
var stillCache = {};
function hash(str){ var h=2166136261; for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function rng(seed){ var a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; var x=Math.imul(a^a>>>15,1|a); x=x+Math.imul(x^x>>>7,61|x)^x; return ((x^x>>>14)>>>0)/4294967296; }; }

function still(key, w, h){
  var ck = key+'@'+w+'x'+h;
  if(stillCache[ck]) return stillCache[ck];
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  var x = c.getContext('2d');
  var r = rng(hash(key));

  // backdrop
  x.fillStyle = '#16161a'; x.fillRect(0,0,w,h);

  // key light — broad, bright wash
  var lx = (0.2 + r()*0.6)*w, ly = (0.12 + r()*0.44)*h;
  var g = x.createRadialGradient(lx, ly, 0, lx, ly, w*(0.62 + r()*0.45));
  g.addColorStop(0, 'rgba(255,255,255,'+(0.82 + r()*0.16).toFixed(2)+')');
  g.addColorStop(0.3, 'rgba(228,228,232,0.44)');
  g.addColorStop(0.68, 'rgba(150,150,158,0.16)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0,0,w,h);

  // silhouettes — near-black masses read as figures against the light
  var masses = 2 + Math.floor(r()*3);
  for(var i=0;i<masses;i++){
    x.save();
    x.filter = 'blur(' + (1 + r()*7).toFixed(1) + 'px)';
    var tone = Math.floor(4 + r()*22);
    x.fillStyle = 'rgba('+tone+','+tone+','+(tone+4)+',' + (0.78 + r()*0.22).toFixed(2) + ')';
    var mode = r();
    if(mode < 0.4){
      var bw = w*(0.12 + r()*0.26), bh = h*(0.42 + r()*0.7);
      x.fillRect(r()*w - bw*0.4, h - bh*(0.6 + r()*0.45), bw, bh);
    } else if(mode < 0.8){
      x.beginPath();
      x.ellipse(r()*w, h*(0.55 + r()*0.6), w*(0.09+r()*0.2), h*(0.24+r()*0.46), (r()-0.5)*0.8, 0, Math.PI*2);
      x.fill();
    } else {
      x.beginPath();
      var y0 = h*(0.58 + r()*0.3);
      x.moveTo(0, y0);
      x.lineTo(w*(0.28+r()*0.44), y0 - h*(0.12+r()*0.26));
      x.lineTo(w, y0 + h*0.08);
      x.lineTo(w, h); x.lineTo(0, h); x.closePath(); x.fill();
    }
    x.restore();
  }

  // rim light along an edge
  x.save();
  x.filter = 'blur(' + (1 + r()*4).toFixed(1) + 'px)';
  x.fillStyle = 'rgba(255,255,255,' + (0.3 + r()*0.4).toFixed(2) + ')';
  if(r() > 0.5){ x.fillRect(0, h*(0.24 + r()*0.5), w, 1 + r()*2.5); }
  else { x.fillRect(w*(0.16 + r()*0.66), 0, 1 + r()*2.5, h); }
  x.restore();

  // grain
  var img = x.getImageData(0,0,w,h), d = img.data;
  for(var p=0;p<d.length;p+=4){
    var n = (r()-0.5)*15;
    d[p]=clamp(d[p]+n); d[p+1]=clamp(d[p+1]+n); d[p+2]=clamp(d[p+2]+n);
  }
  x.putImageData(img,0,0);

  // vignette
  var v = x.createRadialGradient(w/2,h/2,Math.min(w,h)*0.3,w/2,h/2,Math.max(w,h)*0.8);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,0.6)');
  x.fillStyle = v; x.fillRect(0,0,w,h);

  var url = c.toDataURL('image/jpeg', 0.82);
  stillCache[ck] = url;
  return url;
}
function clamp(v){ return v<0?0:v>255?255:v; }

/* ============================== HELPERS ============================== */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}
function logo(size, color){
  return '<svg viewBox="255 248 528 372" width="'+size+'" style="display:block;overflow:visible" role="img" aria-label="'+STUDIO+'">'+
    '<rect x="250" y="250" width="540" height="470" fill="'+color+'" mask="url(#diaLogoMask)"></rect></svg>';
}
/* the same mark as the brand, cropped to the camera alone — the
   drawn name underneath it has no business inside a 44px button */
function camMark(size, color){
  return '<svg viewBox="291 257 490 350" width="'+size+'" style="display:block" aria-hidden="true">'+
    '<rect x="285" y="251" width="502" height="362" fill="'+color+'" mask="url(#diaLogoMask)"></rect></svg>';
}
function workById(id){ for(var i=0;i<WORK.length;i++){ if(WORK[i].id===id) return WORK[i]; } return null; }
function workTag(w){ return S.lang==='it' ? w.tagIt : w.tagEn; }
function accentClass(a){ return a==='violet' ? ' violet' : a==='teal' ? ' teal' : ''; }
function pad(n){ return (n<10?'0':'')+n; }
function unusedNewRef(){   /* references are issued by the database now */
  var chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s='';
  for(var i=0;i<4;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return 'DIA-'+s;
}
function fmtDate(iso){
  var d = new Date(iso);
  return d.toLocaleDateString(S.lang==='it'?'it-IT':'en-GB', {day:'2-digit', month:'short', year:'numeric'});
}

/* ============================== NAV / FOOTER ============================== */
var ROUTES = [
  {id:'work', key:'navWork'},
  {id:'packages', key:'navPackages'},
  {id:'track', key:'navTrack'},
  {id:'call', key:'navCall'},
  {id:'signin', key:'navSignin'}
];

function renderNav(){
  var L = t();
  var routes = ROUTES;
  var links = routes.map(function(r){
    /* signed in: the Sign in link becomes the account chip */
    if(r.id === 'signin' && S.user){
      var u = S.user;
      return '<button class="acct-chip" data-go="account"'+(S.route==='account'?' aria-current="page"':'')+
        ' title="'+esc(u.email)+'">'+avatar(u)+'<span>'+esc(u.given || u.name)+'</span></button>';
    }
    return '<button class="navlink" data-go="'+r.id+'"'+(S.route===r.id?' aria-current="page"':'')+'>'+esc(L[r.key])+'</button>';
  }).join('');
  document.getElementById('nav').innerHTML =
    '<button class="brand" data-go="home" aria-label="'+STUDIO+' — home">'+logo(26,'var(--frost-white)')+
      '<span class="brand-name">'+STUDIO+'</span></button>'+
    '<div class="navlinks"><span class="nav-pill" id="navPill" aria-hidden="true"></span>'+links+'</div>'+
    '<div style="display:flex;align-items:center;gap:8px">'+
      '<div class="langbox" role="group" aria-label="Language">'+
        '<button class="langbtn" data-lang="en" aria-pressed="'+(S.lang==='en')+'">EN</button>'+
        '<button class="langbtn" data-lang="it" aria-pressed="'+(S.lang==='it')+'">IT</button>'+
      '</div>'+
      '<button class="btn btn-cta" data-go="request">'+esc(L.start)+'</button>'+
      '<button class="burger" id="burger" data-menu="t" aria-controls="sheet"'+
        ' aria-expanded="'+(S.menu?'true':'false')+'" aria-label="Menu">'+
        '<span class="burger-lines" aria-hidden="true"><i></i><i></i></span>'+
        '<span class="burger-mark">'+camMark(26,'currentColor')+'</span>'+
      '</button>'+
    '</div>';
  syncNavPill(true);
}

function renderSheet(){
  var L = t(), el = document.getElementById('sheet');
  el.hidden = false;
  var sheetRoutes = ROUTES;
  var links = [{id:'home', key:'navHome'}].concat(sheetRoutes).map(function(r){
    if(r.id === 'signin' && S.user) return '';   /* replaced by the account row below */
    return '<button data-go="'+r.id+'"'+(S.route===r.id?' aria-current="page"':'')+'>'+esc(L[r.key])+'</button>';
  }).join('');
  var acct = S.user
    ? '<button class="sheet-acct" data-go="account" style="background:none;border:none;cursor:pointer;width:100%;text-align:left">'+
        avatar(S.user)+'<span style="display:flex;flex-direction:column;gap:2px;min-width:0">'+
        '<span style="color:var(--frost-white)">'+esc(S.user.name)+'</span>'+
        '<span class="small" style="overflow-wrap:anywhere">'+esc(S.user.email)+'</span></span></button>'
    : '';
  var out = S.user
    ? '<button class="btn-line" data-signout="1" style="width:100%;margin-top:12px">'+esc(L.acSignout)+'</button>'
    : '';
  el.innerHTML =
    '<div class="sheet-links">'+acct+links+'</div>'+
    '<div class="sheet-foot">'+
      '<div class="sheet-lang"><div class="langbox" role="group" aria-label="Language">'+
        '<button class="langbtn" data-lang="en" aria-pressed="'+(S.lang==='en')+'">EN</button>'+
        '<button class="langbtn" data-lang="it" aria-pressed="'+(S.lang==='it')+'">IT</button>'+
      '</div></div>'+
      '<button class="btn btn-cta btn-lg" data-go="request">'+esc(L.start)+'</button>'+out+'</div>';
  syncMenu();
}

/* one class on <html> does the whole thing: the lines become the camera and
   the names come up underneath. Nothing here redraws the bar, so the change
   is something you watch rather than something that jumps. */
function syncMenu(){
  document.documentElement.classList.toggle('menu-open', !!S.menu);
  var b = document.getElementById('burger');
  if(b) b.setAttribute('aria-expanded', S.menu ? 'true' : 'false');
}
function measureNav(){
  var nav = document.getElementById('nav');
  if(nav) document.documentElement.style.setProperty('--nav-h', Math.round(nav.getBoundingClientRect().bottom) + 'px');
}
function setMenu(open){
  S.menu = !!open;
  if(S.menu) measureNav();
  renderSheet();
}
window.addEventListener('resize', function(){ if(S.menu) measureNav(); });

/* ============================== SCREENS ============================== */
function screenHome(){
  var L = t();

  /* The hero photograph comes in as two halves that meet in the middle.
     Each half carries the whole frame and shows only its own side, so
     what lands is one picture with no seam down it. */
  var plate = '<span class="hero-plate" data-px style="'+stillStyle(HERO,'hero-dia',900,506)+'"></span>';

  var hero =
  '<section class="stage hero-band">'+
    '<div class="hero-half hh-l" data-converge>'+plate+'</div>'+
    '<div class="hero-half hh-r" data-converge>'+plate+'</div>'+
    '<div class="hero-vignette"></div>'+
    '<div class="wrap"><div class="hero-copy">'+
      '<p class="eyebrow">'+esc(L.heroEyebrow)+'</p>'+
      '<h1 class="hero-type" data-dim="'+L.heroDim+'">'+esc(L.heroTitle)+'</h1>'+
      '<div class="hero-actions">'+
        '<button class="btn btn-cta" data-go="request">'+esc(L.start)+'</button>'+
      '</div>'+
      '<p class="hero-note">'+esc(L.heroNote)+'</p>'+
    '</div></div>'+
  '</section>';

  /* The arrangement the pile opens into. Each frame carries where it
     ends up (fx, fy from the middle of the stage, width, proportion),
     which frame sits over which, and how far it turns and pushes back
     on the way there. The turning is script-driven from the scroll;
     these are only the two ends of it. */
  /* Where each frame ends up, how deep it rests — depth, not z-index,
     decides what covers what, so a frame that comes forward genuinely
     passes in front of its neighbour — how far it turns and pushes
     back while the pile is opening, and which frame it trades places
     with in the middle act. `pair` points at the other frame; `dir`
     says which of the two comes forward on the way past. */
  var CG = [
    {i:1, fx:'-24%', fy:'-7%',  w:'17%', ar:'1/1',   bz:  14, ry: 20, rz:-3, tz:-180, pair:5, dir: 1},
    {i:6, fx:'-14%', fy:'3%',   w:'13%', ar:'3/4',   bz:  -8, ry: 26, rz: 2, tz:-300, pair:4, dir: 1},
    {i:4, fx:'4%',   fy:'-25%', w:'19%', ar:'16/10', bz: -34, ry: -7, rz: 1, tz:-360, pair:7, dir: 1},
    {i:0, fx:'-1%',  fy:'-2%',  w:'24%', ar:'4/5',   bz:  68, ry:-10, rz: 0, tz: 120, pair:6, dir: 1},
    {i:8, fx:'17%',  fy:'-11%', w:'16%', ar:'3/4',   bz: -56, ry:-28, rz:-2, tz:-320, pair:1, dir:-1},
    {i:2, fx:'24%',  fy:'7%',   w:'23%', ar:'4/3',   bz:  40, ry:-20, rz: 2, tz:-120, pair:0, dir:-1},
    {i:5, fx:'-15%', fy:'21%',  w:'21%', ar:'3/4',   bz:  22, ry: 14, rz:-2, tz: -60, pair:3, dir:-1},
    {i:9, fx:'7%',   fy:'27%',  w:'14%', ar:'1/1',   bz:  -4, ry:  5, rz: 3, tz:-200, pair:2, dir:-1}
  ];

  var cards = CG.map(function(c){
    var it = WORK[c.i] || WORK[0];
    return '<span class="cg-slot" style="--fx:'+c.fx+';--fy:'+c.fy+';--w:'+c.w+'"'+
      ' data-ry="'+c.ry+'" data-rz="'+c.rz+'" data-tz="'+c.tz+'"'+
      ' data-bz="'+c.bz+'" data-pair="'+c.pair+'" data-dir="'+c.dir+'">'+
      '<button class="cg-card" style="--ar:'+c.ar+'" data-open="'+it.id+'"'+
        ' aria-label="'+esc(it.title)+'">'+
        '<span class="cg-still" style="'+stillStyle(it,'cg-'+c.i,760,760)+'"></span>'+
      '</button>'+
    '</span>';
  }).join('');

  var reel =
  '<section class="stage"><div class="wrap" style="padding-top:0">'+
    '<div class="cg-track" data-cgtrack><div class="cg-pin">'+
      '<div class="sec-head">'+
        '<div class="stack"><p class="kicker">'+esc(L.workKicker)+'</p>'+
          '<h2 class="display-type">'+esc(L.workTitle)+'</h2></div>'+
        '<button class="linky" data-go="work">'+esc(L.workAll)+' &rsaquo;</button>'+
      '</div>'+
      '<div class="collage" data-collage>'+cards+'</div>'+
    '</div></div>'+
  '</div></section>';

  var awards =
  '<section class="frost"><div class="wrap band">'+
    '<p class="kicker">'+esc(L.awardsKicker)+'</p>'+
    '<h2 class="display-type" style="margin:16px 0 40px;max-width:16ch">'+esc(L.awardsTitle)+'</h2>'+
    '<ul class="awards-list">'+AWARDS.map(function(a){
      return '<li style="list-style:none"><span class="h-md">'+esc(a.name)+'</span><span class="award-year tnum">'+a.year+'</span></li>';
    }).join('')+'</ul>'+
  '</div></section>';

  var cases =
  '<section class="light"><div class="wrap" style="padding-top:var(--band)">'+
    '<p class="eyebrow">'+esc(L.casesKicker)+'</p>'+
    '<h2 class="display-type" data-dim="'+L.casesDim+'" style="margin:16px 0 12px;max-width:18ch">'+esc(L.casesTitle)+'</h2>'+
    '<p class="body-copy">'+esc(L.casesSub)+'</p>'+
    CASES.map(function(cs){
      var wk = workById(cs.workId);
      return '<article class="case">'+
        '<button class="case-media" data-open="'+cs.workId+'" aria-label="'+esc(cs.client)+'" data-cursor="'+esc(L.curView)+'">'+
          '<span class="case-still" data-px style="'+stillStyle(wk,cs.workId,720,540)+'"></span>'+
        '</button>'+
        '<div class="case-body">'+
          '<p class="eyebrow'+accentClass(cs.accent)+'">'+esc(S.lang==='it'?cs.catIt:cs.catEn)+'</p>'+
          '<h3 class="display-type">'+esc(S.lang==='it'?(cs.clientIt||cs.client):cs.client)+'</h3>'+
          '<p class="body-copy" style="max-width:46ch">'+esc(S.lang==='it'?cs.it:cs.en)+'</p>'+
          '<div class="metric"><b>'+esc(cs.metric)+'</b>'+
            '<span class="small">'+esc(S.lang==='it'?cs.lIt:cs.lEn)+'</span></div>'+
          '<button class="linky" data-go="'+(cs.goTo||'packages')+'" style="margin-top:8px">'+
            esc(S.lang==='it'?(cs.linkIt||L.viewCase):(cs.linkEn||L.viewCase))+' &rsaquo;</button>'+
        '</div>'+
      '</article>';
    }).join('')+
  '</div></section>';

  /* ---------- the band that runs to the edges ----------
     One photograph at the full width of the screen, a single word
     turning over on the centre line, and the studio's sentence in
     the corner under it. The list of words is the studio's own
     subjects, so the line is never decoration alone. */
  var cyc = L.manWords.concat([L.manWords[0]]).map(function(word){
    return '<span class="cyc-d">'+esc(word)+'</span>';
  }).join('');

  var manifesto =
  '<section class="manifesto">'+
    '<div class="man-still" data-px style="'+stillStyle(WORK[8],'man-dia',1280,720)+'"></div>'+
    '<div class="man-scrim"></div>'+
    '<p class="man-word"><span class="cyc" data-cyc><span class="cyc-r">'+cyc+'</span></span></p>'+
    '<div class="wrap man-foot"><div>'+
      '<p class="eyebrow">'+esc(L.manKicker)+'</p>'+
      '<p>'+esc(L.manBody)+'</p>'+
    '</div></div>'+
  '</section>';

  /* ---------- the numbers, each under a rule that draws itself ----------
     The same three figures that used to sit under the hero, given
     the room to be read one at a time. They roll up to their value
     as the rule above them finishes crossing the page. */
  var ledRows = [
    [L.metaYearsV, L.metaYears],
    [L.metaDeliveredV, L.metaDelivered],
    [L.metaReplyV, L.metaReply],
    [String(AWARDS.length), L.ledgerAwards]
  ].map(function(row){
    return '<div class="led">'+
      '<span class="led-rule" aria-hidden="true"></span>'+
      '<span class="led-n"><b>'+esc(row[0])+'</b>'+
        '<span class="led-dot" aria-hidden="true"><i></i></span></span>'+
      '<p class="led-l">'+esc(row[1])+'</p>'+
    '</div>';
  }).join('');

  var ledger =
  '<section class="stage"><div class="wrap band">'+
    '<p class="kicker">'+esc(L.ledgerKicker)+'</p>'+
    '<h2 class="display-type" data-dim="'+L.ledgerDim+'" style="margin:16px 0 0;max-width:14ch">'+esc(L.ledgerTitle)+'</h2>'+
    '<div class="ledger">'+ledRows+'</div>'+
  '</div></section>';

  /* ---------- and one line of type that never stops ---------- */
  var marqOnce = L.marqWords.map(function(word, i){
    return '<span'+(i % 2 ? ' class="dim"' : '')+'>'+esc(word)+'</span>';
  }).join('');

  var closing =
  '<section class="stage"><div class="wrap band">'+
    '<div class="closing">'+
      '<p class="kicker">'+esc(L.rqKicker)+'</p>'+
      '<h2 class="hero-type" data-dim="'+L.closeDim+'" style="max-width:16ch">'+esc(L.closeTitle)+'</h2>'+
      '<p class="body-copy" style="max-width:48ch">'+esc(L.closeSub)+'</p>'+
      '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px">'+
        '<button class="btn btn-cta btn-lg" data-go="request">'+esc(L.start)+'</button>'+
        '<button class="btn btn-outline btn-lg" data-go="call">'+esc(L.bookCall)+'</button>'+
      '</div>'+
    '</div>'+
  '</div>'+
  '<div class="marq" aria-hidden="true"><span class="marq-t">'+marqOnce+marqOnce+'</span></div>'+
  '</section>';

  return hero + reel + manifesto + ledger + awards + cases + closing;
}

/* one brief's four-stage rail */
function stageRail(stage){
  return '<div class="stages">'+STAGES.map(function(s, i){
    return '<div class="stage-step" data-on="'+(i<=stage?1:0)+'"><div class="rail"></div>'+
      '<span>'+esc(S.lang==='it'?s.it:s.en)+'</span></div>';
  }).join('')+'</div>';
}

function stageBadge(stage){
  var st = STAGES[stage] || STAGES[0];
  return '<span class="status" data-done="'+(stage===3?1:0)+'"><i></i>'+
    esc(S.lang==='it'?st.it:st.en)+'</span>';
}

/* the client's view of one brief: header, rail, files, activity */
function jobCard(b){
  var L = t();
  var files = (b.brief_files || []).length
    ? '<div class="sub"><span class="kicker">'+esc(L.acFiles)+'</span><div class="filelist">'+
        b.brief_files.map(function(f){
          return '<button class="filechip" data-file="'+esc(f.path)+'">'+esc(f.name)+
            '<span>'+fmtSize(f.size)+'</span></button>';
        }).join('')+'</div></div>'
    : '';

  var events = (b.brief_events || []).length

          return '<li><span class="dot"></span><div><p>'+label+'</p>'+
            '<span class="small tnum">'+esc(fmtDate(e.created_at))+'</span></div></li>';
        }).join('')+'</ol></div>'
    : '';

  return '<div class="job">'+
    '<div class="job-top">'+
      '<div style="display:flex;flex-direction:column;gap:4px">'+
        '<span class="h-md">'+esc(b.type || L.notSet)+'</span>'+

function fmtSize(n){
  n = Number(n) || 0;
  if(n < 1024) return n + ' B';
  if(n < 1048576) return Math.round(n/1024) + ' KB';
  return (n/1048576).toFixed(1) + ' MB';
}

function screenRequest(){

    '<p class="small" style="margin-top:20px">'+esc(L.guideNoteShort)+'</p>';

    var fmt = fmtByLabel(d.format);
    var list = fmt ? fmt.subjects : [];
    var sub1 = subjByLabel(fmt, d.type);

    body = '<div class="opt-grid">'+list.map(function(o, k){
      var lbl = S.lang==='it'?o.it:o.en;
      var rng = o.onRequest ? L.onRequest : o.range;
      return '<button class="opt" data-subject="'+k+'" aria-pressed="'+(d.type===lbl)+'">'+
        '<span class="mark"></span><span class="label"><b>'+esc(lbl)+'</b></span>'+
        '<span class="small tnum" style="margin-left:auto;white-space:nowrap">'+esc(rng)+'</span>'+
        '</button>';
    }).join('')+'</div>';

    if(sub1 && sub1.other){
      body += '<label class="field" style="margin-top:24px"><span>'+esc(L.otherLabel)+'</span>'+
        '<input class="input" id="other" data-input="other" value="'+esc(d.other)+'" '+
        'placeholder="'+esc(L.otherPlaceholder)+'" aria-label="'+esc(L.otherLabel)+'"></label>';
    }

    if(sub1){
      body += '<div class="notice" style="margin-top:32px">'+
        '<span class="kicker">'+esc(L.guidePrice)+'</span>'+
        '<b class="price tnum" style="font-size:var(--t-h-lg)">'+esc(sub1.onRequest ? L.onRequest : sub1.range)+'</b>'+
        '<p class="small">'+esc(L.guideNote)+'</p>'+
        '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px">'+
          '<button class="btn btn-cta" data-go="call">'+esc(L.bookCall)+'</button>'+
        '</div>'+
      '</div>';
    }
  } else if(i===2){
    body = '<div class="tagwrap">'+EXTRAS.map(function(o, k){
      var pr = S.lang==='it' ? (o.priceIt || o.price) : o.price;
      var lbl = (S.lang==='it'?o.it:o.en) + ' · ' + pr;
      return '<button class="tag" data-extra="'+k+'" aria-pressed="'+(d.deliverables.indexOf(lbl)>-1)+'">'+esc(lbl)+'</button>';
    }).join('')+'</div>'+
    '<p class="small" style="margin-top:16px">'+
      (d.deliverables.length ? d.deliverables.length+' '+esc(L.selected) : esc(L.extrasSkip))+'</p>';
  } else if(i===3){
    body = '<div class="opt-grid">'+TIMELINES.map(function(o, k){
      var lbl = S.lang==='it'?o.it:o.en;
      return '<button class="opt" data-timeline="'+k+'" aria-pressed="'+(d.timeline===lbl)+'">'+
        '<span class="mark"></span><span class="label"><b>'+esc(lbl)+'</b></span></button>';
    }).join('')+'</div>'+
    '<label class="field" style="margin-top:28px"><span>'+esc(L.targetDate)+' ('+esc(L.optional)+')</span>'+
    '<input class="input" id="date" type="date" data-input="date" value="'+esc(d.date)+'"></label>'+
    '<div style="display:flex;flex-direction:column;gap:16px;margin-top:28px">'+
      '<input class="input" id="location" data-input="location" value="'+esc(d.location)+'" placeholder="'+esc(L.locPlaceholder)+'" aria-label="'+esc(L.locPlaceholder)+'">'+
      '<button class="opt" data-remote="1" aria-pressed="'+(!!d.remote)+'"><span class="mark"></span>'+
      '<span class="label"><b>'+esc(L.remote)+'</b></span></button>'+
    '</div>';
  } else if(i===4){
    var chips = S.files.map(function(f, k){
      return '<span class="tag" style="cursor:default">'+esc(f.name)+' <span style="opacity:.6">'+fmtSize(f.size)+'</span>'+
        ' <button data-unfile="'+k+'" aria-label="Remove '+esc(f.name)+'" style="background:none;border:none;cursor:pointer;color:inherit;padding:0 0 0 6px">&times;</button></span>';
    }).join('');
    var picker = S.user
      ? '<label class="opt" style="cursor:pointer"><span class="mark" style="border-radius:8px"></span>'+
          '<span class="label"><b>'+esc(L.refs)+'</b><span class="small">'+esc(L.refsHint)+'</span></span>'+
          '<input type="file" id="files" multiple style="display:none" data-files="1"></label>'
      : '<button class="opt" data-go="signin"><span class="mark" style="border-radius:8px"></span>'+
          '<span class="label"><b>'+esc(L.refs)+'</b><span class="small">'+esc(L.rqSignedFiles)+'</span></span></button>';
    body = '<div style="display:flex;flex-direction:column;gap:16px">'+
      '<textarea class="input" id="brief" rows="6" data-input="brief" placeholder="'+esc(L.briefPlaceholder)+'" aria-label="'+esc(L.refs)+'">'+esc(d.brief)+'</textarea>'+
      picker +
      (chips ? '<div class="tagwrap">'+chips+'</div>' : '')+
    '</div>';
  } else if(i===5){
    body = '<div style="display:flex;flex-direction:column;gap:16px">'+
      '<input class="input" id="name" data-input="name" value="'+esc(d.name)+'" placeholder="'+esc(L.fullName)+'" aria-label="'+esc(L.fullName)+'">'+
      '<input class="input" id="email" type="email" data-input="email" value="'+esc(d.email)+'" placeholder="'+esc(L.email)+'" aria-label="'+esc(L.email)+'">'+
      '<input class="input" id="phone" type="tel" data-input="phone" value="'+esc(d.phone)+'" placeholder="'+esc(L.phone)+' ('+esc(L.optional)+')" aria-label="'+esc(L.phone)+'">'+
      '<input class="input" id="company" data-input="company" value="'+esc(d.company)+'" placeholder="'+esc(L.company)+' ('+esc(L.optional)+')" aria-label="'+esc(L.company)+'">'+
    '</div>';
  } else {
    var rows = [
      [L.lFormat, d.format + (d.note ? '  ·  ' + d.note : ''), 0],
      [L.lType, d.type + (d.other ? ' — ' + d.other : ''), 1],
      [L.lBudget, d.budget, 1],
      [L.lDeliverables, d.deliverables.join(', '), 2],
      [L.lTimeline, d.timeline + (d.date ? ' · ' + d.date : ''), 3],
      [L.lLocation, d.remote ? L.remote : d.location, 3],
      [L.lBrief, d.brief, 4],
      [L.lContact, [d.name, d.email, d.phone, d.company].filter(Boolean).join(' · '), 5]
    ].map(function(r){
      return '<button class="review-row" data-step="'+r[2]+'">'+
        '<span class="rv"><b>'+esc(r[0])+'</b><span>'+esc(r[1] || L.notSet)+'</span></span>'+
        '<span class="edit">'+esc(L.edit)+'</span></button>';
    }).join('');
    body = '<div class="review">'+rows+'</div>';
  }

  var canGo = stepReady(i);
  var last = i === STEP_COUNT - 1;
  var pct = Math.round(((i) / (STEP_COUNT - 1)) * 100);

  return '<section class="stage"><div class="wrap band"><div class="form-col">'+
    '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px">'+
      '<p class="kicker">'+esc(L.rqKicker)+'</p>'+
      '<p class="kicker tnum">'+esc(L.rqStep)+' '+(i+1)+' / '+STEP_COUNT+'</p>'+
    '</div>'+

    '<h1 class="display-type" style="margin:40px 0 32px">'+esc(stepTitle(i))+'</h1>'+
    body+
    '<div class="stepnav">'+
      '<button class="btn btn-ghost" data-stepmove="-1">&#8592; '+esc(L.back)+'</button>'+
      (last
        ? '<button class="btn btn-primary btn-lg" data-submit="1"'+((canGo && !S.saving)?'':' disabled')+'>'+
            esc(S.saving ? L.rqSending : L.submit)+'</button>'
        : '<button class="btn btn-primary btn-lg" data-stepmove="1"'+(canGo?'':' disabled')+'>'+esc(L.cont)+'</button>')+
    '</div>'+
    errBar()+
  '</div></div></section>';
}

function stepReady(i){
  var d = S.draft;
  if(i===0) return !!d.format;
  if(i===1){
    if(!d.type) return false;
    var so = subjByLabel(fmtByLabel(d.format), d.type);
    return so && so.other ? d.other.trim().length > 2 : true;
  }
  if(i===2) return true;                       /* extras are optional */
  if(i===3) return !!d.timeline && !!(d.location || d.remote);
  if(i===4) return d.brief.trim().length > 8;
  if(i===5) return !!(d.name.trim() && /.+@.+\..+/.test(d.email));
  return !!(d.type && d.name && d.email);
}

function render(keepScroll){

  var appEl = document.getElementById('app');
  appEl.innerHTML = (SCREENS[S.route] || screenHome)();
  /* only the home screen is built as a stack of bands */
  appEl.classList.toggle('stacked', S.route === 'home' && !REDUCED);
  renderNav(); renderSheet(); renderFooter(); renderLightbox();
  mountGoogle();

  var routeChanged = (lastRoute !== S.route);
  lastRoute = S.route;
  motionAfterRender(routeChanged);

  if(keepScroll){
    window.scrollTo(0, y);
    if(focusId){
      var el = document.getElementById(focusId);
      if(el){ el.focus(); if(caret != null && el.setSelectionRange){ try{ el.setSelectionRange(caret, caret); }catch(e){} } }
    }
  } else {
    window.scrollTo(0, 0);
  }
  NAVLIFT();
}

function go(route){
  sigTransition(function(){ goNow(route); });
}

function goNow(route){
  if(route === 'account' && !S.user) route = 'signin';
  if(route === 'signin' && S.user) route = 'account';
  if(route === 'track'){ S.trackDone = false; S.trackResult = null; }
  if(route === S.route && route !== 'request'){ S.menu = false; render(); return; }
  /* arriving at the wizard from anywhere else starts a new brief — the
     confirmation screen keeps its own state through data-restart instead */
  if(route === 'request' && S.submittedRef){
    S.submittedRef = null; S.draft = emptyDraft(); S.files = []; S.step = 0; S.dataError = '';
  }
  if(route === 'call' && S.callBooked){
    /* coming back to the form after a confirmation starts a fresh booking */
    S.callBooked = false; S.callRef = null; S.callError = '';
    S.slot = ''; S.callName = ''; S.callEmail = '';
  }
  S.route = route; S.menu = false;
  render();
}

/* ============================== EVENTS ============================== */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-go],[data-lang],[data-menu],[data-reel],[data-reelstep],[data-open],'+
    '[data-filter],[data-pkview],[data-extra],[data-slot],[data-book],[data-gate],[data-signin],[data-signout],[data-format],[data-subject],'+
    '[data-track],[data-file],'+
    '[data-timeline],[data-remote],[data-step],[data-stepmove],[data-submit],[data-restart],[data-close],[data-unfile]');

  if(!el){
    if(S.lightbox && e.target.closest('#lightbox') && !e.target.closest('[data-stop]')){
      S.lightbox = null; renderLightbox();
    }
    return;
  }
  var d = el.dataset;

  if(d.go){ go(d.go); return; }
  if(d.lang){ S.lang = d.lang; persist(); render(true); return; }
  if(d.menu){ setMenu(d.menu === 't' ? !S.menu : d.menu === '1'); return; }
  if(d.reel){ S.reel = Number(d.reel); render(true); return; }
  if(d.reelstep){ S.reel = (S.reel + Number(d.reelstep) + WORK.length) % WORK.length; render(true); return; }
  if(d.open){ S.lightbox = d.open; renderLightbox(); return; }
  if(d.close){ S.lightbox = null; renderLightbox(); return; }
  if(d.filter){ S.filter = d.filter; render(true); return; }

  if(d.pkview != null && el.hasAttribute('data-pkview')){
    var fmv = FORMATS.filter(function(x){ return x.id === d.pkview; })[0];
    if(fmv){
      S.draft.format = S.lang==='it' ? fmv.it : fmv.en;
      S.draft.type = ''; S.draft.other = '';
      S.draft.budget = fmv.range;
    }
    S.step = 1; S.submittedRef = null;          /* the format is known; the subject is not */
    if(S.user){ go('request'); return; }
    S.afterSignin = 'request'; go('signin'); return;
  }
  if(d.slot != null && el.hasAttribute('data-slot')){ S.slot = d.slot; render(true); return; }
  if(d.book){ submitCall(); return; }
  if(d.gate){ S.afterSignin = d.gate; go('signin'); return; }
  if(d.signin){ if(S.signinEmail){ S.signinSent = true; render(); } return; }
  if(d.signout){ signOut(); return; }
  if(d.track){ trackLookup(); return; }
  if(d.file){ openFile(d.file); return; }

  if(d.format != null && el.hasAttribute('data-format')){
    var fm = FORMATS[Number(d.format)];
    var wasFmt = S.draft.format;
    S.draft.format = S.lang==='it' ? fm.it : fm.en;
    if(wasFmt !== S.draft.format){ S.draft.type = ''; S.draft.other = ''; }
    S.draft.budget = fm.range;
    render(true); return;
  }
  if(d.subject != null && el.hasAttribute('data-subject')){
    var fm2 = fmtByLabel(S.draft.format);
    if(!fm2) return;
    var sj = fm2.subjects[Number(d.subject)];
    S.draft.type = S.lang==='it' ? sj.it : sj.en;
    if(!sj.other) S.draft.other = '';
    S.draft.budget = sj.onRequest ? t().onRequest : sj.range;
    render(true); return;
  }
  if(d.extra != null && el.hasAttribute('data-extra')){
    var ex = EXTRAS[Number(d.extra)];
    var pr = S.lang==='it' ? (ex.priceIt || ex.price) : ex.price;
    var lbl2 = (S.lang==='it' ? ex.it : ex.en) + ' · ' + pr;
    var idx2 = S.draft.deliverables.indexOf(lbl2);
    if(idx2 > -1) S.draft.deliverables.splice(idx2, 1); else S.draft.deliverables.push(lbl2);
    render(true); return;
  }
  if(d.timeline != null && el.hasAttribute('data-timeline')){
    var tl = TIMELINES[Number(d.timeline)]; S.draft.timeline = S.lang==='it'?tl.it:tl.en; render(true); return;
  }
  if(d.remote){ S.draft.remote = !S.draft.remote; render(true); return; }
  if(d.unfile != null && el.hasAttribute('data-unfile')){ S.files.splice(Number(d.unfile),1); render(true); return; }
  if(d.step != null && el.hasAttribute('data-step')){ S.step = Number(d.step); render(); return; }
  if(d.stepmove){
    var dir = Number(d.stepmove);
    if(dir < 0 && S.step === 0){ go('home'); return; }
    if(dir > 0 && !stepReady(S.step)) return;
    S.step = Math.max(0, Math.min(STEP_COUNT - 1, S.step + dir));
    render(); return;
  }
  if(d.submit){
    if(!stepReady(STEP_COUNT - 1) || S.saving) return;
    submitBrief(); return;
  }
  if(d.restart){
    S.draft = emptyDraft(); S.files = []; S.step = 0; S.submittedRef = null; render(); return;
  }
});

document.addEventListener('input', function(e){
