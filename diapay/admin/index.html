<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>پنل مدیریت | دیاپی</title>
<meta name="theme-color" content="#F5F7FA">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&family=Noto+Kufi+Arabic:wght@500;700&display=swap">
<style>
:root{
  color-scheme:light;
  --ground:#F5F7FA; --surface:#FFFFFF; --surface-2:#EDF1F6;
  --ink:#0A0C12; --muted:#5C6478; --line:#E4E8F0;
  --accent:#0098FD; --deep:#131249;
  --ok:#0E9F6E; --warn:#B45309; --bad:#DC2626;
  --logo-ink:#000; --logo-paper:#fff; --logo-blue:#0098FD; --logo-shade:#131249;
  --r:16px; --ease:cubic-bezier(.22,.8,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{direction:rtl;background:var(--ground);color:var(--ink);
  font-family:"Vazirmatn",system-ui,"Segoe UI",sans-serif;font-size:16px;line-height:1.85;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:"Noto Kufi Arabic","Vazirmatn",sans-serif;font-weight:700;line-height:1.5;margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--ground) 84%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .in{max-width:940px;margin-inline:auto;padding:12px 18px;display:flex;align-items:center;justify-content:center;position:relative}
.top a svg{width:86px;height:auto;display:block}
.tag{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:11.5px;letter-spacing:.12em;
  color:var(--accent);font-weight:700}
.ghost{position:absolute;left:16px;top:50%;transform:translateY(-50%);border:1px solid var(--line);
  background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 15px;font-size:13px;cursor:pointer}
.ghost:hover{color:var(--accent);border-color:var(--accent)}
.ghost[hidden]{display:none}

main{max-width:940px;margin-inline:auto;padding:24px 18px 70px}
.view[hidden]{display:none!important}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:16px}
.card h2{font-size:18px}
.card h3{font-size:15px;margin-bottom:10px}
.sub{color:var(--muted);font-size:14px;margin:4px 0 18px}
.eyebrow{font-size:11.5px;letter-spacing:.14em;color:var(--accent);font-weight:700;margin-bottom:8px}

label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
input,select,textarea{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:12px;
  background:var(--surface);color:var(--ink);font-family:inherit;font-size:15px;line-height:1.7;outline:none;
  transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
textarea{resize:vertical;min-height:64px}
input[dir=ltr]{direction:ltr;text-align:left}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 150px;min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 20px;border-radius:999px;
  font-weight:500;font-size:14px;border:1px solid transparent;cursor:pointer;
  transition:transform .18s var(--ease),box-shadow .2s var(--ease),border-color .2s,color .2s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn-a{background:var(--accent);color:#fff;box-shadow:0 6px 18px -8px var(--accent)}
.btn-b{border-color:var(--line);background:var(--surface);color:var(--ink)}
.btn-b:hover{border-color:var(--accent);color:var(--accent)}
.btn-d{border-color:var(--line);background:var(--surface);color:var(--bad)}
.btn-d:hover{border-color:var(--bad)}
.btn-s{padding:7px 14px;font-size:12.5px}
.btns{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:11px;margin-bottom:20px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tile b{display:block;font-size:24px;font-family:"Noto Kufi Arabic",sans-serif;line-height:1.4}
.tile span{font-size:12.5px;color:var(--muted)}
.tile.hot{border-color:var(--accent)}
.tile.hot b{color:var(--accent)}

.seg{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:999px;margin-bottom:14px;overflow-x:auto}
.seg button{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:8px 16px;
  font-size:13.5px;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 2px 8px -4px rgba(10,12,18,.3)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 11px;border-radius:999px;
  background:var(--surface-2);color:var(--muted);font-weight:500;white-space:nowrap}
.pill.s0{background:#FEF3C7;color:#92400E}
.pill.s1{background:#DBEAFE;color:#1E40AF}
.pill.s2{background:#D1FAE5;color:#065F46}
.pill.s3{background:#F3F4F6;color:#6B7280}
.pill.blk{background:#FEE2E2;color:#991B1B}

.deal{display:block;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:16px 19px;margin-bottom:11px;cursor:pointer;
  transition:transform .22s var(--ease),border-color .22s,box-shadow .22s var(--ease)}
.deal:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 12px 28px -20px rgba(10,12,18,.5)}
.deal .hd{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.deal .ttl{font-weight:700;font-size:15px;font-family:"Noto Kufi Arabic","Vazirmatn",sans-serif}
.deal .who{font-size:13px;color:var(--muted)}
.deal .ref{font-size:12px;color:var(--muted);direction:ltr}
.deal .terms{font-size:13px;color:var(--muted)}

.meter{margin-top:12px}
.meter .lb{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.meter .lb b{color:var(--ink);font-weight:500;font-size:13px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .6s var(--ease)}
.bar i.done{background:var(--ok)}
.meter .ft{font-size:12.5px;color:var(--muted);margin-top:5px}
.meter .ft b{color:var(--ink);font-weight:500}

.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-weight:500}
.calc{background:var(--surface-2);border-radius:12px;padding:12px 15px;font-size:14px;margin-top:14px}
.calc b{font-family:"Noto Kufi Arabic",sans-serif}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:500}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
tr.pend{background:#FFFBEB}

.toast{position:fixed;left:50%;top:74px;z-index:60;transform:translate(-50%,-10px);opacity:0;pointer-events:none;
  width:max-content;max-width:calc(100vw - 32px);padding:11px 18px;border-radius:14px;background:var(--deep);color:#fff;
  font-size:13.5px;text-align:center;box-shadow:0 14px 34px -16px rgba(10,12,18,.55);
  transition:opacity .3s var(--ease),transform .3s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad)}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:26px 10px}
.note{font-size:12.5px;color:var(--muted);line-height:1.9}
.back{background:none;border:0;color:var(--muted);font-size:14px;cursor:pointer;padding:4px 0;margin-bottom:12px}
.back:hover{color:var(--accent)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

<main>

  <section class="view" id="vAuth" hidden>
    <div class="card" style="max-width:400px;margin-inline:auto">
      <h2>ورود مدیر</h2>
      <p class="sub">این صفحه فقط برای حساب‌های مدیر دیاپی کار می‌کند.</p>
      <form id="fAuth">
        <label for="aMail">ایمیل</label>
        <input id="aMail" type="email" dir="ltr" autocomplete="email" required>
        <label for="aPass">رمز عبور</label>
        <input id="aPass" type="password" dir="ltr" autocomplete="current-password" required>
        <div style="margin-top:18px"><button class="btn btn-a" id="bAuth" type="submit">ورود</button></div>
      </form>
    </div>
  </section>

  <section class="view" id="vDenied" hidden>
    <div class="card" style="max-width:400px;margin-inline:auto;text-align:center">
      <h2>دسترسی ندارید</h2>
      <p class="sub" id="deniedWho"></p>
      <button class="btn btn-b" id="bOut2" type="button">خروج از حساب</button>
    </div>
  </section>

  <section class="view" id="vHome" hidden>
    <div class="tiles" id="tiles"></div>
    <div class="seg" id="segTab">
      <button type="button" data-t="deals" class="on">معامله‌ها</button>
      <button type="button" data-t="people">مشتری‌ها</button>
    </div>

    <div id="tabDeals">

    return String(s == null ? "" : s)
      .replace(/[۰-۹]/g, function(d){ return String(d.charCodeAt(0) - 0x6F0); })
      .replace(/[٠-٩]/g, function(d){ return String(d.charCodeAt(0) - 0x660); })
      .replace(/[,٬،\s_]/g, "").replace(/٫/g, ".");
  }
  function num(s){ var n = parseFloat(digits(s)); return isFinite(n) ? n : 0; }
  function fmt(n, dec){
    n = Number(n) || 0;

  }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){

  }

  }

  $("people").addEventListener("click", async function(e){
    var b = e.target.closest("button[data-p]"); if(!b) return;
    var card = b.closest("[data-u]"), uid = card.dataset.u, act = b.dataset.p;
    try {
      if (act === "new"){
        var f = card.querySelector("[data-newform]");
        f.hidden = !f.hidden;
        return;
      }
      if (act === "create"){
        var fxv = num(card.querySelector('[data-f="fx"]').value);
        var rv  = num(card.querySelector('[data-f="rate"]').value);
        if (fxv <= 0 || rv <= 0){ toast("مقدار و نرخ را وارد کنید", true); return; }
        busy(b, true);
        var nd = await rpc("dp_admin_create_deal", {
          p_user_id: uid, p_side: card.querySelector('[data-f="side"]').value,
          p_currency: card.querySelector('[data-f="cur"]').value,
          p_fx_amount: fxv, p_rate: rv, p_admin_note: ""
        });
        busy(b, false, "ساخت معامله");
        toast("معامله ساخته شد.");
        openDeal = nd; paintDetail(); show("vDeal");
        return;
      }
      busy(b, true);
      people = await rpc("dp_admin_set_customer", {
        p_user_id: uid,
        p_status: act === "block" ? "blocked" : (act === "unblock" ? "active" : null),
        p_admin_note: act === "save" ? card.querySelector("[data-note]").value : null
      });
      toast("ذخیره شد.");
      paintPeople();
    } catch(x){ err(x); busy(b, false); }
  });

  // ---------- بارگذاری ----------
  async function loadDeals(){
    deals = await rpc("dp_admin_deals", {
      p_status: filter === "" ? null : Number(filter),
      p_q: $("q").value, p_limit: 200
    });
    paintList();
  }
  async function loadPeople(){
    people = await rpc("dp_admin_customers", { p_q: $("qp").value });
    paintPeople();
  }
  async function loadAll(){
    try {
      paintTiles(await rpc("dp_admin_summary"));
      await loadDeals();
      if (tab === "people") await loadPeople();
    } catch(x){ err(x); }
  }

  async function boot(){
    var s = await sb.auth.getSession();
    if (!s.data.session){ $("out").hidden = true; show("vAuth"); return; }
    $("out").hidden = false;
    var me;
    try { me = await rpc("dp_me"); } catch(x){ err(x); return; }
    if (!me.is_admin){
      $("deniedWho").textContent = "این حساب (" + me.email + ") مدیر نیست.";
      show("vDenied");
      return;
    }
    show("vHome");
    await loadAll();
  }

  boot();
})();
</script>
</body>
</html>
