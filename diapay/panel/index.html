<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حساب کاربری | دیاپی</title>
<meta name="theme-color" content="#F5F7FA">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&family=Noto+Kufi+Arabic:wght@500;700&display=swap">
<style>
:root{
  color-scheme:light;
  --ground:#F5F7FA; --surface:#FFFFFF; --surface-2:#EDF1F6;
  --ink:#0A0C12; --muted:#5C6478; --line:#E4E8F0;
  --accent:#0098FD; --deep:#131249;
  --ok:#0E9F6E; --warn:#B45309; --bad:#DC2626;
  --logo-ink:#000; --logo-paper:#fff; --logo-blue:#0098FD; --logo-shade:#131249;
  --r:16px; --ease:cubic-bezier(.22,.8,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{direction:rtl;background:var(--ground);color:var(--ink);
  font-family:"Vazirmatn",system-ui,"Segoe UI",sans-serif;font-size:16px;line-height:1.85;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:"Noto Kufi Arabic","Vazirmatn",sans-serif;font-weight:700;line-height:1.5;margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--ground) 84%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .in{max-width:780px;margin-inline:auto;padding:12px 18px;display:flex;align-items:center;justify-content:center;position:relative}
.top a svg{width:96px;height:auto;display:block}
.ghost{position:absolute;left:16px;top:50%;transform:translateY(-50%);border:1px solid var(--line);
  background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 15px;font-size:13px;cursor:pointer;
  transition:color .2s,border-color .2s}
.ghost:hover{color:var(--accent);border-color:var(--accent)}
.ghost[hidden]{display:none}

main{max-width:780px;margin-inline:auto;padding:26px 18px 70px}
.view[hidden]{display:none!important}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:16px}
.card h2{font-size:18px;margin-bottom:4px}
.card h3{font-size:15px;margin-bottom:10px}
.sub{color:var(--muted);font-size:14px;margin:4px 0 18px}
.eyebrow{font-size:11.5px;letter-spacing:.14em;color:var(--accent);font-weight:700;margin-bottom:8px}

label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
input,select,textarea{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;
  background:var(--surface);color:var(--ink);font-family:inherit;font-size:15px;line-height:1.7;outline:none;
  transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
textarea{resize:vertical;min-height:70px}
input[dir=ltr]{direction:ltr;text-align:left}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 180px;min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 22px;border-radius:999px;
  font-weight:500;font-size:14.5px;border:1px solid transparent;cursor:pointer;
  transition:transform .18s var(--ease),box-shadow .2s var(--ease),border-color .2s,color .2s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn-a{background:var(--accent);color:#fff;box-shadow:0 6px 18px -8px var(--accent)}
.btn-b{border-color:var(--line);background:var(--surface);color:var(--ink)}
.btn-b:hover{border-color:var(--accent);color:var(--accent)}
.btn-s{padding:8px 16px;font-size:13px}
.linky{background:none;border:0;color:var(--accent);font-size:13.5px;cursor:pointer;padding:6px 2px}

.seg{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:999px;margin-bottom:6px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);border-radius:999px;padding:9px 10px;
  font-size:14px;cursor:pointer;transition:background .2s,color .2s}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 2px 8px -4px rgba(10,12,18,.3)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 11px;border-radius:999px;
  background:var(--surface-2);color:var(--muted);font-weight:500;white-space:nowrap}
.pill.s0{background:#FEF3C7;color:#92400E}
.pill.s1{background:#DBEAFE;color:#1E40AF}
.pill.s2{background:#D1FAE5;color:#065F46}
.pill.s3{background:#F3F4F6;color:#6B7280}

.deal{display:block;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:18px 20px;margin-bottom:12px;cursor:pointer;
  transition:transform .22s var(--ease),border-color .22s,box-shadow .22s var(--ease)}
.deal:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 12px 28px -20px rgba(10,12,18,.5)}
.deal .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.deal .ref{font-size:12.5px;color:var(--muted);direction:ltr;font-variant-numeric:tabular-nums}
.deal .ttl{font-weight:700;font-size:15.5px;font-family:"Noto Kufi Arabic","Vazirmatn",sans-serif}
.deal .terms{font-size:13.5px;color:var(--muted);margin-bottom:12px}

.meter{margin-top:13px}
.meter .lb{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.meter .lb b{color:var(--ink);font-weight:500;font-size:13px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .6s var(--ease)}
.bar i.done{background:var(--ok)}
.meter .ft{font-size:12.5px;color:var(--muted);margin-top:5px}
.meter .ft b{color:var(--ink);font-weight:500}

.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-weight:500}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:start}
th{font-size:12px;color:var(--muted);font-weight:500}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
tr.pend td{color:var(--muted)}

.tl{list-style:none;margin:0;padding:0;font-size:13px;color:var(--muted)}
.tl li{padding:6px 0 6px 0;border-inline-start:2px solid var(--line);padding-inline-start:14px;position:relative}
.tl li::before{content:"";position:absolute;inset-inline-start:-5px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--line)}
.tl li:first-child::before{background:var(--accent)}

.toast{position:fixed;left:50%;top:76px;z-index:60;transform:translate(-50%,-10px);opacity:0;pointer-events:none;
  width:max-content;max-width:calc(100vw - 32px);padding:11px 18px;border-radius:14px;background:var(--deep);color:#fff;
  font-size:13.5px;line-height:1.8;text-align:center;box-shadow:0 14px 34px -16px rgba(10,12,18,.55);
  transition:opacity .3s var(--ease),transform .3s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad)}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:30px 10px}
.note{font-size:12.5px;color:var(--muted);line-height:1.9}
.hr{height:1px;background:var(--line);margin:18px 0}
.back{background:none;border:0;color:var(--muted);font-size:14px;cursor:pointer;padding:4px 0;margin-bottom:12px}
.back:hover{color:var(--accent)}
.spin{display:inline-block;width:15px;height:15px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

<main>

  <!-- ورود / ثبت‌نام -->
  <section class="view" id="vAuth" hidden>
    <div class="card" style="max-width:420px;margin-inline:auto">
      <div class="seg" id="segAuth">
        <button type="button" data-m="in" class="on">ورود</button>
        <button type="button" data-m="up">ثبت‌نام</button>
      </div>
      <p class="sub" id="authSub">برای دیدن حساب و معامله‌هایتان وارد شوید.</p>
      <form id="fAuth">
        <div id="wName" hidden>
          <label for="aName">نام و نام خانوادگی</label>
          <input id="aName" autocomplete="name" maxlength="120">
        </div>
        <label for="aMail">ایمیل</label>
        <input id="aMail" type="email" dir="ltr" autocomplete="email" required>
        <label for="aPass">رمز عبور</label>
        <input id="aPass" type="password" dir="ltr" autocomplete="current-password" minlength="8" required>
        <div style="margin-top:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <button class="btn btn-a" id="bAuth" type="submit">ورود</button>
          <button class="linky" id="bForgot" type="button">رمزم را فراموش کرده‌ام</button>
        </div>
      </form>
      <p class="note" style="margin-top:16px">تنها آیدی رسمی پشتیبانی دیاپی <b>@diapayadmin</b> است.</p>
    </div>
  </section>

  <!-- رمز تازه -->
  <section class="view" id="vReset" hidden>
    <div class="card" style="max-width:420px;margin-inline:auto">
      <h2>رمز تازه</h2>
      <p class="sub">یک رمز تازه برای حسابتان بگذارید.</p>
      <form id="fReset">
        <label for="rPass">رمز تازه</label>
        <input id="rPass" type="password" dir="ltr" minlength="8" autocomplete="new-password" required>
        <div style="margin-top:18px"><button class="btn btn-a" type="submit">ذخیره‌ی رمز</button></div>
      </form>
    </div>
  </section>

  <!-- حساب -->
  <section class="view" id="vApp" hidden>

    <div class="card" id="cProfile">
      <h2 id="hello">حساب من</h2>
      <p class="sub" id="pSub"></p>
      <form id="fProfile">
        <div class="row">
          <div><label for="pName">نام و نام خانوادگی</label><input id="pName" maxlength="120"></div>
          <div><label for="pPhone">شماره تماس</label><input id="pPhone" dir="ltr" maxlength="40" inputmode="tel"></div>
        </div>
        <div class="row">
          <div><label for="pTg">آیدی تلگرام</label><input id="pTg" dir="ltr" maxlength="60" placeholder="@username"></div>
          <div><label for="pNid">کد ملی</label><input id="pNid" dir="ltr" maxlength="20" inputmode="numeric"></div>
        </div>
        <div style="margin-top:16px"><button class="btn btn-b btn-s" type="submit">ذخیره‌ی مشخصات</button></div>
      </form>
    </div>

    <div class="card">
      <div class="eyebrow">سفارش تازه</div>
      <h2>درخواست معامله</h2>
      <p class="sub">مقدار را بنویسید؛ نرخ قطعی را دیاپی اعلام و تأیید می‌کند.</p>
      <form id="fNew">
        <div class="seg" id="segSide">
          <button type="button" data-v="buy" class="on">می‌خرم</button>
          <button type="button" data-v="sell">می‌فروشم</button>
        </div>
        <div class="row">
          <div>
            <label for="nCur">ارز</label>
            <select id="nCur">
              <option value="EUR">یورو</option>
              <option value="USD">دلار</option>
              <option value="USDT">تتر</option>
              <option value="GBP">پوند</option>
            </select>
          </div>
          <div><label for="nFx">مقدار ارز</label><input id="nFx" dir="ltr" inputmode="decimal" placeholder="5000"></div>
          <div><label for="nTm">یا مبلغ تومان</label><input id="nTm" dir="ltr" inputmode="numeric" placeholder="1320000000"></div>
        </div>
        <label for="nNote">توضیح (اختیاری)</label>
        <textarea id="nNote" maxlength="2000" placeholder="مثلاً: حواله به حساب شخصی، شماره شبا…"></textarea>
        <div style="margin-top:16px"><button class="btn btn-a" id="bNew" type="submit">ثبت درخواست</button></div>
      </form>
    </div>

    <h3 style="margin:26px 0 12px">معامله‌های من</h3>
    <div id="list"><div class="empty">در حال دریافت…</div></div>
  </section>

  <!-- یک معامله -->
  <section class="view" id="vDeal" hidden>
    <button class="back" id="bBack" type="button">‹ بازگشت به حساب</button>
    <div id="dealBody"></div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
  "use strict";
  var SB_URL = "https://aznelawjlyoklmjcxylq.supabase.co";
  var SB_KEY = "sb_publishable_4Lhz2fJueL6UuRYHcmMWGA_bDmZZ6-R";
  var sb = window.supabase.createClient(SB_URL, SB_KEY);

  var CUR = {EUR:"یورو", USD:"دلار", USDT:"تتر", GBP:"پوند"};
  var ST  = ["در انتظار تأیید","در جریان","تکمیل شده","لغو شده"];

  var $ = function(id){ return document.getElementById(id); };
  var toastEl = $("toast"), toastT = null;
  function toast(t, bad){
    toastEl.textContent = t;
    toastEl.classList.toggle("bad", !!bad);
    toastEl.classList.add("show");
    clearTimeout(toastT);
    toastT = setTimeout(function(){ toastEl.classList.remove("show"); }, bad ? 5200 : 3600);
  }
  function show(id){
    ["vAuth","vReset","vApp","vDeal"].forEach(function(v){ $(v).hidden = (v !== id); });
    window.scrollTo(0,0);
  }
  function digits(s){
    return String(s == null ? "" : s)
      .replace(/[۰-۹]/g, function(d){ return String(d.charCodeAt(0) - 0x6F0); })
      .replace(/[٠-٩]/g, function(d){ return String(d.charCodeAt(0) - 0x660); })
      .replace(/[,٬،\s_]/g, "").replace(/٫/g, ".");
  }
  function num(s){ var n = parseFloat(digits(s)); return isFinite(n) ? n : 0; }
  function fmt(n, dec){
    n = Number(n) || 0;
    return n.toLocaleString("fa-IR", {minimumFractionDigits:0, maximumFractionDigits: dec == null ? 0 : dec});
  }
  function fx(n){ return fmt(n, 2); }
  function when(s){
    if(!s) return "—";
    try { return new Date(s).toLocaleDateString("fa-IR", {year:"numeric", month:"long", day:"numeric"}); }
    catch(e){ return "—"; }
  }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c];
    });
  }
  function err(e){
    var m = (e && (e.message || e.error_description)) || "خطای ناشناخته";
    if (/Invalid login/i.test(m)) m = "ایمیل یا رمز درست نیست";
    if (/already registered|already been/i.test(m)) m = "این ایمیل قبلاً ثبت شده است؛ وارد شوید";
    if (/Email not confirmed/i.test(m)) m = "ایمیل تأیید نشده؛ لینک تأیید را در ایمیلتان باز کنید";
    if (/Password should be/i.test(m)) m = "رمز باید حداقل ۸ نویسه باشد";
    if (/rate limit|Too many|For security/i.test(m)) m = "درخواست زیاد بود؛ کمی بعد دوباره تلاش کنید";
    toast(m, true);
  }
  async function rpc(fn, args){
    var r = await sb.rpc(fn, args || {});
    if (r.error) throw r.error;
    return r.data;
  }
  function busy(btn, on, label){
    btn.disabled = !!on;
    if (on){ btn.dataset.t = btn.innerHTML; btn.innerHTML = '<span class="spin"></span>'; }
    else if (btn.dataset.t){ btn.innerHTML = label || btn.dataset.t; }
  }

  // ---------- وضعیت ----------
  var me = null, deals = [], openDeal = null, mode = "in", recovering = false;

  // ---------- ورود ----------
  $("segAuth").addEventListener("click", function(e){
    var b = e.target.closest("button[data-m]"); if(!b) return;
    mode = b.dataset.m;
    [].forEach.call(this.children, function(c){ c.classList.toggle("on", c === b); });
    $("wName").hidden = (mode !== "up");
    $("aName").required = (mode === "up");
    $("aPass").autocomplete = (mode === "up") ? "new-password" : "current-password";
    $("bAuth").textContent = (mode === "up") ? "ساخت حساب" : "ورود";
    $("authSub").textContent = (mode === "up")
      ? "حساب بسازید تا سفارش‌هایتان را اینجا دنبال کنید."
      : "برای دیدن حساب و معامله‌هایتان وارد شوید.";
  });

  $("fAuth").addEventListener("submit", async function(e){
    e.preventDefault();
    var b = $("bAuth"), email = $("aMail").value.trim(), pass = $("aPass").value;
    busy(b, true);
    try {
      if (mode === "up"){
        var r = await sb.auth.signUp({
          email: email, password: pass,
          options: { data: { full_name: $("aName").value.trim() }, emailRedirectTo: location.href.split("#")[0] }
        });
        if (r.error) throw r.error;
        if (!r.data.session){
          toast("ایمیل تأیید برایتان فرستاده شد؛ لینک داخل آن را باز کنید.");
          busy(b, false, "ساخت حساب");
          return;
        }
      } else {
        var s = await sb.auth.signInWithPassword({ email: email, password: pass });
        if (s.error) throw s.error;
      }
      await boot();
    } catch(x){ err(x); }
    busy(b, false, mode === "up" ? "ساخت حساب" : "ورود");
  });

  $("bForgot").addEventListener("click", async function(){
    var email = $("aMail").value.trim();
    if (!email){ toast("اول ایمیلتان را بنویسید", true); return; }
    try {
      var r = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split("#")[0] });
      if (r.error) throw r.error;
      toast("لینک تغییر رمز به ایمیلتان فرستاده شد.");
    } catch(x){ err(x); }
  });

  $("fReset").addEventListener("submit", async function(e){
    e.preventDefault();
    try {
      var r = await sb.auth.updateUser({ password: $("rPass").value });
      if (r.error) throw r.error;
      recovering = false;
      toast("رمز تازه ذخیره شد.");
      await boot();
    } catch(x){ err(x); }
  });

  $("out").addEventListener("click", async function(){
    await sb.auth.signOut();
    me = null; deals = []; openDeal = null;
    $("out").hidden = true;
    show("vAuth");
  });

  // ---------- مشخصات ----------
  $("fProfile").addEventListener("submit", async function(e){
    e.preventDefault();
    try {
      me = await rpc("dp_save_profile", {
        p_full_name: $("pName").value, p_phone: $("pPhone").value,
        p_national_id: $("pNid").value, p_telegram: $("pTg").value
      });
      paintMe();
      toast("مشخصات ذخیره شد.");
    } catch(x){ err(x); }
  });

  // ---------- درخواست تازه ----------
  var side = "buy";
  $("segSide").addEventListener("click", function(e){
    var b = e.target.closest("button[data-v]"); if(!b) return;
    side = b.dataset.v;
    [].forEach.call(this.children, function(c){ c.classList.toggle("on", c === b); });
  });

  $("fNew").addEventListener("submit", async function(e){
    e.preventDefault();
    var b = $("bNew"), f = num($("nFx").value), t = num($("nTm").value);
    if (f <= 0 && t <= 0){ toast("مقدار ارز یا مبلغ تومان را وارد کنید", true); return; }
    busy(b, true);
    try {
      await rpc("dp_request_deal", {
        p_side: side, p_currency: $("nCur").value,
        p_fx_amount: f > 0 ? f : null, p_toman_amount: t > 0 ? Math.round(t) : null,
        p_note: $("nNote").value
      });
      $("nFx").value = ""; $("nTm").value = ""; $("nNote").value = "";
      toast("درخواست ثبت شد؛ بعد از بررسی نرخ، تأیید می‌شود.");
      await loadDeals();
    } catch(x){ err(x); }
    busy(b, false, "ثبت درخواست");
  });

  $("bBack").addEventListener("click", function(){ openDeal = null; show("vApp"); });

  // ---------- نمایش ----------
  function paintMe(){
    $("hello").textContent = me.full_name ? ("سلام " + me.full_name) : "حساب من";
    $("pSub").textContent = me.email + (me.status === "blocked" ? " · حساب مسدود است" : "");
    $("pName").value  = me.full_name || "";
    $("pPhone").value = me.phone || "";
    $("pTg").value    = me.telegram || "";
    $("pNid").value   = me.national_id || "";
  }

  function legs(d){
    var unit = CUR[d.currency] || d.currency;
    var tm = {
      title: d.side === "buy" ? "واریز شما (تومان)" : "واریز دیاپی به شما (تومان)",
      done: Number(d.paid_toman), total: Number(d.toman_amount),
      rest: Number(d.remaining_toman), pend: Number(d.pending_toman), dec: 0, unit: "تومان"
    };
    var fxl = {
      title: d.side === "buy" ? ("حواله‌ی دیاپی به شما (" + unit + ")") : ("ارسال شما (" + unit + ")"),
      done: Number(d.sent_fx), total: Number(d.fx_amount),
      rest: Number(d.remaining_fx), pend: Number(d.pending_fx), dec: 2, unit: unit
    };
    return d.side === "buy" ? [tm, fxl] : [fxl, tm];
  }

  function meter(m){
    var pc = m.total > 0 ? Math.min(100, Math.round(m.done / m.total * 100)) : 0;
    var rest = m.rest > 0
      ? ("مانده " + fmt(m.rest, m.dec) + " " + m.unit)
      : (m.rest < 0 ? ("اضافه " + fmt(-m.rest, m.dec) + " " + m.unit) : "تسویه شد");
    return '<div class="meter">'
      + '<div class="lb"><span>' + esc(m.title) + '</span><b>' + fmt(pc) + '٪</b></div>'
      + '<div class="bar"><i class="' + (pc >= 100 ? "done" : "") + '" style="width:' + pc + '%"></i></div>'
      + '<div class="ft"><b>' + fmt(m.done, m.dec) + '</b> از ' + fmt(m.total, m.dec) + ' · ' + rest
      + (m.pend > 0 ? ' · <span style="color:var(--warn)">' + fmt(m.pend, m.dec) + ' در انتظار تأیید</span>' : '')
      + '</div></div>';
  }

  function title(d){
    return (d.side === "buy" ? "خرید " : "فروش ") + (CUR[d.currency] || d.currency);
  }
  function termsLine(d){
    if (Number(d.rate) > 0 && Number(d.fx_amount) > 0){
      return fx(d.fx_amount) + " " + (CUR[d.currency] || d.currency)
           + " × " + fmt(d.rate) + " = " + fmt(d.toman_amount) + " تومان";
    }
    var want = Number(d.req_fx_amount) > 0
      ? (fx(d.req_fx_amount) + " " + (CUR[d.currency] || d.currency))
      : (Number(d.req_toman_amount) > 0 ? (fmt(d.req_toman_amount) + " تومان") : "—");
    return "درخواست: " + want + " · نرخ هنوز اعلام نشده";
  }

  function cardHTML(d){
    var L = Number(d.rate) > 0 ? legs(d).map(meter).join("") : "";
    return '<button class="deal" data-id="' + d.id + '">'
      + '<div class="hd"><span class="ttl">' + esc(title(d)) + '</span>'
      + '<span class="pill s' + d.status + '">' + ST[d.status] + '</span>'
      + '<span class="ref" style="margin-inline-start:auto">' + esc(d.ref) + '</span></div>'
      + '<div class="terms">' + esc(termsLine(d)) + '</div>' + L + '</button>';
  }

  function paintList(){
    var el = $("list");
    if (!deals.length){ el.innerHTML = '<div class="empty">هنوز معامله‌ای ثبت نشده است.</div>'; return; }
    el.innerHTML = deals.map(cardHTML).join("");
  }

  $("list").addEventListener("click", function(e){
    var b = e.target.closest(".deal[data-id]"); if(!b) return;
    openDetail(b.dataset.id);
  });

  async function openDetail(id){
    try {
      openDeal = await rpc("dp_deal", { p_id: id });
      paintDetail();
      show("vDeal");
    } catch(x){ err(x); }
  }

  function paintDetail(){
    var d = openDeal, unit = CUR[d.currency] || d.currency;
    var canReport = (d.status === 1 || d.status === 2);
    var myLeg = d.side === "buy" ? "toman" : "fx";
    var myUnit = d.side === "buy" ? "تومان" : unit;

    var rows = (d.entries || []).map(function(e){
      var u = e.leg === "toman" ? "تومان" : unit;
      var who = e.by_admin ? "دیاپی" : "اعلام شما";
      return '<tr class="' + (e.confirmed ? "" : "pend") + '">'
        + '<td>' + (e.leg === "toman" ? "تومان" : u) + '</td>'
        + '<td class="n">' + fmt(e.amount, e.leg === "toman" ? 0 : 2) + '</td>'
        + '<td class="n">' + when(e.happened_at) + '</td>'
        + '<td>' + (e.confirmed ? "ثبت شد" : "در انتظار تأیید") + '</td>'
        + '<td>' + esc(who) + (e.note ? " · " + esc(e.note) : "") + '</td></tr>';
    }).join("");

    var EV = {created:"درخواست ثبت شد", approved:"نرخ اعلام و تأیید شد", updated:"شرایط به‌روز شد",
              toman:"واریز تومانی ثبت شد", fx:"حواله‌ی ارزی ثبت شد", reported:"واریز اعلام شد",
              confirmed:"یک ردیف تأیید شد", unconfirmed:"تأیید یک ردیف برداشته شد", removed:"یک ردیف حذف شد",
              completed:"معامله تکمیل شد", cancelled:"معامله لغو شد", reopened:"معامله بازگشایی شد", active:"در جریان"};
    var tl = (d.events || []).slice().reverse().map(function(v){
      return '<li>' + esc(EV[v.kind] || v.kind) + (v.note ? " — " + esc(v.note) : "")
           + '<br><span style="font-size:12px">' + when(v.created_at) + '</span></li>';
    }).join("");

    $("dealBody").innerHTML =
      '<div class="card">'
      + '<div class="hd" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">'
      + '<h2>' + esc(title(d)) + '</h2><span class="pill s' + d.status + '">' + ST[d.status] + '</span>'
      + '<span class="ref" style="margin-inline-start:auto;font-size:12.5px;color:var(--muted)">' + esc(d.ref) + '</span></div>'
      + '<div class="kv"><span>مقدار</span><b>' + (Number(d.fx_amount) > 0 ? fx(d.fx_amount) + " " + unit : "—") + '</b></div>'
      + '<div class="kv"><span>نرخ هر ' + esc(unit) + '</span><b>' + (Number(d.rate) > 0 ? fmt(d.rate) + " تومان" : "اعلام نشده") + '</b></div>'
      + '<div class="kv"><span>معادل تومانی</span><b>' + (Number(d.toman_amount) > 0 ? fmt(d.toman_amount) + " تومان" : "—") + '</b></div>'
      + '<div class="kv"><span>تاریخ ثبت</span><b>' + when(d.created_at) + '</b></div>'
      + (d.admin_note ? '<div class="kv"><span>یادداشت دیاپی</span><b>' + esc(d.admin_note) + '</b></div>' : '')
      + (d.customer_note ? '<div class="kv"><span>توضیح شما</span><b>' + esc(d.customer_note) + '</b></div>' : '')
      + '</div>'

      + (Number(d.rate) > 0
          ? '<div class="card"><h3>وضعیت تسویه</h3>' + legs(d).map(meter).join("") + '</div>'
          : '<div class="card"><p class="note">این درخواست هنوز تأیید نشده است. به‌محض اعلام نرخ، جزئیات تسویه همین‌جا نشان داده می‌شود.</p></div>')

      + (canReport
          ? '<div class="card"><h3>اعلام واریز</h3>'
            + '<p class="note">اگر مبلغی واریز کرده‌اید اینجا بنویسید. تا تأیید دیاپی، روی مانده اثر نمی‌گذارد.</p>'
            + '<form id="fRep"><div class="row">'
            + '<div><label for="rAmt">مبلغ (' + esc(myUnit) + ')</label><input id="rAmt" dir="ltr" inputmode="decimal"></div>'
            + '<div><label for="rDate">تاریخ واریز</label><input id="rDate" type="date"></div>'
            + '</div><label for="rNote">توضیح (اختیاری)</label><input id="rNote" maxlength="500" placeholder="شماره پیگیری، نام بانک…">'
            + '<div style="margin-top:14px"><button class="btn btn-b btn-s" id="bRep" type="submit">اعلام واریز</button></div>'
            + '</form></div>'
          : '')

      + '<div class="card"><h3>ریز واریزها و حواله‌ها</h3>'
      + (rows
          ? '<div style="overflow-x:auto"><table><thead><tr><th>سمت</th><th>مبلغ</th><th>تاریخ</th><th>وضعیت</th><th>شرح</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
          : '<div class="empty">هنوز ثبتی انجام نشده است.</div>')
      + '</div>'

      + (tl ? '<div class="card"><h3>تاریخچه</h3><ul class="tl">' + tl + '</ul></div>' : '');

    var f = $("fRep");
    if (f) f.addEventListener("submit", async function(e){
      e.preventDefault();
      var b = $("bRep"), a = num($("rAmt").value);
      if (a <= 0){ toast("مبلغ را وارد کنید", true); return; }
      busy(b, true);
      try {
        openDeal = await rpc("dp_report_payment", {
          p_deal_id: d.id, p_leg: myLeg, p_amount: a,
          p_happened_at: $("rDate").value ? new Date($("rDate").value).toISOString() : null,
          p_note: $("rNote").value
        });
        toast("اعلام شما ثبت شد؛ پس از تأیید دیاپی روی مانده اعمال می‌شود.");
        paintDetail();
        loadDeals();
      } catch(x){ err(x); busy(b, false, "اعلام واریز"); }
    });
  }

  async function loadDeals(){
    deals = await rpc("dp_my_deals");
    paintList();
  }

  async function boot(){
    var s = await sb.auth.getSession();
    if (!s.data.session){ $("out").hidden = true; show("vAuth"); return; }
    if (recovering){ show("vReset"); return; }
    $("out").hidden = false;
    try {
      me = await rpc("dp_me");
      paintMe();
      show("vApp");
      await loadDeals();
    } catch(x){ err(x); }
  }

  sb.auth.onAuthStateChange(function(ev){
    if (ev === "PASSWORD_RECOVERY"){ recovering = true; $("out").hidden = false; show("vReset"); }
  });

  boot();
})();
</script>
</body>
</html>
