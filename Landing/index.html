    try{ localStorage.setItem('dia-lp-lang', l); }catch(e){}
    $$('[data-t]').forEach(function(el){ el.innerHTML = fill(el.getAttribute('data-t')); });
    $$('[data-tp]').forEach(function(el){ el.placeholder = fill(el.getAttribute('data-tp')); });
    $$('.lang button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.lang === l)); });
    buildSelect($('#f-type'),  T.types);
    buildSelect($('#f-budget'),T.budgets, true);
    buildSlots();
    document.title = l === 'it'
      ? 'DIA PROD — Video e foto per brand ambiziosi · −20% con META20'
      : 'DIA PROD — Video and photography for ambitious brands · 20% off with META20';
  }
  function buildSelect(sel, list, keepEmptyFirst){
    var cur = sel.selectedIndex; sel.innerHTML = '';
    list.forEach(function(txt,i){
      var o = document.createElement('option'); o.value = txt; o.textContent = txt; sel.appendChild(o);
    });
    if(cur > -1 && cur < list.length) sel.selectedIndex = cur;
  }
  $$('.lang button').forEach(function(b){ b.addEventListener('click', function(){ applyLang(b.dataset.lang); }); });

  /* gallery -------------------------------------------------------------- */
  (function(){
    var rail = $('#rail'), frag = document.createDocumentFragment();
    CFG.PHOTOS.forEach(function(n){
      var f = document.createElement('figure'), i = document.createElement('img');
      i.src = CFG.PHOTO_BASE + n + '.jpg'; i.alt = ''; i.loading = 'lazy'; i.decoding = 'async';
      f.appendChild(i); frag.appendChild(f);
    });
    rail.appendChild(frag);
  })();

  /* call slots ----------------------------------------------------------- */
  var SLOT_PLAN = [[2,'10:00'],[2,'14:00'],[3,'11:30'],[4,'09:00'],[4,'16:00'],[5,'13:00']]; // 0 = Sunday
  function nextSlotDate(i){
    var want = SLOT_PLAN[i][0], d = new Date(); d.setHours(12,0,0,0);
    var add = (want - d.getDay() + 7) % 7; if(add === 0) add = 7;   // never today
    d.setDate(d.getDate() + add); return d;
  }
  function buildSlots(){
    var box = $('#slots'); box.innerHTML = '';
    SLOT_PLAN.forEach(function(p,i){
      var d = nextSlotDate(i);
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'slot'; b.setAttribute('aria-pressed', String(SLOT === i));
      b.dataset.i = i;
      b.innerHTML = '<b>' + T.days[p[0]] + ' ' + p[1] + '</b><i>' +
        d.toLocaleDateString(L === 'it' ? 'it-IT' : 'en-GB', {day:'numeric', month:'short'}) + '</i>';
      b.addEventListener('click', function(){
        SLOT = i;
        $$('.slot').forEach(function(s){ s.setAttribute('aria-pressed', String(+s.dataset.i === SLOT)); });
      });
      box.appendChild(b);
    });
  }

  /* tabs ----------------------------------------------------------------- */
  function setKind(k){
    KIND = k;
    $('#tabCall').setAttribute('aria-selected', String(k === 'call'));
    $('#tabProj').setAttribute('aria-selected', String(k === 'project'));
    $('#row-slots').hidden  = (k !== 'call');
    $('#row-budget').hidden = (k === 'call');
  }
  $$('[data-tab]').forEach(function(b){ b.addEventListener('click', function(){ setKind(b.dataset.tab); }); });

  /* CTA clicks ----------------------------------------------------------- */
  $$('[data-cta]').forEach(function(a){
    a.addEventListener('click', function(){
      setKind(a.dataset.go === 'project' ? 'project' : 'call');
      try{ fbq('track','InitiateCheckout',{content_name:a.dataset.cta}); }catch(e){}
      setTimeout(function(){ var n = $('#f-name'); if(n && window.innerWidth > 720) n.focus({preventScroll:true}); }, 650);
    });
  });

  /* utm ------------------------------------------------------------------ */
  function utm(){
    var p = new URLSearchParams(location.search), keep = [];
    ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid','ad_id'].forEach(function(k){
      var v = p.get(k); if(v) keep.push(k + '=' + v.slice(0,120));
    });
    return keep.length ? '\n[' + keep.join(' · ') + ']' : '';
  }

  /* submit --------------------------------------------------------------- */
  function ymd(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function showErr(msg){ var e = $('#err'); e.textContent = msg; e.classList.add('on'); }

  $('#lead').addEventListener('submit', function(ev){
    ev.preventDefault();
    $('#err').classList.remove('on');

    var name = $('#f-name').value.trim(), email = $('#f-email').value.trim();
    if(!name || email.indexOf('@') < 1 || email.indexOf('.', email.indexOf('@')) < 0){
      showErr(T.errFields); (!name ? $('#f-name') : $('#f-email')).focus(); return;
    }

    var btn = $('#send'), label = btn.querySelector('span');
    btn.disabled = true; label.textContent = T.btnSending;

    var body = {
      p_kind    : KIND,
      p_name    : name,
      p_email   : email,
      p_phone   : $('#f-phone').value.trim(),
      p_company : $('#f-company').value.trim(),
      p_type    : $('#f-type').value,
      p_budget  : KIND === 'call' ? '' : $('#f-budget').value,
      p_message : $('#f-msg').value.trim() + utm(),
      p_code    : CFG.CODE,
      p_hp      : $('#f-hp').value,
      p_timezone: CFG.TZ
    };
    if(KIND === 'call' && SLOT !== null){
      body.p_slot_date = ymd(nextSlotDate(SLOT));
      body.p_slot_time = SLOT_PLAN[SLOT][1];
    }

    fetch(CFG.SUPA_URL + '/rest/v1/rpc/lp_lead', {
      method : 'POST',
      headers: {'Content-Type':'application/json', 'apikey':CFG.SUPA_KEY, 'Authorization':'Bearer ' + CFG.SUPA_KEY},
      body   : JSON.stringify(body)
    })
    .then(function(r){ return r.text().then(function(t){ return {ok:r.ok, status:r.status, text:t}; }); })
    .then(function(res){
      if(!res.ok){
        var code = ''; try{ code = (JSON.parse(res.text) || {}).code || ''; }catch(e){}
        throw {kind: code === '53400' ? 'many' : (code === '22023' ? 'fields' : 'generic')};
      }
      var ref = ''; try{ ref = JSON.parse(res.text); }catch(e){ ref = res.text; }
      ref = String(ref || '').replace(/^"|"$/g, '');

      $('#formArea').hidden = true;
      $('#doneArea').hidden = false;
      $('#refOut').textContent = ref || '—';
      var os = $('#okSlot');
      if(KIND === 'call' && SLOT !== null){
        var d = nextSlotDate(SLOT);
        var pretty = T.days[SLOT_PLAN[SLOT][0]] + ' ' +
          d.toLocaleDateString(L === 'it' ? 'it-IT' : 'en-GB', {day:'numeric', month:'long'}) +
          ', ' + SLOT_PLAN[SLOT][1];
        os.innerHTML = T.okSlot.replace('{slot}', pretty); os.hidden = false;
      } else { os.hidden = true; }
      $('#doneArea').scrollIntoView({block:'center', behavior:'smooth'});
      try{
        fbq('track', KIND === 'call' ? 'Schedule' : 'Lead',
            {content_name:'lp-' + KIND, content_category:body.p_type, currency:'EUR', value:1});
      }catch(e){}
    })
    .catch(function(e){
      btn.disabled = false; label.textContent = T.btnSend;
      showErr(e && e.kind === 'many' ? T.errMany : e && e.kind === 'fields' ? T.errFields
            : e && e.kind === 'generic' ? T.errGeneric : T.errNet);
    });
  });

  /* reveal + sticky ------------------------------------------------------ */
  if('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(en){
      en.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
    }, {rootMargin:'0px 0px -8% 0px', threshold:.06});
    $$('.reveal').forEach(function(el){ io.observe(el); });
  } else { $$('.reveal').forEach(function(el){ el.classList.add('in'); }); }

  var sticky = $('#sticky'), form = $('#start');
  function onScroll(){
    var past = window.scrollY > window.innerHeight * .75;
    var r = form.getBoundingClientRect();
    var inForm = r.top < window.innerHeight * .9 && r.bottom > 0;
    sticky.classList.toggle('on', past && !inForm);
  }
  window.addEventListener('scroll', onScroll, {passive:true});
  window.addEventListener('resize', onScroll, {passive:true});

  /* boot ----------------------------------------------------------------- */
  applyLang(pickLang());
  setKind('call');
  onScroll();
})();
</script>
</body>
</html>
